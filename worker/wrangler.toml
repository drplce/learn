name = "acorn-chat"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
# Only this origin may call the Worker. Set it to the app's URL before deploying.
ALLOWED_ORIGIN = "https://drplce.github.io"

# Which model answers her. Change and redeploy to compare tone.
#   claude-haiku-4-5  — cheapest and fastest, can read a bit flat
#   claude-sonnet-5   — warmth worth the extra ~$4/year at one chat a day
#   claude-opus-5     — the most nuanced, and overkill for two sentences
MODEL = "claude-sonnet-5"

# Secrets are NOT set here — they would end up in git. Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put APP_TOKEN
