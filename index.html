/* A backup nobody can put back is not a backup. This is the only way in, and it
   goes through load() so a hand-edited or truncated file meets exactly the same
   hardening as anything already in storage. Nothing is written until the text has
   been read and found to be hers, and the old state is put back if it is not. */
function looksLikeBackup(text){
  var o;
  try{ o = JSON.parse(text); }catch(e){ return null; }
  if(!o || typeof o !== 'object' || Array.isArray(o)) return null;
  var w = o.words;
  if(!w || typeof w !== 'object') return null;
  if(!Array.isArray(w.lists) && !w.mastery && !Array.isArray(w.sessions)) return null;
  return o;
}
function restore(btn){
  var box = el('#restore'), text = box ? box.value.trim() : '';
  if(!text){ toast('Paste the backup text in the box first.'); return; }
  var o = looksLikeBackup(text);
  if(!o){ toast('That does not look like a backup from this app.'); return; }

  var words = Object.keys((o.words && o.words.mastery) || {}).length;
  var lists = ((o.words && o.words.lists) || []).length;
  var sits  = ((o.words && o.words.sessions) || []).length;
  var summary = words + (words === 1 ? ' word' : ' words') + ', '
              + lists + (lists === 1 ? ' saved list' : ' saved lists') + ', '
              + sits + (sits === 1 ? ' sitting' : ' sittings');

  if(!btn.dataset.armed){
    btn.dataset.armed = '1';
    btn.classList.add('danger');           // it is about to replace everything
    btn.textContent = 'Tap again to replace everything with: ' + summary;
    setTimeout(function(){ if(btn.isConnected){ delete btn.dataset.armed; render(); } }, 6000);
    return;
  }

  var before = null;
  try{ before = localStorage.getItem(KEY); }catch(e){}
  try{
    localStorage.setItem(KEY, JSON.stringify(o));
    load();
    // load() falls back to a blank slate on anything it cannot use, which would
    // be a silent wipe. Check it took, and undo if it did not.
    if(!S || !S.words || typeof S.words.mastery !== 'object') throw new Error('did not take');
    save();
    go('day');
    if(!start()) render();
    toast('Restored: ' + summary);
  }catch(e){
    try{ if(before !== null) localStorage.setItem(KEY, before); }catch(e2){}
    load(); render();
    toast('That backup could not be restored. Nothing was changed.');
  }
}

/* =========================================================
   The shape of what she knows. Every word she has met is here, and a few days of
   what is coming next as faint outlines waiting to be filled — a word that slips
   back dims rather than vanishing. Words cluster into the pattern family they
   belong to, and a hairline joins words that share a spelling chunk, because that
   is the structure she is actually learning: "or" is what morning, sorted and
   report have in common.
   The layout is deterministic. It has to be the same shape every time or it is
   decoration rather than her map.
   ========================================================= */
var NET_W = 320, GOLDEN = 2.39996323;
// How much bigger the sketch line round an unmet word is than the word itself.
var SKETCH_R = 1.07;
/* The frame is fitted to the drawing rather than squared up, and this is the one
   thing it is not allowed to do: be taller than this much of its own width. The
   picture takes its width from her column and its height from this ratio, so a
   frame twice as tall as it is wide would push the words under it off the screen.
   Only that way round — a drawing that comes out wide and low costs her nothing.
   See the fit in networkData(). */
var NET_TALL = 1.25;

/* How far ahead the outlines reach. Every word she has met stays on the map for
   good, but an unmet one is only worth drawing while it is nearly here: a hundred
   empty outlines from the first day said more about how much there is to get
   through than about her.
   So it is a few days of new words at the pace she is actually on —
   newWordsToday() is 0 to 3, and 3 on her very first sitting — taken from the
   open list in the order buildSession() will introduce them. The floor is the
   most she can be learning at once, so a hard week (which earns no new words at
   all) still leaves something waiting rather than a bare shape; the ceiling keeps
   a good run from ghosting half the list again. */
/* Not the pace she is on, though: following it made the picture go backwards.
   newWordsToday() answers 3 before her first sitting and 1 after it, so her very
   first evening of practice took the shape from twelve outlines down to four —
   she does some work and her map gets smaller. */
/* And not a fixed dozen either, which is what it was: twelve empty outlines on
   her first evening is a picture that starts big and blank and spends a term
   filling up. It starts at two sittings' worth of new words — six, the three she
   meets tonight and the three behind them — and widens by one for every five
   words she has met. So the first evening is a handful of shapes she is about to
   fill, and by the time a hundred are behind her the map looks that much further
   ahead as well.
   Words met, and not words known well or the pace she is on, because it is the
   only one of those that cannot go down. A horizon that retracted after a bad
   week would be taking shapes off her map for having a bad week. The ceiling is
   there so a good run does not end up ghosting a whole list she has not
   started. */
var GHOST_MIN = 6, GHOST_MAX = 14, GHOST_PER_MET = 5;
// Every word she has ever met, whatever list it came from and however long ago:
// the one measure of how far she has come that can only ever go up.
function wordsMet(){ return Object.keys(S.words.mastery || {}).length; }
function ghostAhead(){
  return Math.min(GHOST_MAX, GHOST_MIN + Math.floor(wordsMet() / GHOST_PER_MET));
}

/* How big the whole picture is drawn, as a share of the width it is given. Her
   first evening had it at full size whatever was on it, which reads as a fixed
   box slowly filling up rather than as something of hers getting bigger; it now
   starts at a little under two thirds and reaches full width at GROW_FULL words.
   Nothing inside it moves: the frame and every cell keep the places they had, the
   whole drawing is simply scaled, so this is one thing growing and not a layout
   rearranging itself. Off words met again, for the same reason as the horizon —
   a picture that got smaller after a hard week would be telling her she had gone
   backwards. */
var GROW_MIN = 0.62, GROW_FULL = 80;
function netGrow(){
  return GROW_MIN + (1 - GROW_MIN) * Math.min(1, wordsMet() / GROW_FULL);
}
// The unmet words she is about to meet: the front of the open list, in the order
// the engine takes them.
function ghostWords(){
  var want = ghostAhead(), out = {}, n = 0;
  wordsOf(activeList()).forEach(function(w){
    if(S.words.mastery[w] || out[w] || n >= want) return;
    out[w] = true; n++;
  });
  return out;
}

// A small deterministic generator, so the jitter that keeps this from looking
// mechanical is the same jitter every time.
function seeded(str){
  var h = 2166136261;
  for(var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){
    h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13;
    return ((h >>> 0) % 100000) / 100000;
  };
}

/* Each word gets its own shape, seeded by the word itself, so no two are the same
   and none of them is a circle. Bigger for a longer word, but only a little —
   enough to give the colony texture, not enough to read as a ranking. */
function cellPoints(w, x, y, r){
  var rnd = seeded('shape' + w), n = 7, pts = [];
  for(var i = 0; i < n; i++){
    var a = (i / n) * Math.PI * 2 + (rnd() - .5) * 0.35;
    var rr = r * (0.8 + rnd() * 0.4);
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  return pts;
}
/* How far an outline actually reaches, so the frame can be fitted to the shapes
   themselves rather than to circles drawn around them — the difference is the
   width of a cell, which is the difference between the colony filling the picture
   and sitting inside a margin of nothing. Each piece of the outline is a
   quadratic, so its extreme is either one of its ends or its one turning point. */
function cellBounds(w, x, y, r){ return blobBounds(cellPoints(w, x, y, r)); }
function blobBounds(pts){
  var n = pts.length;
  var lo = [Infinity, Infinity], hi = [-Infinity, -Infinity];
  function see(k, v){ if(v < lo[k]) lo[k] = v; if(v > hi[k]) hi[k] = v; }
  for(var j = 0; j < n; j++){
    var p = pts[j], q = pts[(j + 1) % n], nx = pts[(j + 2) % n];
    for(var k = 0; k < 2; k++){
      var A = (p[k] + q[k]) / 2, B = q[k], C = (q[k] + nx[k]) / 2, den = A - 2 * B + C;
      see(k, A); see(k, C);
      if(!den) continue;
      var t = (A - B) / den;
      if(t > 0 && t < 1) see(k, A + 2 * t * (B - A) + t * t * den);
    }
  }
  return {x0:lo[0], y0:lo[1], x1:hi[0], y1:hi[1]};
}
function cellPath(w, x, y, r){ return blobPath(cellPoints(w, x, y, r)); }
/* The outline itself: a closed curve through the midpoints of the ring, each
   piece a quadratic bending towards the point between them. Nothing in here has
   a corner, and it works for any number of points — seven for a word, three for
   the mark in her header, which is what keeps the two of a piece. */
function blobPath(pts){
  var n = pts.length, d = '';
  for(var j = 0; j < n; j++){
    var p = pts[j], q = pts[(j + 1) % n];
    var mid = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    if(!j) d = 'M' + mid[0].toFixed(1) + ' ' + mid[1].toFixed(1);
    var nx = pts[(j + 2) % n];
    d += 'Q' + q[0].toFixed(1) + ' ' + q[1].toFixed(1) + ' '
       + ((q[0] + nx[0]) / 2).toFixed(1) + ' ' + ((q[1] + nx[1]) / 2).toFixed(1);
  }
  return d + 'Z';
}

/* A few fine hairs out of the core to each head. Each one wanders: walked out in
   steps with a small sideways drift at every one, then smoothed, so no line in
   here is straight. A ruled line is the thing that gives a drawing like this away
   as a diagram.
   They are worked out before the drawing because the frame has to know where they
   reach — see the fit below. A hair's path comes from its frond and the core, both
   of which are fixed by the lists she has going, so it is in the same place on the
   day she starts a list as it is a year later.

   The core is the middle of the picture, and it used to be the middle of the
   layout square instead: (160, 160), the point every frond was laid out around.
   With all her lists going those are the same place, and it looked right. With one
   or two lists going they are nowhere near each other, and the square's middle is
   an artefact of the coordinate space rather than anything in her map — so ten
   threads left two clusters of words, ran a long way down past the last of them
   and met at a knot in the empty part of the picture. That is what the owner was
   looking at when they said it was a bunch of balloons on strings, and they were
   right: strings to a point where there is nothing are what balloons have.
   A hair now runs from the middle of the picture to its frond's own head, however
   many fronds there are. With every list going that is the drawing it always was.
   With two, the core sits between the two families and the threads pass between
   them, which is one body with two lobes and not two bunches on a knot.

   And with one family the head holds the core, so there is no tip to reach for at
   all. Then the hairs run out of the middle to the words themselves: one per
   direction, each ending on the word that is farthest out that way, so a hair
   always finishes under a shape rather than in the open. Fine threads through a
   cluster read as the veins of one body; the same threads carried out past the
   last word read as legs, which is what the first attempt at this looked like. */
function hairPaths(fronds, core, solo){
  var out = [];
  fronds.forEach(function(f){
    var rnd = seeded('hair' + f.id);
    var n = solo ? solo.tips.length : 5;
    var ox = core.x, oy = core.y;
    for(var h = 0; h < n; h++){
      var dir, len;
      if(solo){
        // Out to the far side of the word, so the thread is hidden by the shape it
        // ends on rather than stopping short of it in plain view.
        var tip = solo.tips[h];
        dir = Math.atan2(tip[1] - oy, tip[0] - ox);
        len = Math.hypot(tip[0] - ox, tip[1] - oy) + tip[2] * 0.9;
        rnd();                    // keep the two draws a hair takes, so the wander
        rnd();                    // below is the same walk in both kinds of frond
      }else{
        dir = Math.atan2(f.hy - oy, f.hx - ox) + (h - 2) * 0.055 + (rnd() - .5) * 0.05;
        len = Math.hypot(f.hx - ox, f.hy - oy) * (0.84 + rnd() * 0.2);
      }
      var steps = 7, pts = [[ox, oy]], drift = 0;
      for(var i = 1; i <= steps; i++){
        var t = i / steps;
        // The wander grows with distance from the core, like something reaching —
        // except where the hair has a word to land on, and then it bows out and
        // comes back, so the far end finishes under the shape and not beside it.
        drift += (rnd() - .5) * len * 0.075;
        var bow = solo ? t * (1 - t) * 2.2 : t;
        var ang = dir + f.bend * 0.55 * (solo ? bow : t * t);
        pts.push([ox + Math.cos(ang) * len * t + Math.cos(ang + Math.PI / 2) * drift * bow,
                  oy + Math.sin(ang) * len * t + Math.sin(ang + Math.PI / 2) * drift * bow]);
      }
      var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
      for(var j = 1; j < pts.length - 1; j++)
        d += 'Q' + pts[j][0].toFixed(1) + ' ' + pts[j][1].toFixed(1) + ' '
           + ((pts[j][0] + pts[j+1][0]) / 2).toFixed(1) + ' '
           + ((pts[j][1] + pts[j+1][1]) / 2).toFixed(1);
      d += 'T' + pts[pts.length-1][0].toFixed(1) + ' ' + pts[pts.length-1][1].toFixed(1);
      out.push({d:d, pts:pts});
    }
  });
  return out;
}

/* Branches out of a core rather than lobes in a ring: each spelling pattern is a
   frond, its words strung along and gathered at the tip. Nothing here is a
   circle and nothing is evenly spaced, which is what stops it reading as a
   diagram. */
function networkData(){
  /* This is a map of her words, not of the lists — so a word is on it once even
     when it is on two lists. "said" and "they" turn up on half the sight-word
     lists anyone would paste in, and counting them twice both inflated "in all"
     and drew the same word as two unconnected cells, one of which got none of
     the filaments. A word belongs to the earliest list that has it, which is
     also the pattern it was first taught as, since lists run easiest first. */
  var claimed = {};
  var lists = allLists().map(function(l){
    var mine = wordsOf(l).filter(function(w){
      if(claimed[w]) return false;
      claimed[w] = true; return true;
    });
    return {list:l, words:mine};
  }).filter(function(g){ return g.words.length; });
  if(!lists.length) return null;
  var rnd = seeded(lists.map(function(g){ return g.list.id + g.words.length; }).join('|'));
  var cx = NET_W / 2, cy = NET_W / 2;
  // "In all" is every word on her lists, counted once — the whole corpus, not the
  // part of it that is drawn today. It is the honest answer to how many there are,
  // and the hint under the picture says which of the two it is.
  var total = lists.reduce(function(n, g){ return n + g.words.length; }, 0);
  var laid = [], fronds = [], byWord = {};

  /* Every word is laid out, whether it is drawn or not, so a cell's place is
     fixed by its list and its position in it and by nothing else. The outlines
     that are drawn move forward as she meets words; the colony itself never
     shifts, because a map that reshuffled when she learned a word would be
     decoration rather than hers. */
  lists.forEach(function(g, li){
    var l = g.list, words = g.words;
    // Uneven angles and lengths: a perfect star is a diagram.
    var a = (li / lists.length) * Math.PI * 2 - Math.PI / 2 + (rnd() - .5) * 0.55;
    var reach = NET_W * (0.27 + 0.09 * Math.sqrt(words.length / Math.max(4, total / lists.length))
                         + (rnd() - .5) * 0.06);
    var bend = (rnd() - .5) * 0.9;                 // the frond curves as it goes
    var frond = {a:a, reach:reach, bend:bend, id:l.id, name:l.name, i:li};
    fronds.push(frond);

    /* Most of a family gathers into a head at the tip; the last few of the list
       trail back down the stem, which is what keeps it from looking like a
       lollipop. The last few rather than the first few, because the head fills
       from the middle outwards: that puts the words she meets first at the heart
       of the family and grows the shape outwards from there, and it keeps the near
       horizon — which is always the front of the list — from being nothing but
       stem. The stem sits close under the head so a family on its own is a club
       rather than a spoke; on the day she has one list going, that is the whole
       picture. */
    var stemN = Math.min(3, Math.floor(words.length * 0.25));
    var headN = words.length - stemN;
    var tipA = a + bend * 0.55;
    var hx = Math.cos(tipA) * reach, hy = Math.sin(tipA) * reach;
    var headR = NET_W * (0.05 + 0.05 * Math.sqrt(headN / 12));
    // Where the hairs are aiming: the head itself, in the same coordinates as the
    // cells, rather than an angle and a length off a core that has since moved.
    frond.hx = cx + hx; frond.hy = cy + hy; frond.headR = headR;

    words.forEach(function(k_w, k){
      var px, py;
      if(k < headN){
        // Phyllotaxis inside the head: even, dense, and not a grid.
        var pr = headR * Math.sqrt((k + 0.5) / headN);
        var pa = k * GOLDEN + rnd() * 0.25;
        px = hx + Math.cos(pa) * pr; py = hy + Math.sin(pa) * pr;
      }else{
        var t2 = 0.6 + 0.28 * ((k - headN + 0.6) / Math.max(1, stemN));
        var aa2 = a + bend * t2 * t2;
        var off = (rnd() - .5) * NET_W * 0.055;
        px = Math.cos(aa2) * reach * t2 + Math.cos(aa2 + Math.PI/2) * off;
        py = Math.sin(aa2) * reach * t2 + Math.sin(aa2 + Math.PI/2) * off;
      }
      var box = mastery(k_w).box || 1;
      laid.push({w:k_w, x:cx + px, y:cy + py,
                 // Subtle: a long word is a bigger cell, a short one smaller.
                 r:3.1 + Math.min(9, k_w.replace(/[^a-z']/gi, '').length) * 0.42,
                 box:box, met:!!S.words.mastery[k_w], frond:li});
    });
  });

  /* What is drawn: everything she has met — progress is never hidden — and the
     near horizon of unmet words from the open list. */
  var ghost = ghostWords();
  var cells = laid.filter(function(c){ return c.met || ghost[c.w]; });
  cells.forEach(function(c){ byWord[c.w] = c; });
  // A frond with nothing drawn on it gets no hairs either: a handful of threads
  // reaching out to an empty tip is a promise about a list she has not started.
  var live = {};
  cells.forEach(function(c){ live[c.frond] = true; });
  fronds = fronds.filter(function(f){ return live[f.i]; });

  /* The frame is a camera, not the layout: it crops in, so a dozen outlines fill
     the picture as well as a hundred do rather than sitting in a corner of an
     empty square. The strokes are pinned to the screen, so cropping in does not
     turn the hairlines into ropes, and a floor on the frame stops two or three
     cells being blown up like a poster.

     What it is fitted to is every list she has started plus the open one — not to
     what happens to be drawn. A camera that follows the drawn set re-frames every
     time she meets a word, and then the whole colony slides and rescales under
     her: measured on a 375px screen, all seven cells moved and grew when she
     learned three words. It only widens when she starts a new list, which is the
     one time her map really has got bigger.

     The hairs are fitted too, and that is the whole reason they are worked out
     around here rather than while drawing: they can reach past the outermost cell,
     and .net{overflow:hidden} would crop them where they left. It costs nothing in
     stability, because a hair's path comes from its frond and the frame's own
     middle, both of which are fixed by which lists she has going.

     It crops to the drawing and not to a square. Squaring up was the last of the
     dead margin the owner could see: at eight words met the drawing was 98 units
     across in a frame 150 wide, so more than half the picture was cream. A frame
     that is the shape of the drawing has none of that; the only shape it refuses
     is a tall one — see NET_TALL — and it refuses it by widening rather than by
     cropping anything out. The breathing room is a share of the drawing rather
     than a fixed number of units, so the margin looks the same on the evening
     there are six outlines as it does with a hundred cells on. */
  var framed = {};
  laid.forEach(function(c){ if(c.met) framed[c.frond] = true; });
  lists.forEach(function(g, li){ if(g.list.id === (activeList() || {}).id) framed[li] = true; });
  var inFrame = laid.filter(function(c){ return framed[c.frond]; });
  if(!inFrame.length) inFrame = cells;
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  inFrame.forEach(function(c){
    // The sketch line round an unmet word reaches a little further than the word.
    var b = cellBounds(c.w, c.x, c.y, c.r);
    if(!c.met){
      var sb = cellBounds(c.w + '~', c.x, c.y, c.r * SKETCH_R);
      b = {x0:Math.min(b.x0, sb.x0), x1:Math.max(b.x1, sb.x1),
           y0:Math.min(b.y0, sb.y0), y1:Math.max(b.y1, sb.y1)};
    }
    x0 = Math.min(x0, b.x0); x1 = Math.max(x1, b.x1);
    y0 = Math.min(y0, b.y0); y1 = Math.max(y1, b.y1);
  });
  /* The core the hairs come out of: the middle of the picture, which is the middle
     of the words the frame is fitted to. See hairPaths for why it is not the middle
     of the layout square any more — this is the balloons-on-strings fix, and it is
     why the hairs are worked out here rather than above the cells they need.
     Fitted to the same stable set as the frame, so it moves when she starts a list
     and at no other time. */
  var core = {x:(x0 + x1) / 2, y:(y0 + y1) / 2};
  /* One family, and then there is no head to reach for: the core is inside it. The
     hairs go out to the word farthest from the middle in each of seven directions
     round it instead.
     Her words, not the drawn ones. A hair's path has to be the same on the day she
     starts the list as it is a year later, or the threads reshuffle every time she
     learns something; and aiming at laid cells keeps every hair within a whisker of
     the box those cells already set, so the frame barely moves for them. */
  var solo = null;
  if(fronds.length === 1 && inFrame.length){
    var sect = [];
    inFrame.forEach(function(c){
      var dd = Math.hypot(c.x - core.x, c.y - core.y);
      if(dd < NET_W * 0.02) return;               // a word sitting on the middle
      var s = Math.floor((Math.atan2(c.y - core.y, c.x - core.x) + Math.PI)
                         / (Math.PI * 2) * 7) % 7;
      if(!sect[s] || dd > sect[s][3]) sect[s] = [c.x, c.y, c.r, dd];
    });
    var tips = sect.filter(Boolean);
    if(tips.length) solo = {tips:tips};
  }
  var hairs = hairPaths(fronds, core, solo);
  // Each stretch of a hair is a curve between two of these points, and a curve
  // never leaves the box its points sit in, so the points are the whole reach.
  hairs.forEach(function(h){
    h.pts.forEach(function(p){
      x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]);
      y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
    });
  });
  if(!inFrame.length && !hairs.length){ x0 = y0 = 0; x1 = y1 = NET_W; }
  var floor = NET_W * 0.18, w = Math.max(x1 - x0, floor), h = Math.max(y1 - y0, floor);
  w = Math.max(w, h / NET_TALL);              // widened, never cropped
  var pad = Math.max(w, h) * 0.012;
  var view = {x:(x0 + x1) / 2 - w / 2 - pad, y:(y0 + y1) / 2 - h / 2 - pad,
              w:w + pad * 2, h:h + pad * 2};

  /* A hairline where two words share a chunk, and only where the chunk is
     telling: one that turns up in a dozen words says nothing.
     There are fewer of these than the picture wants, and it is worth knowing why:
     both ends have to be drawn, and two words that share a chunk usually sit a
     long way apart in the list, so the near horizon rarely covers both. Counted
     on her real lists, none at all at six words met and one at thirty. That is
     why the caption below only mentions them when there are some — a caption
     describing something that is not on the screen is worse than none. */
  var byPiece = {};
  cells.forEach(function(c){
    splitOf(c.w).forEach(function(p){
      if(p.length < 2) return;
      (byPiece[p] = byPiece[p] || []).push(c.w);
    });
  });
  /* Two control points with opposite-ish offsets: a lazy S rather than an arc.
     They are what makes it lazy, and pushed out sideways they can carry the curve
     out of the picture even though both of its ends are cells sitting safely
     inside it — the other half of the hairlines-off-the-edge complaint. A curve
     stays inside the box its control points are in, so holding those just inside
     the frame is enough, and it only bites on the handful of filaments that were
     bulging out anyway. It has to happen after the frame, which is why the
     filaments are worked out here rather than above the fit. */
  function held(p){
    return [Math.min(view.x + view.w - 1, Math.max(view.x + 1, p[0])),
            Math.min(view.y + view.h - 1, Math.max(view.y + 1, p[1]))];
  }
  var links = [], far = NET_W * 0.34;
  Object.keys(byPiece).forEach(function(p){
    var ws = byPiece[p];
    if(ws.length < 2 || ws.length > 4) return;
    for(var i = 1; i < ws.length && links.length < 110; i++){
      var A = byWord[ws[i-1]], B = byWord[ws[i]];
      if(!A || !B || Math.hypot(A.x - B.x, A.y - B.y) > far) continue;
      var rnd = seeded('lnk' + p + A.w + B.w);
      var dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      var nx = -dy / len, ny = dx / len;
      var o1 = (rnd() - .35) * len * 0.22, o2 = (rnd() - .65) * len * 0.22;
      links.push({a:A, b:B, piece:p,
                  p1:held([A.x + dx * 0.33 + nx * o1, A.y + dy * 0.33 + ny * o1]),
                  p2:held([A.x + dx * 0.67 + nx * o2, A.y + dy * 0.67 + ny * o2])});
    }
  });

  return {cells:cells, fronds:fronds, links:links, hairs:hairs, grow:netGrow(),
          total:total, cx:cx, cy:cy, view:view,
          known:cells.filter(function(c){ return c.box >= KNOWN_BOX; }).length,
          met:cells.filter(function(c){ return c.met; }).length};
}

function renderNetwork(d){
  if(!d) return '';
  /* One picture, one label. role="img" is supposed to make the children
     presentational, but browsers do not prune SVG shapes that carry a <title>:
     without aria-hidden a screen reader walks a hundred word-shaped nodes in
     layout order, which is the word list read out scrambled and with no idea
     which ones she knows. Every shape below is hidden by hand and the whole
     thing says its numbers once. The <title>s stay — they are the hover
     tooltip, which is the only thing they are good for. */
  var svg = '<svg class="net" viewBox="' + d.view.x.toFixed(1) + ' ' + d.view.y.toFixed(1)
    + ' ' + d.view.w.toFixed(1) + ' ' + d.view.h.toFixed(1) + '"'
    // Small at the start and bigger as she gets on; see netGrow(). The frame is
    // untouched, so this scales the whole drawing and moves nothing within it.
    + ' style="width:' + (d.grow * 100).toFixed(1) + '%" role="img" aria-label="'
    + 'A growing picture of her words, grouped by spelling pattern: '
    + d.met + ' met, ' + d.known + ' known well, ' + d.total + ' in all">';

  d.hairs.forEach(function(h){
    svg += '<path class="net-hair" aria-hidden="true" d="' + h.d + '"/>';
  });

  d.links.forEach(function(k){
    svg += '<path class="net-link' + (k.a.met && k.b.met ? ' lit' : '') + '" aria-hidden="true" d="M'
        + k.a.x.toFixed(1) + ' ' + k.a.y.toFixed(1)
        + 'C' + k.p1[0].toFixed(1) + ' ' + k.p1[1].toFixed(1) + ' '
        + k.p2[0].toFixed(1) + ' ' + k.p2[1].toFixed(1) + ' '
        + k.b.x.toFixed(1) + ' ' + k.b.y.toFixed(1) + '"/>';
  });

  /* A word she has not met is sketched rather than drawn: a second line round it,
     the same word's shape at a different jitter and a hair's width bigger, so the
     two lines open and close around each other the way a pen does when it goes
     round twice. It arrived by accident — two outlines happened to overlap and
     looked hand-drawn — and it earns its place, because a word that is only coming
     up should look provisional. A word she has met is one confident shape, and the
     difference between the two is now something you can see across the room. */
  d.cells.forEach(function(c){
    if(c.met) return;
    svg += '<path class="net-sketch" aria-hidden="true" d="'
        + cellPath(c.w + '~', c.x, c.y, c.r * SKETCH_R) + '"/>';
  });

  /* Every cell gets the paper painted in behind it first. A word she has not met
     yet is a hollow outline, and the hairs run under the cells to reach the words
     they land on — so the thread showed straight through the empty ones and a faint
     outline with a line through it reads as crossed out. Which is the opposite of
     what an outline means here: it is a word she is coming to, not one she has
     lost. Two paths for the same shape is cheap; the alternative is stopping the
     threads short of the words they belong to. */
  d.cells.forEach(function(c){
    svg += '<path class="net-plate" aria-hidden="true" d="'
        + cellPath(c.w, c.x, c.y, c.r) + '"/>';
  });

  d.cells.forEach(function(c){
    // Ghosted until she meets it, then darker with every box it climbs.
    var fill = c.met ? (0.18 + 0.82 * Math.min(1, (c.box - 1) / (KNOWN_BOX - 1))) : 0;
    svg += '<path class="net-cell' + (c.met ? ' met' : '') + (c.box >= KNOWN_BOX ? ' well' : '')
        + '" aria-hidden="true" d="' + cellPath(c.w, c.x, c.y, c.r) + '" style="--f:' + fill.toFixed(2) + '"'
        + ' data-x="' + Math.round(c.x) + '" data-y="' + Math.round(c.y) + '"'
        + ' data-r="' + c.r.toFixed(1) + '"><title>' + esc(c.w) + '</title></path>';
  });
  svg += '</svg>';

  return '<div class="sect"><h2>What she knows</h2>' + svg
    + '<div class="hint">Every word she has met is here, and the few she is coming to '
    + 'next as faint outlines. The picture starts small and grows: the outlines reach a '
    + 'little further ahead with every few words she meets, and the rest of her lists '
    + 'are not drawn until she is close to them, because a hundred empty outlines says '
    + 'more about how far there is to go than about her. '
    + 'They fill in and darken as she learns them, and a word she is losing dims '
    + 'rather than disappearing. Each frond is one spelling pattern'
    /* Only when there are some. Two words sharing a chunk are usually a good way
       apart in the list, so both ends of a filament are rarely inside the near
       horizon: there are none at all until she is thirty or so words in. The copy
       promised a grown-up something that was not on the screen, and a caption that
       describes a picture you are not looking at is worse than no caption. */
    + (d.links.length
        ? '; the hairlines join words that share a chunk — <b>or</b> is what '
          + 'morning, sorted and report have in common. '
        : '. ')
    + d.met + ' met, <b>' + d.known + ' known well</b>, '
    + d.total + ' in all on her lists.</div></div>';
}

// Has she already finished a sitting on this list today? Keyed to the list,

}
function go(s){

  // Landing on her screen with no session used to render "All done for today",

/* =========================================================
   10. Events — one delegated handler. unlock() on every tap so
   iOS lets sound and speech through later.
   ========================================================= */
document.addEventListener('click', function(ev){
  var t = ev.target, hit;
  unlock();

  if((hit = t.closest('[data-go]'))){ go(hit.dataset.go); return; }
  if(t.closest('#again')){ if(!start()) toast('Nothing to practise just now.'); return; }
  if(t.closest('#cover')){ W.stage = 'write'; render(); return; }
  if(t.closest('#check')){ check(); return; }
  if(t.closest('#next')) { next(); return; }
  if(t.closest('#hear')) { var w = word(); if(w) say(w, {force:true}); return; }
  if((hit = t.closest('[data-syl]'))){ say(hit.dataset.syl, {force:true, rate:sylRate()}); return; }
  if((hit = t.closest('[data-hear]'))){ say(hit.dataset.hear, {force:true}); return; }

  // ---- grown-ups
  if((hit = t.closest('[data-ra]'))){ S.settings.readAloud = hit.dataset.ra === '1'; save(); render(); return; }
  if((hit = t.closest('[data-sn]'))){ S.settings.sound = hit.dataset.sn === '1'; save(); render(); if(S.settings.sound) chime('right'); return; }
  if((hit = t.closest('[data-sc]'))){ S.settings.textScale = Number(hit.dataset.sc); save(); render(); return; }
  if((hit = t.closest('[data-tn]'))){ S.settings.tint = hit.dataset.tn; save(); render(); return; }
  if((hit = t.closest('[data-rate]'))){ S.settings.speechRate = Number(hit.dataset.rate); save(); render(); say('Every word counts.', {force:true}); return; }
  if((hit = t.closest('[data-voice]'))){
    S.settings.voice = hit.dataset.voice; _voiceKey = null; save(); render();
    say('Hello ' + (S.profile.name || '') + '. Time to practise.', {force:true});
    return;
  }
  if((hit = t.closest('[data-list]'))){ S.words.activeId = hit.dataset.list; save(); render(); return; }
  if((hit = t.closest('[data-del]'))){
    var b = hit;
    if(b.dataset.armed){
      var id = b.dataset.del;
      S.words.lists = S.words.lists.filter(function(l){ return l.id !== id; });
      if(S.words.activeId === id) S.words.activeId = (allLists()[0] || {}).id;
      save(); render(); toast('List deleted.'); return;
    }
    b.dataset.armed = '1'; b.textContent = 'Tap again to delete';
    setTimeout(function(){ if(b.isConnected){ delete b.dataset.armed; render(); } }, 3000);
    return;
  }
  if(t.closest('#pasteSave')){
    if(looksLikeBackup(el('#paste').value)){
      toast('That is a backup — use Restore, further down.');
      return;
    }
    var words = parseWordList(el('#paste').value);
    if(!words.length){ toast('No words found in that.'); return; }
    var name = (el('#pname2').value || '').trim() || 'Her list';
    var n = S.words.lists.reduce(function(mx, l){ return Math.max(mx, Number(String(l.id).slice(1)) || 0); }, 0);
    var id = 'w' + (n + 1);
    S.words.lists.push({id:id, name:name, words:words});
    S.words.activeId = id;
    save(); render();
    toast(words.length + (words.length === 1 ? ' word saved.' : ' words saved.'));
    return;
  }
  if(t.closest('#cliptest')){ testClip(); return; }
  if(t.closest('#clipsave')){ saveAllClips(); return; }
  if(t.closest('#copy')){
    var text = JSON.stringify(S, null, 2);
    try{
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(text).then(function(){ toast('Progress copied.'); },
                                                 function(){ toast('Could not copy.'); });
      else {
        var a = document.createElement('textarea');
        a.value = text; document.body.appendChild(a); a.select();
        document.execCommand('copy'); a.remove(); toast('Progress copied.');
      }
    }catch(e){ toast('Could not copy.'); }
    return;
  }
  if(t.closest('#restoreGo')){ restore(t.closest('#restoreGo')); return; }
  if(t.closest('#reset')){
    var r = t.closest('#reset');
    if(r.dataset.armed){
      localStorage.removeItem(KEY); load(); go('day');
      if(!start()) render();
      toast('Everything erased.');
      return;
    }
    r.dataset.armed = '1'; r.textContent = 'Tap again to erase everything';
    setTimeout(function(){ if(r.isConnected){ delete r.dataset.armed; r.textContent = 'Erase everything'; } }, 3000);
    return;
  }
});

/* A tap on a button takes focus off the input, and iOS starts closing the
   keyboard the moment that happens — refocusing afterwards is too late, which is
   why holding it open was not enough on the phone. Cancelling the default on
   mousedown stops the focus moving at all, so the keyboard never begins to go.
   The click still fires. Touch only, and never over something she needs to type
   in. */
document.addEventListener('mousedown', function(ev){
  if(_kbd || !touchOnly()) return;
  var t = ev.target;
  if(!t || !t.closest) return;
  if(t.closest('input, textarea')) return;              // she is aiming at a box
  if(!t.closest('button')) return;
  var on = document.activeElement;
  if(!on || (on.tagName !== 'INPUT' && on.tagName !== 'TEXTAREA')) return;
  ev.preventDefault();                                  // focus stays where it is
}, true);

// Belt and braces: if the focus moved anyway, put it back.

// Grown-ups: press and hold ACORN. No PIN to forget, and nothing on her screens
// that looks like a way in. Delegated, because the header is rebuilt every render.
(function(){
  var timer = null;
  function stop(){ clearTimeout(timer); timer = null; }
  document.addEventListener('pointerdown', function(ev){
    if(!ev.target.closest || !ev.target.closest('.wordmark')) return;
    stop();
    timer = setTimeout(function(){ unlock(); go('parent'); }, 700);
  });
  ['pointerup','pointercancel','pointerleave','scroll'].forEach(function(e){
    document.addEventListener(e, stop, true);
  });
  document.addEventListener('contextmenu', function(ev){
    if(ev.target.closest && ev.target.closest('.wordmark')) ev.preventDefault();
  });
})();

  type: function(v){ if(W){ W.attempt = v; if(el('#type')) el('#type').value = v; } },
  session: function(){ return W && {words:W.words.slice(), i:W.i, stage:W.stage, tries:W.tries,
                                     right:W.right, firstTime:W.firstTime, failed:W.failed.slice(),
                                     requeue:W.requeue.slice()}; },
  go: go, screen: function(){ return screen; },
  BOX_DAYS: BOX_DAYS, MAX_BOX: MAX_BOX, KNOWN_BOX: KNOWN_BOX,
  ACQUIRING_CAP: ACQUIRING_CAP, SEED_NEW: SEED_NEW, sessionWords: sessionWords,
  // The map: how far the outlines reach, and the one outline every word carries
  // — the dots on her word screen are the same shapes from the same function.
  ghostAhead: ghostAhead, ghostWords: function(){ return Object.keys(ghostWords()); },
  cellPath: cellPath, dotShape: dotShape
};

/* ---- boot: she opens the app and is on a word ---- */
load();
_renderedDay = todayISO();
loadClips();
if(!start()) render();
})();
</script>
</body>
</html>
