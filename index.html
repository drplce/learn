<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Acorn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Acorn">
<meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#22242A" media="(prefers-color-scheme:dark)">
<meta name="description" content="A calm spelling practice app.">
<style>
/* ===========================================================
   Acorn — spelling practice, dyslexia-friendly by default.
   Cream surface, dark-slate ink (never black), large well-spaced
   type, short lines, left-aligned. One word on screen at a time.
   =========================================================== */
:root{
  --surface:#FBF6EC; --surface-2:#FFFDF7; --ink:#3B4149; --ink-soft:#6E747C;
  --line:rgba(59,65,73,.14); --line-2:rgba(59,65,73,.26);
  --acc:#35705A; --acc-ink:#FFFFFF; --acc-soft:#E4EFE8;
  --good:#3F7D63; --retry:#B4703A;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  --scale:1;
  --shadow:0 1px 2px rgba(59,65,73,.05), 0 6px 18px rgba(59,65,73,.06);
  --ease:cubic-bezier(.22,.61,.36,1);
}
/* Background tints — some readers find a particular tint easier. */
[data-tint="peach"]{--surface:#FBF0E8;--surface-2:#FFF8F2;}
[data-tint="mint"] {--surface:#EDF6F0;--surface-2:#F7FCF9;}
[data-tint="blue"] {--surface:#EDF2F8;--surface-2:#F8FAFD;}
[data-tint="grey"] {--surface:#F2F1EE;--surface-2:#FAFAF8;}

@media (prefers-color-scheme:dark){
  :root{
    --surface:#22242A; --surface-2:#2A2D34; --ink:#E8E3D9; --ink-soft:#A9A49B;
    --line:rgba(232,227,217,.13); --line-2:rgba(232,227,217,.26);
    --acc:#7CC0A2; --acc-ink:#14231C; --acc-soft:#2C3A34;
    --good:#7CC0A2; --retry:#DCA173;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 6px 18px rgba(0,0,0,.24);
  }
  [data-tint]{--surface:#22242A;--surface-2:#2A2D34;}   /* tints are a light-mode comfort */
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  /* rem against the browser's own base, so the OS text-size setting still counts */
  font-size:calc(1.0625rem * var(--scale));
}
html,body{margin:0; min-height:100%; background:var(--surface);}
body{
  color:var(--ink); font-family:var(--sans);
  line-height:1.7; letter-spacing:.01em; word-spacing:.06em; text-align:left;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input,textarea{font:inherit; color:inherit; letter-spacing:inherit;}
button{border:0; background:none; cursor:pointer; touch-action:manipulation;}
h1,h2{line-height:1.3; letter-spacing:0; margin:0; font-weight:700;}

#app{max-width:34rem; margin:0 auto; padding:1.1rem 1.1rem 2.5rem; min-height:100vh; display:flex; flex-direction:column;}
main{flex:1;}

/* ---------- header: wordmark + today's progress ---------- */
.bar{display:flex; align-items:center; gap:.7rem; min-height:2.8rem; margin-bottom:1.2rem;}
.wordmark{font-size:.82rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--acc); user-select:none;}
.bar .sp{flex:1;}
.daybar{flex:none; width:5.5rem; height:.45rem; border-radius:.25rem; background:var(--line); overflow:hidden;}
.daybar i{display:block; height:100%; background:var(--acc); border-radius:.25rem; transition:width .4s var(--ease);}
.back{display:inline-flex; align-items:center; gap:.4rem; min-height:2.9rem; padding:0 .8rem 0 0;
      border-radius:1rem; font-size:.95rem; font-weight:600; color:var(--ink-soft);}

/* ---------- the word ---------- */
.dots{display:flex; justify-content:center; gap:.4rem; margin-bottom:1.6rem;}
.dots i{width:.55rem; height:.55rem; border-radius:50%; background:var(--line-2);}
.dots i.on{background:var(--acc);}
.dots i.now{background:var(--acc); transform:scale(1.5);}

.word{text-align:center; font-size:2.6rem; font-weight:700; line-height:1.35;
      letter-spacing:.04em; word-spacing:.1em; margin:.4rem 0 .2rem; word-break:break-word;}
.marked{text-align:center; font-size:2.4rem; font-weight:700; letter-spacing:.06em; margin:.4rem 0 .2rem; word-break:break-word;}
.marked b{color:var(--ink); font-weight:700;}
.marked u{color:var(--retry); text-decoration:none; border-bottom:3px solid var(--retry); padding-bottom:.08em;}

.syls{display:flex; flex-wrap:wrap; justify-content:center; gap:.4rem; margin:.9rem 0 0;}
.syl{padding:.5rem .85rem; border-radius:.8rem; background:var(--acc-soft); color:var(--acc);
     font-size:1.3rem; font-weight:700; letter-spacing:.03em; border:1px solid transparent;}
@media (prefers-color-scheme:dark){ .syl{color:var(--ink);} }
.syl:active{border-color:var(--acc);}

.note{text-align:center; color:var(--ink-soft); margin:1.1rem 0 0; font-size:1rem;}
.verdict{text-align:center; font-size:1.15rem; font-weight:700; margin:.2rem 0 .4rem;}
.verdict.ok{color:var(--good);}
.verdict.again{color:var(--retry);}

.hear{display:flex; align-items:center; justify-content:center; gap:.6rem; margin:1.2rem auto 0;
      min-height:3.6rem; padding:0 1.4rem; border-radius:1.1rem; background:var(--surface-2);
      border:1px solid var(--line-2); font-weight:700; font-size:1.05rem;}
.hear svg{width:1.4rem; height:1.4rem; flex:none;}
.hear:active{background:var(--acc-soft);}

.spellin{width:100%; text-align:center; font-size:2rem; font-weight:700; letter-spacing:.12em;
         padding:1rem .8rem; border-radius:1.1rem; background:var(--surface-2); border:2px solid var(--line-2);}
.spellin:focus{outline:none; border-color:var(--acc);}

.primary{display:flex; align-items:center; justify-content:center; gap:.6rem; width:100%;
         min-height:4rem; margin-top:1.5rem; padding:1rem 1.2rem; border-radius:1.25rem;
         background:var(--acc); color:var(--acc-ink); font-size:1.15rem; font-weight:700;
         box-shadow:var(--shadow); transition:transform .18s var(--ease);}
.primary:active{transform:scale(.985);}
.quiet{display:block; width:100%; margin-top:.9rem; min-height:3.2rem; border-radius:1rem;
       color:var(--ink-soft); font-size:.98rem; font-weight:600;
       border:1px solid var(--line); background:var(--surface-2);}
.quiet:active{border-color:var(--line-2);}

/* ---------- finished ---------- */
.tick{text-align:center; font-size:3.4rem; color:var(--acc); line-height:1; margin:.4rem 0 1.2rem;}
.headline{text-align:center; font-size:1.4rem; font-weight:700; margin:1rem 0 .3rem;}
.pbar{height:.6rem; border-radius:.3rem; background:var(--line); overflow:hidden; margin:.9rem 0 1.4rem;}
.pbar i{display:block; height:100%; background:var(--acc); border-radius:.3rem; transition:width .6s var(--ease);}

/* ---------- grown-ups ---------- */
.sect{margin-bottom:1.8rem;}
.sect h2{font-size:.78rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:.8rem;}
.field{margin-bottom:1.1rem;}
.field label{display:block; font-size:.92rem; font-weight:700; margin-bottom:.4rem;}
.hint{font-size:.85rem; color:var(--ink-soft); margin-top:.35rem; max-width:42ch;}
.field input[type=text], .field textarea{
  width:100%; padding:.8rem .9rem; border-radius:.9rem; background:var(--surface-2);
  border:1px solid var(--line-2); line-height:1.6;}
.field textarea{min-height:5.5rem; resize:vertical;}
.seg{display:flex; flex-wrap:wrap; gap:.5rem;}
.seg button{min-height:3rem; padding:0 1rem; border-radius:.85rem; border:1px solid var(--line-2);
            background:var(--surface-2); font-weight:600; color:var(--ink-soft); text-align:left;}
.seg button[aria-pressed=true]{background:var(--acc); color:var(--acc-ink); border-color:transparent;}
.swatch{position:relative; width:3rem; min-height:3rem; border-radius:.85rem; border:2px solid var(--line-2);
        transition:transform .18s var(--ease);}
.swatch[aria-pressed=true]{border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); transform:scale(1.07);}
.swatch[aria-pressed=true]::after{content:"✓"; position:absolute; inset:0; display:flex;
        align-items:center; justify-content:center; color:#35705A; font-size:1.15rem; font-weight:800;}
.stats{display:flex; gap:.55rem;}
.stat{flex:1 1 0; min-width:0; padding:.8rem .75rem; border-radius:1rem; background:var(--surface-2); border:1px solid var(--line);}
.stat b{display:block; font-size:1.45rem; font-weight:800; line-height:1.2;}
.stat span{display:block; font-size:.78rem; line-height:1.4; color:var(--ink-soft);}
.danger{color:var(--retry); border-color:var(--retry)!important;}
.chips{display:flex; flex-wrap:wrap; gap:.4rem;}
.chip{padding:.35rem .7rem; border-radius:.7rem; background:var(--surface-2); border:1px solid var(--line);
      font-size:.92rem; font-weight:600;}
.stamp{display:block; text-align:center; font-size:.72rem; letter-spacing:.1em; color:var(--ink-soft);
       opacity:.6; margin-top:2rem;}

/* ---------- toast ---------- */
#toast{position:fixed; left:50%; bottom:calc(1.6rem + env(safe-area-inset-bottom)); transform:translateX(-50%);
       padding:.75rem 1.15rem; border-radius:.9rem; background:var(--ink); color:var(--surface);
       font-size:.92rem; font-weight:600; z-index:30; opacity:0; pointer-events:none;
       transition:opacity .3s var(--ease); max-width:88vw; text-align:center;}
#toast.on{opacity:.96;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important; transition-duration:.001ms!important;}
}
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="bar"></div>
  <main id="screen"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

var VERSION = '4 · spelling';
var KEY = 'acorn.v1';

/* =========================================================
   1. Dates — always local. A 9pm session in Australia must not
   land on tomorrow's UTC date.
   ========================================================= */
var _today = null;                                  // tests only
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return _today || iso(new Date()); }
function parseISO(s){ var p = String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
// Math.round absorbs 23- and 25-hour daylight-saving days.
function dayDiff(a, b){ return Math.round((parseISO(a) - parseISO(b)) / 86400000); }

/* =========================================================
   2. State
   ========================================================= */
var S;
function fresh(){
  return {
    profile:  {name:'', createdAt:todayISO()},
    words:    {lists:[], mastery:{}, activeId:'easy', sessions:[]},
    settings: {textScale:1, tint:'cream', readAloud:true, sound:true, voice:null, speechRate:.95}
  };
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      S = fresh();
      if(o && typeof o === 'object'){
        if(o.profile)  Object.assign(S.profile, o.profile);
        if(o.words)    Object.assign(S.words, o.words);
        if(o.settings) Object.assign(S.settings, o.settings);
      }
      if(!Array.isArray(S.words.lists)) S.words.lists = [];
      if(!Array.isArray(S.words.sessions)) S.words.sessions = [];
      if(!S.words.mastery || typeof S.words.mastery !== 'object') S.words.mastery = {};
      return;
    }
  }catch(e){}
  S = fresh();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* =========================================================
   3. Sound and speech. Both need a real gesture before iOS will
   let them play, so every tap runs unlock() first.
   ========================================================= */
var _ac = null;
function audioCtx(){
  try{
    if(!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if(_ac.state === 'suspended') _ac.resume();
  }catch(e){ _ac = null; }
  return _ac;
}
function tone(freq, at, dur, vol){
  var ac = audioCtx(); if(!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.type = 'sine'; o.frequency.value = freq;
  var t = ac.currentTime + at;
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .03);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.start(t); o.stop(t + dur + .03);
}
function chime(name){
  if(S.settings.sound === false) return;
  if(name === 'right'){ tone(523.25, 0, .28, .16); tone(783.99, .13, .42, .13); }
  else if(name === 'done'){ tone(523.25,0,.3,.15); tone(659.25,.16,.3,.14); tone(783.99,.32,.6,.13); }
}

// Novelty voices (Albert, Bells with actual bells, Bubbles, Zarvox) and the
// robotic Eloquence family are listed as English by getVoices(), so they have
// to be filtered here or they crowd out the real ones.
var NOVELTY = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|junior|kathy|organ|princess|ralph|superstar|trinoids|whisper|wobble|zarvox|grandma|grandpa|rocko|sandy|shelley|reed|flo|eddy|bruce|fred|agnes|vicki|victoria)\b/i;
function englishVoices(){
  try{
    return (speechSynthesis.getVoices() || []).filter(function(v){
      return /^en([-_]|$)/i.test(v.lang || '') && !NOVELTY.test(v.name || '');
    });
  }catch(e){ return []; }
}
function voiceScore(v){
  var n = (v.name || '') + ' ' + (v.voiceURI || ''), s = 0;
  if(/premium|enhanced|neural|natural|wavenet|studio/i.test(n)) s += 60;   // downloadable HQ voices
  if(/siri/i.test(n)) s += 40;
  if(/^en-AU/i.test(v.lang)) s += 30;                                      // her own accent first
  else if(/^en-(GB|NZ)/i.test(v.lang)) s += 18;
  else if(/^en-(IE|ZA)/i.test(v.lang)) s += 8;
  if(/matilda|karen|catherine|lee|tina|serena|kate|google uk/i.test(n)) s += 10;
  if(/compact|eloquence|espeak/i.test(n)) s -= 50;
  if(v.default) s += 2;
  return s;
}
// Her own accent first; other English accents only if the phone has nothing closer.
function offerVoices(){
  var all = englishVoices().slice().sort(function(a,b){ return voiceScore(b) - voiceScore(a); });
  var near = all.filter(function(v){ return /^en-(AU|GB|NZ)/i.test(v.lang); });
  return (near.length >= 3 ? near : near.concat(all.filter(function(v){ return near.indexOf(v) < 0; }))).slice(0, 6);
}
var _voice = null, _voiceKey = null;
function pickVoice(){
  var vs = englishVoices();
  if(!vs.length) return null;
  var want = S.settings.voice, key = want + '|' + vs.length;
  if(_voiceKey === key && _voice) return _voice;
  _voice = (want && vs.filter(function(v){ return v.voiceURI === want; })[0])
        || vs.slice().sort(function(a,b){ return voiceScore(b) - voiceScore(a); })[0] || null;
  _voiceKey = key;
  return _voice;
}
// One seam for all spoken output.
function say(text, opts){
  opts = opts || {};
  if(!text) return;
  if(opts.force !== true && S.settings.readAloud === false) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    var v = opts.voice || pickVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-AU'; }
    u.rate = opts.rate || Number(S.settings.speechRate) || .95;
    u.pitch = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}
// The word, then its parts, slower — hear the whole and the pieces.
function sayParts(parts){
  if(S.settings.readAloud === false || !parts.length) return;
  try{
    speechSynthesis.cancel();
    var v = pickVoice();
    parts.forEach(function(p, i){
      var u = new SpeechSynthesisUtterance(i ? ' ' + p : p);
      if(v){ u.voice = v; u.lang = v.lang; }
      u.rate = Math.max(.5, (Number(S.settings.speechRate) || .95) - .25);
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
var _unlocked = false;
function unlock(){
  if(_unlocked) return;
  _unlocked = true;
  audioCtx();
  try{ speechSynthesis.getVoices(); }catch(e){}
  pickVoice();
}
try{ speechSynthesis.onvoiceschanged = function(){ _voiceKey = null; pickVoice(); }; }catch(e){}

/* =========================================================
   4. The words. Splits checked against Longman LDOCE4 and Oxford
   Advanced Learner's 7th; lists ordered easiest first.
   ========================================================= */
var LISTS = [
  {id:'easy', name:'Easy start', words:{
    said:'said', they:'they', went:'went', want:'want', with:'with', from:'from',
    some:'some', come:'come', made:'made', like:'like', time:'time', name:'name',
    back:'back', help:'help', play:'play', week:'week'}},
  {id:'tricky', name:'Tricky words', words:{
    because:'be·cause', friend:'friend', people:'peo·ple', beautiful:'beau·ti·ful',
    different:'dif·fer·ent', thought:'thought', through:'through', enough:'e·nough',
    together:'to·geth·er', favourite:'fa·vour·ite', straight:'straight', height:'height',
    business:'busi·ness', february:'Feb·ru·ary', separate:'sep·a·rate', government:'gov·ern·ment'}},
  {id:'longvowel', name:'Long vowel patterns', words:{
    rain:'rain', afraid:'a·fraid', display:'dis·play', reason:'rea·son', between:'be·tween',
    complete:'com·plete', light:'light', might:'might', delight:'de·light', boat:'boat',
    window:'win·dow', tomorrow:'to·mor·row', tune:'tune', music:'mu·sic'}},
  {id:'silent', name:'Silent letters', words:{
    knee:'knee', knife:'knife', know:'know', wrist:'wrist', write:'write', wrong:'wrong',
    lamb:'lamb', thumb:'thumb', climb:'climb', castle:'cas·tle', listen:'lis·ten',
    whistle:'whis·tle', island:'is·land', honest:'hon·est'}},
  {id:'tionsion', name:'-tion and -sion', words:{
    station:'sta·tion', question:'ques·tion', action:'ac·tion', attention:'at·ten·tion',
    direction:'di·rec·tion', invention:'in·ven·tion', division:'di·vi·sion', decision:'de·ci·sion',
    television:'tel·e·vi·sion', explosion:'ex·plo·sion', discussion:'dis·cus·sion', permission:'per·mis·sion'}},
  {id:'aussie', name:'Australian spellings', words:{
    colour:'col·our', favour:'fa·vour', neighbour:'neigh·bour', harbour:'har·bour',
    realise:'real·ise', organise:'or·gan·ise', recognise:'rec·og·nise', centre:'cen·tre',
    metre:'me·tre', theatre:'thea·tre', travelled:'trav·elled', licence:'li·cence',
    practise:'prac·tise', jewellery:'jew·el·lery'}}
];

function allLists(){
  return LISTS.map(function(l){ return {id:l.id, name:l.name, words:l.words, builtIn:true}; })
    .concat((S.words.lists || []).map(function(l){ return {id:l.id, name:l.name, words:l.words, builtIn:false}; }));
}
function activeList(){
  var all = allLists();
  return all.filter(function(l){ return l.id === S.words.activeId; })[0] || all[0];
}
function wordsOf(list){
  if(!list) return [];
  return Array.isArray(list.words) ? list.words.slice() : Object.keys(list.words);
}
// Whatever the school sends: commas, new lines, numbering, stray bullets.
function parseWordList(text){
  return String(text || '')
    .split(/[\s,;]+/)
    .map(function(w){ return w.replace(/^[\d]+[.)]?/, '').replace(/[^A-Za-z'\-]/g, '').toLowerCase(); })
    .filter(function(w){ return w.length >= 2; })
    .filter(function(w, i, a){ return a.indexOf(w) === i; });
}

/* =========================================================
   5. Syllables. Built-in lists carry hand-checked splits; this
   only has to serve words a grown-up pastes in, where readable
   chunks matter more than dictionary perfection.
   ========================================================= */
var ONSET_DIGRAPHS = ['ch','sh','th','ph','wh'];      // lead the next syllable: mo·ther
var CODA_DIGRAPHS  = ['ck','ng','gh'];                // close the previous one: neigh·bour
var DIGRAPHS = ONSET_DIGRAPHS.concat(CODA_DIGRAPHS);
// Consonant + liquid starts a syllable (ta·ble). s-clusters do not: medially the
// s closes the syllable before it (bas·ket, lis·ten, ques·tion).
var ONSET_BLENDS = ['bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','tr','tw','thr','shr'];
var VOWEL_DIGRAPHS = ['ai','ay','ea','ee','ei','ey','ie','oa','oe','oi','oo','ou','ow','oy',
                      'ue','ui','au','aw','eu','ew','ya','ye','yo'];
var SUFFIXES = ['er','est','ing','ly','ful','ness','less','ment','able','ible'];

function suffixSplit(s){
  for(var i = 0; i < SUFFIXES.length; i++){
    var suf = SUFFIXES[i];
    if(s.length <= suf.length + 3 || s.slice(-suf.length) !== suf) continue;
    var stem = s.slice(0, -suf.length);
    // Digraph stems only. A general "-er is a suffix" rule turns wa·ter into
    // wat·er, and spelling alone can't tell those two apart.
    if(DIGRAPHS.indexOf(stem.slice(-2)) < 0) continue;
    return [stem, suf];
  }
  return null;
}
function syllables(word){
  var s = String(word || '').toLowerCase().replace(/[^a-z']/g, '');
  if(s.length <= 3) return s ? [s] : [];

  var suf = suffixSplit(s);
  if(suf) return syllables(suf[0]).concat([suf[1]]);

  function isV(c, i){ return 'aeiou'.indexOf(c) >= 0 || (c === 'y' && i > 0); }

  var groups = [], i, j, k;
  for(i = 0; i < s.length; i++){
    if(!isV(s[i], i)) continue;
    j = i;
    while(j + 1 < s.length && isV(s[j+1], j+1)) j++;
    var a = i;
    if(s[i] === 'u' && i > 0 && s[i-1] === 'q' && j > i) a = i + 1;   // 'qu' is a consonant
    // A vowel run is usually one sound (rain) but sometimes two (li·on). Split
    // the pairs that aren't digraphs, keeping -tion/-sion/-cial intact.
    var start = a;
    for(k = a; k < j; k++){
      var pair = s.slice(k, k+2), before = s[k-1] || '', after = s[k+2] || '';
      var oneSound = VOWEL_DIGRAPHS.indexOf(pair) >= 0
                  || ('tscx'.indexOf(before) >= 0 && 'nl'.indexOf(after) >= 0);
      if(!oneSound){ groups.push([start, k]); start = k + 1; }
    }
    groups.push([start, j]);
    i = j;
  }
  if(groups.length < 2) return [s];

  // A final consonant + "le"/"re" is its own syllable (ta·ble, cen·tre);
  // otherwise a silent final 'e' is not a nucleus (com·plete).
  var leEnding = /[^aeiou](le|re)$/.test(s);
  if(!leEnding && s.slice(-1) === 'e' && groups.length > 1){
    var last = groups[groups.length-1];
    if(last[0] === last[1] && last[0] === s.length-1) groups.pop();
  }
  if(groups.length < 2) return [s];

  var cuts = [];
  for(k = 0; k < groups.length - 1; k++){
    var av = groups[k][1], bv = groups[k+1][0], L = bv - av - 1;
    if(L <= 1){ cuts.push(av + 1); continue; }                        // li·on / wa·ter
    var pr = s.slice(av+1, av+3);
    if(ONSET_DIGRAPHS.indexOf(pr) >= 0){ cuts.push(av + 1); continue; }   // mo·ther
    if(CODA_DIGRAPHS.indexOf(pr) >= 0){ cuts.push(av + 3); continue; }    // neigh·bour
    var tail = s.slice(bv - 2, bv);
    if(ONSET_BLENDS.indexOf(tail) >= 0){ cuts.push(bv - 2); continue; }   // ta·ble
    var nx = s.slice(av+2, av+4);
    if(L >= 3 && DIGRAPHS.indexOf(nx) >= 0){ cuts.push(av + 2); continue; }
    cuts.push(av + 2);                                                    // hap·pen
  }

  var out = [], from = 0;
  cuts.forEach(function(c){ if(c > from && c < s.length){ out.push(s.slice(from, c)); from = c; } });
  out.push(s.slice(from));
  return out.filter(Boolean);
}
function splitOf(word){
  var list = activeList();
  var hand = list && list.words && !Array.isArray(list.words) ? list.words[word] : null;
  return hand ? String(hand).split('·') : syllables(word);
}

/* =========================================================
   6. Spaced repetition and the self-adapting pace.

   Boxes 1..7 in elapsed days, roughly doubling — where both the
   spacing research and FSRS's fitted intervals land. Boxes 6 and 7
   exist so a word she knows well stops coming back every week
   forever. Box 5 is "known well": four correct retrievals on four
   different days, which is where the benefit levels off.
   ========================================================= */
var BOX_DAYS = {1:0, 2:1, 3:2, 4:4, 5:8, 6:21, 7:60};
var MAX_BOX = 7, KNOWN_BOX = 5;

function mastery(word){
  return S.words.mastery[word] || {right:0, wrong:0, box:1, lastSeen:null};
}
function acquiring(w){ return (mastery(w).box || 1) <= 1; }
function isDue(word, today){
  var m = mastery(word);
  if(!m.lastSeen) return true;
  return dayDiff(today, m.lastSeen) >= BOX_DAYS[m.box || 1];
}
// How far past its interval a word is — the one closest to being forgotten
// comes back first.
function overdueRatio(word, today){
  var m = mastery(word);
  if(!m.lastSeen) return Infinity;
  return dayDiff(today, m.lastSeen) / Math.max(1, BOX_DAYS[m.box || 1] || 1);
}
function recordWord(word, outcome){          // 'first' | 'later' | 'wrong'
  var m = Object.assign({right:0, wrong:0, box:1, lastSeen:null}, S.words.mastery[word]);
  var box = m.box || 1, sameDay = m.lastSeen === todayISO();
  if(outcome === 'first'){
    m.right++;
    // One box per calendar day: two goes in an evening shouldn't fast-track a
    // word past intervals measured in days.
    if(!sameDay) m.box = Math.min(MAX_BOX, box + 1);
  }else if(outcome === 'later'){
    m.right++;                               // got there after a miss — no penalty, no advance
  }else{
    m.wrong++;
    // Large but partial: a word known for two months slips to a one-day retry
    // rather than starting again from nothing.
    m.box = box <= 2 ? 1 : Math.max(2, box - 2);
  }
  m.lastSeen = todayISO();
  S.words.mastery[word] = m;
  save();
  return m;
}
function knownCount(list){
  return wordsOf(list).filter(function(w){ return (mastery(w).box || 1) >= KNOWN_BOX; }).length;
}

/* Pace. Practice works best around 80-85% success: below that she is being
   overloaded, above it she is coasting. So the number of new words follows her
   accuracy rather than a fixed setting. */
var ACQUIRING_CAP = 3;      // words still being learned, at once
var SEED_NEW = 3;           // her very first session
var PACE_WINDOW = 5;        // sessions to judge on
var PACE_MIN_WORDS = 12;    // ...over at least this many words
var PACE_HIGH = .85, PACE_LOW = .70;
var SESSION_LEN = 8, MIN_SESSION = 4;

function recentAccuracy(){
  var ss = (S.words.sessions || []).slice(-PACE_WINDOW);
  var words = ss.reduce(function(n, s){ return n + (s.words || 0); }, 0);
  var first = ss.reduce(function(n, s){ return n + (s.firstTime || 0); }, 0);
  return words >= PACE_MIN_WORDS ? first / words : null;    // null = too early to judge
}
function newWordsToday(){
  if(!(S.words.sessions || []).length) return SEED_NEW;
  var acc = recentAccuracy();
  if(acc === null) return 1;
  if(acc >= PACE_HIGH) return 2;      // flying — she can take more
  if(acc >= PACE_LOW)  return 1;      // in the sweet spot
  return 0;                           // struggling — consolidate, add nothing
}
function poolCap(){
  var acc = recentAccuracy();
  if(acc === null) return ACQUIRING_CAP;
  if(acc >= PACE_HIGH) return ACQUIRING_CAP + 1;
  if(acc <  PACE_LOW)  return Math.max(1, ACQUIRING_CAP - 1);
  return ACQUIRING_CAP;
}
function paceLabel(){
  var acc = recentAccuracy(), n = newWordsToday();
  return (acc === null ? 'Finding her level' : Math.round(acc * 100) + '% right first time')
       + ' · ' + (n === 0 ? 'no new words yet' : n + (n === 1 ? ' new word' : ' new words') + ' a session');
}

/* Yesterday's words come back before anything new is introduced, most of a
   session is words she can already spell, and it opens with one she is likely
   to get right rather than the hardest thing she owns. */
function buildSession(list, today){
  var all = wordsOf(list);
  function seen(w){ return !!S.words.mastery[w]; }

  var review = all.filter(function(w){ return seen(w) && !acquiring(w) && isDue(w, today); })
                  .sort(function(a,b){ return overdueRatio(b, today) - overdueRatio(a, today); });
  var started = all.filter(function(w){ return seen(w) && acquiring(w); })
                   .sort(function(a,b){ return String(mastery(a).lastSeen).localeCompare(String(mastery(b).lastSeen)); });
  var never = all.filter(function(w){ return !seen(w); });

  var cap = poolCap();
  var acq = started.slice(0, cap);
  var room = Math.min(newWordsToday(), cap - acq.length);
  never.forEach(function(w){ if(room-- > 0) acq.push(w); });

  // Review is sized against the acquiring words. If not enough is strictly due,
  // pull forward the nearest — better than a screen of nothing but misses.
  var wantRev = Math.max(3, Math.ceil(acq.length * 2.5));
  var rev = review.slice(0, wantRev);
  if(rev.length < wantRev){
    all.filter(function(w){ return seen(w) && !acquiring(w) && rev.indexOf(w) < 0; })
       .sort(function(a,b){ return overdueRatio(b, today) - overdueRatio(a, today); })
       .forEach(function(w){ if(rev.length < wantRev) rev.push(w); });
  }
  // A floor, so a bad run cannot freeze the app: one new word beats a
  // thirty-second session she has no reason to come back to.
  if(acq.length + rev.length < MIN_SESSION){
    never.forEach(function(w){
      if(acq.length + rev.length < MIN_SESSION && acq.length < cap && acq.indexOf(w) < 0) acq.push(w);
    });
  }
  if(!rev.length && !acq.length){
    return all.slice().sort(function(a,b){ return overdueRatio(b, today) - overdueRatio(a, today); })
              .slice(0, SESSION_LEN);
  }

  // Thread the acquiring words through the review rather than blocking them at
  // the front, and open with the safest one.
  var total = acq.length + rev.length;
  var out = [];
  if(rev.length) out.push(rev.shift());
  var gap = Math.max(1, Math.ceil((rev.length + 1) / (acq.length + 1)));
  var ri = 0, ai = 0;
  while(ri < rev.length || ai < acq.length){
    for(var k = 0; k < gap && ri < rev.length; k++) out.push(rev[ri++]);
    if(ai < acq.length) out.push(acq[ai++]);
  }
  return out.filter(function(w, i, a){ return a.indexOf(w) === i; })
            .slice(0, Math.min(SESSION_LEN + ACQUIRING_CAP, total));
}

/* =========================================================
   7. Comparing her attempt. Longest common subsequence, so one
   dropped letter doesn't mark the whole word wrong.
   ========================================================= */
function matched(attempt, target){
  var a = String(attempt||'').toLowerCase(), b = String(target||'').toLowerCase();
  var n = a.length, m = b.length, dp = [], i, j;
  for(i = 0; i <= n; i++){ dp.push(new Array(m+1).fill(0)); }
  for(i = 1; i <= n; i++)
    for(j = 1; j <= m; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  var hit = {}, count = 0;
  i = n; j = m;
  while(i > 0 && j > 0){
    if(a[i-1] === b[j-1]){ hit[j-1] = true; count++; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  return {hit:hit, count:count};
}
function sameWord(a, b){ return String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase(); }

/* =========================================================
   8. A practice session.

   A brand-new word gets look, cover, write, check. Every word she
   has met before goes straight to writing it from memory — showing
   it first would make this a copying exercise, which is what undoes
   the benefit of practising at all.
   ========================================================= */
var W = null;
function stageFor(word){ return acquiring(word) ? 'look' : 'write'; }
// A word already missed today is re-asked from memory, not shown again.
function stageNow(word){ return (W && W.failed.indexOf(word) >= 0) ? 'write' : stageFor(word); }

function start(){
  var words = buildSession(activeList(), todayISO());
  if(!words.length) return false;
  W = {words:words, i:0, stage:stageFor(words[0]), attempt:'', tries:0,
       right:0, firstTime:0, requeue:[], failed:[]};
  screen = 'day';
  render();
  say(words[0]);
  return true;
}
function word(){ return W && W.words[W.i]; }

function check(){
  var w = word();
  W.attempt = (el('#type') ? el('#type').value : W.attempt) || '';
  W.tries++;
  var ok = sameWord(W.attempt, w);
  var missedBefore = W.failed.indexOf(w) >= 0;
  if(ok){
    recordWord(w, missedBefore ? 'later' : 'first');
    W.right++;
    if(!missedBefore) W.firstTime++;
    chime('right');
  }else if(!missedBefore){
    // Marked down once, then queued to come back later in this same session —
    // a real retrieval a few words on, rather than a copy off the screen.
    W.failed.push(w);
    recordWord(w, 'wrong');
    if(W.requeue.indexOf(w) < 0) W.requeue.push(w);
  }
  W.stage = 'check';
  render();
  if(!ok) sayParts(splitOf(w));
}
function next(){
  if(W.i + 1 < W.words.length) W.i++;
  else if(W.requeue.length){ W.words.push(W.requeue.shift()); W.i++; }
  else { finish(); return; }
  W.stage = stageNow(word()); W.attempt = ''; W.tries = 0;
  render();
  say(word());
}
function finish(){
  var distinct = W.words.filter(function(w, i, a){ return a.indexOf(w) === i; }).length;
  S.words.sessions.push({date:todayISO(), asked:W.words.length, words:distinct,
                         right:W.right, firstTime:W.firstTime});
  if(S.words.sessions.length > 60) S.words.sessions = S.words.sessions.slice(-60);
  save();
  var every = W.firstTime === distinct;
  W = null;
  saying = withName(every ? 'Every one, first go{n}.' : 'All done{n}.');
  screen = 'day'; render();
  chime('done');
  say(saying);
}

/* =========================================================
   9. Render
   ========================================================= */
var screen = 'day', saying = '';
function el(s){ return document.querySelector(s); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function withName(s){
  var n = (S.profile.name || '').trim();
  return s.replace('{n}', n ? ', ' + n : '');
}
var SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M11 5 6.5 9H3.5v6h3L11 19V5Z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.4 6.6a8 8 0 0 1 0 10.8"/></svg>';

function applySettings(){
  var r = document.documentElement;
  r.style.setProperty('--scale', S.settings.textScale || 1);
  r.setAttribute('data-tint', S.settings.tint || 'cream');
}
function render(){
  applySettings();
  if(screen === 'parent') renderParent();
  else if(W) renderWord();
  else renderDone();
}
// Her header: the wordmark (press and hold for grown-ups) and today's progress.
function header(pos, total){
  var bar = (pos != null && total)
    ? '<span class="daybar" aria-label="Word ' + (pos+1) + ' of ' + total + '"><i style="width:'
      + Math.round(100 * pos / total) + '%"></i></span>' : '';
  el('#bar').innerHTML = '<span class="wordmark" id="wordmark"><b>Acorn</b></span><span class="sp"></span>' + bar;
}

function renderWord(){
  var w = word(), parts = splitOf(w);
  header(W.i, W.words.length);

  var dots = '<div class="dots" aria-hidden="true">';
  for(var k = 0; k < W.words.length; k++)
    dots += '<i class="' + (k < W.i ? 'on' : k === W.i ? 'now' : '') + '"></i>';
  dots += '</div>';

  // A one-syllable word needs no syllable row — it would just repeat itself.
  var sylRow = parts.length > 1
    ? '<div class="syls">' + parts.map(function(p){
        return '<span class="syl" data-syl="' + esc(p) + '">' + esc(p) + '</span>'; }).join('') + '</div>'
    : '';
  var hear = '<button class="hear" id="hear">' + SPK + 'Hear it</button>';
  var body;

  if(W.stage === 'look'){
    body = '<div class="word">' + esc(w) + '</div>' + sylRow
         // Saying it aloud and tracing it are free wins, and neither is checked,
         // so there is no way for them to go wrong.
         + '<div class="note">Say it out loud. Trace it with your finger.</div>'
         + hear
         + '<button class="primary" id="cover">Cover it up</button>';
  }
  else if(W.stage === 'write'){
    body = '<div class="note">' + (stageFor(w) === 'write' ? 'Listen, then write it.' : 'Now write it from memory.') + '</div>'
         + '<input class="spellin" id="type" type="text" inputmode="text" autocomplete="off" '
         +   'autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" '
         +   'value="' + esc(W.attempt) + '" aria-label="Type the word">'
         + hear
         + '<button class="primary" id="check">Check</button>';
  }
  else {
    var ok = sameWord(W.attempt, w);
    var m = matched(W.attempt, w);
    // Marking every letter says only "all of this is wrong", which helps nobody
    // — so below half matched, show the word plainly instead.
    var close = w.length ? m.count / w.length >= .5 : false;
    var marks = w.split('').map(function(c, i){
      return m.hit[i] ? '<b>' + esc(c) + '</b>' : '<u>' + esc(c) + '</u>'; }).join('');
    var more = (W.i + 1 < W.words.length) || W.requeue.length;
    body = '<div class="verdict ' + (ok ? 'ok' : 'again') + '">'
         +   (ok ? (W.failed.indexOf(w) >= 0 ? 'You got there.' : 'Yes — that’s it.')
                 : close ? 'So close. Look at these letters.' : 'Here it is. Have a good look.')
         + '</div>'
         // Only ever the correct spelling on screen. Seeing her own misspelling
         // is the one thing that measurably sets spelling back.
         + (ok || !close ? '<div class="word">' + esc(w) + '</div>'
                         : '<div class="marked">' + marks + '</div>')
         + sylRow + hear
         + (!ok ? '<div class="note">You’ll see this one again in a moment.</div>' : '')
         + '<button class="primary" id="next">' + (more ? 'Next word' : 'Finish') + '</button>';
  }

  el('#screen').innerHTML = dots + body;
  var inp = el('#type');
  if(inp){ inp.focus({preventScroll:true}); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function renderDone(){
  var list = activeList(), all = wordsOf(list), known = knownCount(list);
  var pct = all.length ? Math.round(100 * known / all.length) : 0;
  header();
  el('#screen').innerHTML =
      (saying ? '<div class="headline" style="color:var(--good)">' + esc(saying) + '</div>'
              : '<div class="headline">All done for today</div>')
    + '<div class="tick" aria-hidden="true">✓</div>'
    + (all.length
        ? '<div class="note">' + known + ' of ' + all.length + ' words known well</div>'
          + '<div class="pbar"><i style="width:' + pct + '%"></i></div>'
          + '<button class="quiet" id="again">Practise a bit more</button>'
        : '<div class="note">No words yet. A grown-up can add her list.</div>');
}

function renderParent(){
  var list = activeList(), all = wordsOf(list);
  var voices = offerVoices(), chosen = pickVoice();
  var tricky = Object.keys(S.words.mastery)
    .filter(function(w){ return mastery(w).wrong > 0 && (mastery(w).box || 1) < KNOWN_BOX; })
    .sort(function(a,b){ return mastery(b).wrong - mastery(a).wrong; }).slice(0, 12);
  var scales = [['Smaller',.9],['Normal',1],['Large',1.15],['Larger',1.3],['Largest',1.5]];
  var tints  = [['cream','#FBF6EC'],['peach','#FBF0E8'],['mint','#EDF6F0'],['blue','#EDF2F8'],['grey','#F2F1EE']];

  el('#bar').innerHTML = '<button class="back" data-go="day" aria-label="Back">← Back</button>'
    + '<span class="sp"></span><span class="wordmark" style="color:var(--ink-soft)">Grown-ups</span>';

  el('#screen').innerHTML =
      '<div class="sect"><h2>Progress</h2><div class="stats">'

    +   '<div class="stat"><b>' + Object.keys(S.words.mastery).length + '</b><span>words tried</span></div>'
    +   '<div class="stat"><b>' + S.words.sessions.length + '</b><span>sessions</span></div>'
    + '</div>'

        + '</div><div class="hint">Tap one to hear it. These come back most often.</div></div>'

    + '<div class="sect"><h2>Which list</h2><div class="seg" id="segList">'

          return '<button data-list="' + esc(l.id) + '" aria-pressed="' + (l.id === list.id) + '">'
               + esc(l.name) + ' <span style="opacity:.6">' + wordsOf(l).length + '</span></button>'; }).join('')
    + '</div><div class="hint">Lists are ordered easiest first. She works through one list at a time.</div></div>'

    + '<div class="sect"><h2>Her own list</h2>'
    +   '<div class="field"><label for="paste">Paste this week’s words</label>'

    +   '<div class="field"><label for="pname2">List name</label>'

    +   (S.words.lists.length
        ? '<div class="field" style="margin-top:1rem"><label>Saved lists</label><div class="seg">'
          + S.words.lists.map(function(l){
              return '<button class="danger" data-del="' + esc(l.id) + '">Delete “' + esc(l.name) + '”</button>'; }).join('')
          + '</div></div>'
        : '')
    + '</div>'

    + '<div class="sect"><h2>Her name</h2>'
    +   '<div class="field"><input type="text" id="pname" value="' + esc(S.profile.name || '') + '" '
    +     'placeholder="First name" autocomplete="off" autocapitalize="words">'

    +     'in the app’s code.</div></div></div>'

    + '<div class="sect"><h2>Sound</h2>'
    +   '<div class="field"><label>Read aloud</label><div class="seg">'
    +     '<button data-ra="1" aria-pressed="' + (S.settings.readAloud !== false) + '">On</button>'
    +     '<button data-ra="0" aria-pressed="' + (S.settings.readAloud === false) + '">Off</button></div></div>'

    +     '<button data-sn="1" aria-pressed="' + (S.settings.sound !== false) + '">On</button>'

    +   '<div class="field"><label>Speaking speed</label><div class="seg">'
    +     [['Slow',.7],['Steady',.85],['Normal',.95],['Quick',1.1]].map(function(r){
            return '<button data-rate="' + r[1] + '" aria-pressed="'
                 + (Number(S.settings.speechRate||.95) === r[1]) + '">' + r[0] + '</button>'; }).join('')
    +   '</div></div>'
    +   '<div class="field"><label>Voice</label><div class="seg">'

          : '<span class="hint">Tap anything that speaks once, then come back — the phone only lists '

    +   '</div><div class="hint">Australian voices first; novelty voices are filtered out. A downloaded '

    + '<div class="sect"><h2>Text size</h2><div class="seg">'
    +   scales.map(function(s){ return '<button data-sc="' + s[1] + '" aria-pressed="'
          + (Number(S.settings.textScale||1) === s[1]) + '">' + s[0] + '</button>'; }).join('')
    + '</div></div>'

    + '<div class="sect"><h2>Background</h2><div class="seg">'
    +   tints.map(function(t){ return '<button class="swatch" data-tn="' + t[0] + '" style="background:'
          + t[1] + '" aria-pressed="' + ((S.settings.tint||'cream') === t[0]) + '" aria-label="' + t[0] + '"></button>'; }).join('')
    + '</div><div class="hint">A tint some readers find easier. Light mode only.</div></div>'

    + '<div class="sect"><h2>Backup</h2>'
    +   '<button class="quiet" id="copy">Copy her progress</button>'
    +   '<div class="hint">Copies everything as text you can paste somewhere safe.</div>'
    +   '<button class="quiet danger" id="reset" style="margin-top:.9rem">Erase everything</button>'
    + '</div>'
    + '<span class="stamp" id="stamp">Build ' + esc(VERSION) + '</span>';
}

var _toastT = null;
function toast(msg){
  var t = el('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}
function go(s){
  if(s !== 'day') W = null;
  screen = s; saying = ''; window.scrollTo(0, 0); render();
}

/* =========================================================
   10. Events — one delegated handler. unlock() on every tap so
   iOS lets sound and speech through later.
   ========================================================= */
document.addEventListener('click', function(ev){
  var t = ev.target, hit;
  unlock();

  if((hit = t.closest('[data-go]'))){ go(hit.dataset.go); return; }
  if(t.closest('#again')){ if(!start()) toast('Nothing to practise just now.'); return; }
  if(t.closest('#cover')){ W.stage = 'write'; render(); return; }
  if(t.closest('#check')){ check(); return; }
  if(t.closest('#next')) { next(); return; }
  if(t.closest('#hear')) { var w = word(); if(w) say(w, {force:true}); return; }
  if((hit = t.closest('[data-syl]'))){ say(hit.dataset.syl, {force:true, rate:.75}); return; }
  if((hit = t.closest('[data-hear]'))){ say(hit.dataset.hear, {force:true}); return; }

  // ---- grown-ups
  if((hit = t.closest('[data-ra]'))){ S.settings.readAloud = hit.dataset.ra === '1'; save(); render(); return; }
  if((hit = t.closest('[data-sn]'))){ S.settings.sound = hit.dataset.sn === '1'; save(); render(); if(S.settings.sound) chime('right'); return; }
  if((hit = t.closest('[data-sc]'))){ S.settings.textScale = Number(hit.dataset.sc); save(); render(); return; }
  if((hit = t.closest('[data-tn]'))){ S.settings.tint = hit.dataset.tn; save(); render(); return; }
  if((hit = t.closest('[data-rate]'))){ S.settings.speechRate = Number(hit.dataset.rate); save(); render(); say('Every word counts.', {force:true}); return; }
  if((hit = t.closest('[data-voice]'))){
    S.settings.voice = hit.dataset.voice; _voiceKey = null; save(); render();
    say('Hello ' + (S.profile.name || '') + '. Time to practise.', {force:true});
    return;
  }
  if((hit = t.closest('[data-list]'))){ S.words.activeId = hit.dataset.list; save(); render(); return; }
  if((hit = t.closest('[data-del]'))){
    var b = hit;
    if(b.dataset.armed){
      var id = b.dataset.del;
      S.words.lists = S.words.lists.filter(function(l){ return l.id !== id; });
      if(S.words.activeId === id) S.words.activeId = (allLists()[0] || {}).id;
      save(); render(); toast('List deleted.'); return;
    }
    b.dataset.armed = '1'; b.textContent = 'Tap again to delete';
    setTimeout(function(){ if(b.isConnected){ delete b.dataset.armed; render(); } }, 3000);
    return;
  }
  if(t.closest('#pasteSave')){
    var words = parseWordList(el('#paste').value);
    if(!words.length){ toast('No words found in that.'); return; }
    var name = (el('#pname2').value || '').trim() || 'Her list';
    var n = S.words.lists.reduce(function(mx, l){ return Math.max(mx, Number(String(l.id).slice(1)) || 0); }, 0);
    var id = 'w' + (n + 1);
    S.words.lists.push({id:id, name:name, words:words});
    S.words.activeId = id;
    save(); render();
    toast(words.length + (words.length === 1 ? ' word saved.' : ' words saved.'));
    return;
  }
  if(t.closest('#copy')){
    var text = JSON.stringify(S, null, 2);
    try{
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(text).then(function(){ toast('Progress copied.'); },
                                                 function(){ toast('Could not copy.'); });
      else {
        var a = document.createElement('textarea');
        a.value = text; document.body.appendChild(a); a.select();
        document.execCommand('copy'); a.remove(); toast('Progress copied.');
      }
    }catch(e){ toast('Could not copy.'); }
    return;
  }
  if(t.closest('#reset')){
    var r = t.closest('#reset');
    if(r.dataset.armed){
      localStorage.removeItem(KEY); load(); go('day');
      if(!start()) render();
      toast('Everything erased.');
      return;
    }
    r.dataset.armed = '1'; r.textContent = 'Tap again to erase everything';
    setTimeout(function(){ if(r.isConnected){ delete r.dataset.armed; r.textContent = 'Erase everything'; } }, 3000);
    return;
  }
});

document.addEventListener('input', function(ev){
  if(ev.target.id === 'pname'){ S.profile.name = ev.target.value; save(); }
  if(ev.target.id === 'type' && W) W.attempt = ev.target.value;
});
// Enter checks the word — she shouldn't have to find a button.
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Enter' && ev.target.id === 'type' && W && W.stage === 'write'){
    ev.preventDefault(); unlock(); check();
  }
});

// Grown-ups: press and hold ACORN. No PIN to forget, and nothing on her screens
// that looks like a way in. Delegated, because the header is rebuilt every render.
(function(){
  var timer = null;
  function stop(){ clearTimeout(timer); timer = null; }
  document.addEventListener('pointerdown', function(ev){
    if(!ev.target.closest || !ev.target.closest('.wordmark')) return;
    stop();
    timer = setTimeout(function(){ unlock(); go('parent'); }, 700);
  });
  ['pointerup','pointercancel','pointerleave','scroll'].forEach(function(e){
    document.addEventListener(e, stop, true);
  });
  document.addEventListener('contextmenu', function(ev){
    if(ev.target.closest && ev.target.closest('.wordmark')) ev.preventDefault();
  });
})();

// Midnight must roll the day over, on resume and while the app sits open.
var _renderedDay = null;
function checkRollover(){
  if(_renderedDay && _renderedDay !== todayISO()){
    _renderedDay = todayISO(); saying = '';
    if(screen !== 'parent'){ W = null; if(!start()) render(); }
  }
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') checkRollover();
});
setInterval(checkRollover, 60000);

/* =========================================================
   11. Test hook. Playwright drives the pure logic and travels
   through time. No behaviour depends on this existing.
   ========================================================= */
window.__acorn = {
  VERSION: VERSION,
  get state(){ return S; },
  save: save, load: load,
  setToday: function(d){ _today = d; _renderedDay = todayISO(); render(); },
  todayISO: todayISO, dayDiff: dayDiff,
  syllables: syllables, splitOf: splitOf, parseWordList: parseWordList,
  matched: function(a, b){ var m = matched(a, b); return {count:m.count, hit:Object.keys(m.hit).map(Number).sort(function(x,y){return x-y;})}; },
  mastery: mastery, recordWord: recordWord, isDue: isDue, overdueRatio: overdueRatio,
  acquiring: acquiring, knownCount: knownCount,
  buildSession: buildSession, recentAccuracy: recentAccuracy,
  newWordsToday: newWordsToday, poolCap: poolCap, stageFor: stageFor,
  allLists: allLists, activeList: activeList, wordsOf: wordsOf,
  englishVoices: englishVoices, offerVoices: offerVoices, voiceScore: voiceScore,
  start: start, check: check, next: next,
  session: function(){ return W && {words:W.words.slice(), i:W.i, stage:W.stage, tries:W.tries,
                                     right:W.right, firstTime:W.firstTime, failed:W.failed.slice(),
                                     requeue:W.requeue.slice()}; },
  go: go, screen: function(){ return screen; },
  BOX_DAYS: BOX_DAYS, MAX_BOX: MAX_BOX, KNOWN_BOX: KNOWN_BOX,
  ACQUIRING_CAP: ACQUIRING_CAP, SEED_NEW: SEED_NEW, SESSION_LEN: SESSION_LEN
};

/* ---- boot: she opens the app and is on a word ---- */
load();
_renderedDay = todayISO();
if(!start()) render();
})();
</script>
