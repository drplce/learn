<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Acorn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Acorn">
<meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#22242A" media="(prefers-color-scheme:dark)">
<meta name="description" content="A calm spelling practice app.">
<style>
/* ===========================================================
   Acorn — spelling practice, dyslexia-friendly by default.

   Cream surface, dark-slate ink (never black), one calm accent.
   Large well-spaced type, short lines, one task per screen.

   Three scales and nothing off them: type, spacing, radius. The
   evidence on "dyslexia fonts" is that they don't help; size,
   letter spacing, line spacing and line length do. So that is
   where the effort goes.
   =========================================================== */
:root{
  --surface:#FBF6EC; --surface-2:#FFFDF7; --ink:#3B4149; --ink-soft:#686E76;
  --line:rgba(59,65,73,.14); --line-2:rgba(59,65,73,.26);
  --acc:#35705A; --acc-ink:#FFFFFF; --acc-soft:#E4EFE8;
  --good:#3B795F; --retry:#A15D27;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",sans-serif;

  /* type — every size in the app is one of these */
  --t-xs:.75rem; --t-sm:.875rem; --t-md:1rem; --t-lg:1.125rem;
  --t-xl:1.375rem; --t-2xl:2rem; --t-3xl:2.5rem; --t-4xl:3.5rem;
  /* spacing — quarter-rem steps, so the vertical rhythm is even */
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem; --s7:2.5rem;
  /* radius — three, plus a pill for the thin bars */
  --r-sm:.75rem; --r-md:1rem; --r-lg:1.25rem; --r-pill:999px;
  /* tap targets — 3rem is 51px at the default root, comfortably over the 44px floor */
  --tap:3rem; --tap-lg:3.5rem; --tap-xl:4rem;

  --scale:1;
  --shadow:0 1px 2px rgba(59,65,73,.05), 0 6px 18px rgba(59,65,73,.06);
  --ease:cubic-bezier(.22,.61,.36,1);
}
/* Background tints — some readers find a particular tint easier. */
[data-tint="peach"]{--surface:#FBF0E8;--surface-2:#FFF8F2;}
[data-tint="mint"] {--surface:#EDF6F0;--surface-2:#F7FCF9;}
[data-tint="blue"] {--surface:#EDF2F8;--surface-2:#F8FAFD;}
[data-tint="grey"] {--surface:#F2F1EE;--surface-2:#FAFAF8;}

@media (prefers-color-scheme:dark){
  :root{
    --surface:#22242A; --surface-2:#2A2D34; --ink:#E8E3D9; --ink-soft:#A9A49B;
    --line:rgba(232,227,217,.13); --line-2:rgba(232,227,217,.26);
    --acc:#7CC0A2; --acc-ink:#14231C; --acc-soft:#2C3A34;
    --good:#7CC0A2; --retry:#DCA173;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 6px 18px rgba(0,0,0,.24);
  }
  [data-tint]{--surface:#22242A;--surface-2:#2A2D34;}   /* tints are a light-mode comfort */
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  /* rem against the browser's own base, so the OS text-size setting still counts */
  font-size:calc(1.0625rem * var(--scale));
}
html,body{margin:0; min-height:100%; background:var(--surface);}
body{
  color:var(--ink); font-family:var(--sans);
  /* generous line and word spacing: the part of typography that does help */
  line-height:1.7; letter-spacing:.01em; word-spacing:.06em; text-align:left;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input,textarea{font:inherit; color:inherit; letter-spacing:inherit;}
button{border:0; background:none; cursor:pointer; touch-action:manipulation;}
h1,h2{line-height:1.3; letter-spacing:0; margin:0; font-weight:700;}
/* Keyboard focus stays visible; a tap never draws one. */
:focus-visible{outline:3px solid var(--acc); outline-offset:2px;}

#app{max-width:34rem; margin:0 auto;
     padding:calc(var(--s4) * var(--ornament)) var(--s4);
     height:100vh; height:100dvh; height:var(--vh, 100dvh);
     display:flex; flex-direction:column;}
/* The content scrolls inside itself so the action below it can never be
   scrolled away from. At the larger text sizes — which is who this app is for —
   the column is taller than the phone, and the one button she needs sat up to
   288px below the fold. She should never have to discover scrolling to answer
   a word. */
main{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;}
/* Her screens sit in the middle of the room they have rather than clinging to
   the top of it — at normal text size three quarters of the panel was empty
   below the word. Auto margins rather than justify-content:center because when
   the content is taller than the panel they collapse to nothing, so it
   top-aligns and scrolls properly instead of hiding its first line. */
:root:not([data-stage=parent]) main{display:flex; flex-direction:column;}
:root:not([data-stage=parent]) main > :first-child{margin-top:auto;}
:root:not([data-stage=parent]) main > :last-child{margin-bottom:auto;}
/* Ornament stays the size it was drawn at whatever text size she has chosen.
   --ornament undoes the root scaling, so these are on the same scale as
   everything else but do not grow with her reading preference. */
:root{--ornament:calc(1 / var(--scale));}
/* One row: hearing the word and answering it are both always in reach, and the
   scrolling content above keeps as much height as possible. It wraps to two
   rows only when the labels genuinely cannot share a line. */
#act{flex:none; padding-top:var(--s2); display:flex; flex-wrap:wrap;
     gap:calc(var(--s2) * var(--ornament)); align-items:stretch;
     container-type:inline-size;}
#act .hear{flex:0 0 auto; margin:0;}
#act .primary{flex:1 1 7rem; margin:0;}
#act .quiet{margin:0;}
/* The footer's width measured in rem shrinks as her text grows, so this fires
   exactly when the two labels can no longer share a line — at which point the
   speaker keeps its icon and gives up its label rather than the row splitting
   in two and taking the height the word needs. It keeps its spoken name. */
@container (max-width: 15rem){
  #act .hear span{position:absolute; width:1px; height:1px; overflow:hidden;
                  clip:rect(0 0 0 0); white-space:nowrap;}
  #act .hear{padding:0 var(--s3);}
}
#act:empty{display:none;}

/* ---------- header: the mark + today's progress ---------- */
/* flex:none, so the header is pinned to the top of the app exactly the way #act
   is pinned to the bottom of it, and main takes whatever is between the two. The
   only thing that changes size when the software keyboard opens or closes is then
   the whitespace inside main — the header cannot ride the change. Without it the
   header keeps flex-shrink's default of 1, so on a screen with too little room the
   flex algorithm is entitled to take height out of the one row she navigates by:
   at the largest text "← Back" and the crumb are two rows, and a row of that is
   the way out of the grown-ups screen. It stays in flow, because the header
   floating over her word is the bug fitScreen() exists to prevent. */
.bar{flex:none; display:flex; align-items:center; gap:var(--s3); min-height:var(--tap);
     margin-bottom:var(--s5); flex-wrap:wrap; row-gap:var(--s2);}
/* At the largest text size on a narrow phone the label and the back button
   cannot share a line. Stacking is fine; breaking "GROWN-UPS" in half is not. */
.wordmark{position:relative; font-size:var(--t-xs); font-weight:800; letter-spacing:.18em;
          text-transform:uppercase; color:var(--acc); user-select:none; white-space:nowrap;}
.wordmark.crumb{color:var(--ink-soft);}
/* Her own header is a mark rather than the word: the same hand-drawn outline the
   progress dots and the map cells are drawn with, at three points instead of
   seven. It has to occupy the box the letters occupied or the header shifts under
   her, so it is square and exactly one line box tall — 1.3em is the h1's own
   line-height, which is what the text measured. That leaves it narrower than the
   letterspaced word it replaces, and the spacer beside it takes up the slack, so
   the progress bar does not move either. */
.mark svg{display:block; width:1.3em; height:1.3em;}
.mark path{fill:var(--acc);}
/* The mark is also the way in to the grown-ups screen, and one line of small caps
   is a 15px target. The hit area is grown to the same 44px-plus floor everything
   else here keeps, on a pseudo-element so it costs no layout: the mark's own box
   is still the box the text had. */
.mark::after{content:""; position:absolute; left:50%; top:50%; width:var(--tap); height:var(--tap);
             transform:translate(-50%,-50%);}
.bar .sp{flex:1;}
.daybar{flex:none; width:5.5rem; height:var(--s1); border-radius:var(--r-pill);
        background:var(--line); overflow:hidden;}
.daybar i{display:block; height:100%; background:var(--acc); border-radius:var(--r-pill);
          transition:width .4s var(--ease);}
.back{display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--tap);
      padding-right:var(--s3); border-radius:var(--r-md); font-size:var(--t-md);
      font-weight:600; color:var(--ink-soft); white-space:nowrap;}

/* ---------- the word ---------- */
.dots{display:flex; justify-content:center; align-items:center; gap:var(--s2);
      /* The current dot is scaled up, and main clips: without this the top of it
         is shaved off. */
      padding-block:calc(var(--s2) * var(--ornament));
      margin-bottom:calc(var(--s3) * var(--ornament));}
/* Each dot is the outline that word has on her map, not a circle — the row is a
   handful of the things she is collecting. The box is the same size for every
   dot and the differences in size and spacing are drawn inside it, so the row
   cannot reflow and the current one is still only ever scaled. */
.dots i{flex:none; width:calc(.875rem * var(--ornament)); height:calc(.875rem * var(--ornament));
        transition:transform .3s var(--ease);}
.dots i svg{display:block; width:100%; height:100%; overflow:visible;}
.dots i path{fill:var(--line-2);}
.dots i.on path, .dots i.now path{fill:var(--acc);}
.dots i.now{transform:scale(1.5);}

/* The word she reads and the word she is shown afterwards must be the
   same size, weight and spacing — otherwise the shape she memorised
   moves on her between one screen and the next.

   A word never breaks across lines: half a word on each line teaches the
   wrong shape. Instead it shrinks to fit the line, driven by its own length
   (--wl, set when it renders), so "February" at the largest text size still
   arrives whole. .8 is the measured average glyph advance of this bold face
   at this letter-spacing, plus headroom: the widest real word tested came to
   .763 ("enough"). Past about fourteen letters the floor takes over and it
   wraps, which is still better than clipping letters off a word she is
   about to copy. */
.word,.marked{
  text-align:center; font-weight:700; line-height:1.35;
  letter-spacing:.06em; word-spacing:.1em; margin:var(--s2) 0 var(--s1);
  padding-bottom:.08em; overflow-wrap:anywhere;
  font-size:clamp(.75rem, calc((min(100vw, 34rem) - 2 * var(--s4)) / (var(--wl,6) * .8)), var(--t-3xl));}
.marked b{color:var(--ink); font-weight:700;}
.marked u{color:var(--retry); text-decoration:none; border-bottom:3px solid var(--retry);}

.syls{display:flex; flex-wrap:wrap; justify-content:center; gap:var(--s2); margin-top:var(--s3);}
.syl{padding:var(--s2) var(--s3); border-radius:var(--r-sm); background:var(--acc-soft);
     color:var(--acc); font-size:var(--t-xl); font-weight:700; letter-spacing:.03em;
     border:1px solid transparent;}
@media (prefers-color-scheme:dark){ .syl{color:var(--ink);} }
.syl:active{border-color:var(--acc);}

.note{text-align:center; color:var(--ink-soft); margin:var(--s4) 0 0; font-size:var(--t-md);
      max-width:32ch; margin-left:auto; margin-right:auto;}
.verdict{text-align:center; font-size:var(--t-md); font-weight:700; margin:0 0 var(--s2);}
.verdict.ok{color:var(--good);}
.verdict.again{color:var(--retry);}

.hear{display:flex; align-items:center; justify-content:center; gap:var(--s2);
      margin:0 auto; min-height:var(--tap-lg); padding:0 var(--s4);
      border-radius:var(--r-md); background:var(--surface-2); border:1px solid var(--line-2);
      font-weight:700; font-size:var(--t-md);}
.hear svg{width:calc(1.375rem * var(--ornament)); height:calc(1.375rem * var(--ornament)); flex:none;}
.hear:active{background:var(--acc-soft);}

.spellin{width:100%; text-align:center; font-size:var(--t-2xl); font-weight:700;
         letter-spacing:.12em; padding:var(--s3); border-radius:var(--r-md);
         background:var(--surface-2); border:2px solid var(--line-2);}
.spellin:focus{outline:none; border-color:var(--acc);}

.primary{display:flex; align-items:center; justify-content:center; gap:var(--s2); width:100%;
         min-height:var(--tap-xl); margin-top:0; padding:var(--s2) var(--s4);
         border-radius:var(--r-lg); background:var(--acc); color:var(--acc-ink);
         font-size:var(--t-lg); font-weight:700; box-shadow:var(--shadow);
         transition:transform .18s var(--ease);}
.primary:active{transform:scale(.985);}
.quiet{display:block; width:100%; margin-top:var(--s3); min-height:var(--tap);
       border-radius:var(--r-md); color:var(--ink-soft); font-size:var(--t-md);
       font-weight:600; border:1px solid var(--line); background:var(--surface-2);}
.quiet:active{border-color:var(--line-2);}

/* ---------- finished ---------- */
.tick{text-align:center; font-size:calc(var(--t-4xl) * var(--ornament)); color:var(--acc); line-height:1;
      margin:var(--s2) 0 var(--s5);}
.headline{text-align:center; font-size:var(--t-xl); font-weight:700; margin:var(--s4) 0 var(--s1);}
.headline.cheer{color:var(--good);}
.pbar{height:var(--s2); border-radius:var(--r-pill); background:var(--line); overflow:hidden;
      margin:var(--s3) 0 var(--s5);}
.pbar i{display:block; height:100%; background:var(--acc); border-radius:var(--r-pill);
        transition:width .6s var(--ease);}

/* ---------- grown-ups ---------- */
.sect{margin-bottom:var(--s6);}
.sect h2{font-size:var(--t-xs); font-weight:800; letter-spacing:.14em; text-transform:uppercase;
         color:var(--ink-soft); margin-bottom:var(--s3);}
.field{margin-bottom:var(--s4);}
.field label, .field .lbl{display:block; font-size:var(--t-sm); font-weight:700; margin-bottom:var(--s1);}
.hint{font-size:var(--t-sm); color:var(--ink-soft); margin-top:var(--s1); max-width:42ch;}
.field input[type=text], .field textarea{
  width:100%; padding:var(--s3); border-radius:var(--r-md); background:var(--surface-2);
  border:1px solid var(--line-2); line-height:1.6;}
.field textarea{min-height:5.5rem; resize:vertical;}
/* Left to the browser, the placeholder is a fixed grey that ignores the colour
   scheme — 2.99:1 in dark mode. These carry real information about the format
   a list is expected in, so they sit on the same token as other soft text. */
.field input[type=text]::placeholder, .field textarea::placeholder{
  color:var(--ink-soft); opacity:1;}
.seg{display:flex; flex-wrap:wrap; gap:var(--s2);}
.seg button{min-height:var(--tap); padding:0 var(--s4); border-radius:var(--r-sm);
            border:1px solid var(--line-2); background:var(--surface-2); font-weight:600;
            color:var(--ink-soft); text-align:left;}
.seg button[aria-pressed=true]{background:var(--acc); color:var(--acc-ink); border-color:transparent;}
.swatch{position:relative; width:var(--tap); min-height:var(--tap); border-radius:var(--r-sm);
        border:2px solid var(--line-2); transition:transform .18s var(--ease);}
.swatch[aria-pressed=true]{border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); transform:scale(1.07);}
.swatch[aria-pressed=true]::after{content:"✓"; position:absolute; inset:0; display:flex;
        align-items:center; justify-content:center; color:#35705A; font-size:var(--t-lg); font-weight:800;}
.stats{display:flex; gap:var(--s2);}
.stat{flex:1 1 0; min-width:0; padding:var(--s3); border-radius:var(--r-md);
      background:var(--surface-2); border:1px solid var(--line);}
.stat b{display:block; font-size:var(--t-xl); font-weight:800; line-height:1.2;}
.stat span{display:block; font-size:var(--t-xs); line-height:1.4; color:var(--ink-soft);}
.danger{color:var(--retry); border-color:var(--retry)!important;}
.chips{display:flex; flex-wrap:wrap; gap:var(--s2);}
.chip{display:inline-flex; align-items:center; min-height:var(--tap);
      padding:var(--s1) var(--s3); border-radius:var(--r-sm); background:var(--surface-2);
      border:1px solid var(--line); font-size:var(--t-sm); font-weight:600;}
.stamp{display:block; text-align:center; font-size:var(--t-xs); letter-spacing:.1em;
       color:var(--ink-soft); opacity:.6; margin-top:var(--s6);}

/* Visible to a screen reader, not to the eye. */
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0;}
/* Out of sight but still focusable — display:none or visibility:hidden would
   drop the focus and let the keyboard go. */
#kbhold{position:fixed; bottom:0; left:0; width:1px; height:1px; opacity:0;
        border:0; padding:0; font-size:16px; pointer-events:none; z-index:-1;}

/* ---------- what she knows ---------- */
/* Everything drawn is inside the frame now — the hairs are fitted along with the
   cells and the filaments are held inside it — so this clips nothing in practice.
   It stays as a guarantee that the picture can never spill over her words.
   The width comes from the drawing itself: it is small on her first evening and
   full width once she is a long way in, so it is centred rather than sitting off
   to one side of the space it has. The height comes from the drawing too, by way
   of the frame's own proportions — the frame is cropped to the shape of what is
   drawn rather than squared up, and height:auto is what carries that onto the
   page. NET_TALL is the limit on how tall that can get. */
.net{display:block; width:100%; height:auto; margin:var(--s2) auto var(--s3);
     overflow:hidden;}
/* The frame is a camera and it zooms in when there is little to show, so the
   strokes are pinned to the screen instead of scaling with it — otherwise a
   hairline becomes a rope on the day she has a dozen words. */
.net path{vector-effect:non-scaling-stroke;}
.net-hair{fill:none; stroke:var(--acc); stroke-width:.7; stroke-linecap:round; opacity:.22;}
.net-link{fill:none; stroke:var(--line-2); stroke-width:.6; opacity:.45;}
.net-link.lit{stroke:var(--acc); opacity:.4; stroke-width:.9;}
/* Ghosted: what she has met, and a few days of what is coming, waiting to be
   filled. */
/* The second line round a word she has not met yet — see the sketch loop. Lighter
   than the word's own outline, so the pair reads as one sketched shape rather than
   as two words on top of each other. */
.net-sketch{fill:none; stroke:var(--line-2); stroke-width:.6; opacity:.55;}
/* The paper, painted in behind each cell so a thread passing under an empty
   outline does not read as a line struck through it. */
.net-plate{fill:var(--surface); stroke:none;}
.net-cell{fill:var(--acc); fill-opacity:var(--f, 0); stroke:var(--line-2); stroke-width:.8;}
.net-cell.met{stroke:var(--acc); stroke-opacity:.5;}
.net-cell.well{stroke:var(--acc); stroke-opacity:1; stroke-width:1;}

/* ---------- toast ---------- */
#toast{position:fixed; left:50%; bottom:calc(var(--s5) + env(safe-area-inset-bottom));
       transform:translateX(-50%); padding:var(--s3) var(--s4); border-radius:var(--r-md);
       background:var(--ink); color:var(--surface); font-size:var(--t-sm); font-weight:600;
       z-index:30; opacity:0; pointer-events:none; transition:opacity .3s var(--ease);
       max-width:88vw; text-align:center;}
#toast.on{opacity:.96;}

/* The software keyboard takes half the screen, and at the larger text sizes that
   left the box she is typing into entirely off screen — she would have been
   spelling blind. This cannot be a height media query: rem in a media query
   resolves against the initial font size, not her chosen one, and on iOS the
   keyboard does not change the layout viewport at all. data-tight is set from
   visualViewport, measured against the real root font size. Scoped to the
   writing stage — on the grown-ups screen this would hide the way back out. */
:root[data-tight]:not([data-stage=parent]) .bar,
:root[data-tight]:not([data-stage=parent]) .dots,
:root[data-tight]:not([data-stage=parent]) .note{ display:none; }
:root[data-tight][data-stage=done] .tick,
:root[data-tight][data-stage=done] .pbar{ display:none; }
:root[data-tight][data-stage=write] .spellin{ padding:var(--s2); }
:root[data-cramped][data-stage=write] .spellin{ font-size:var(--t-lg); letter-spacing:.08em; }
/* Landscape with a keyboard up leaves almost nothing. The action keeps a real
   44px target but stops scaling with her text, and the page padding tightens,
   so what she is looking at still has somewhere to be. */
:root[data-cramped]:not([data-stage=parent]) #act .primary,
:root[data-cramped]:not([data-stage=parent]) #act .quiet{
  min-height:calc(var(--tap) * var(--ornament)); font-size:var(--t-md); padding:0 var(--s3); }
:root[data-cramped]:not([data-stage=parent]) #act .hear{
  min-height:calc(var(--tap) * var(--ornament)); }
:root[data-cramped]:not([data-stage=parent]) #app{
  padding-top:0; padding-bottom:var(--s1); }
:root[data-cramped][data-stage=done] .headline{ font-size:var(--t-lg); margin:0; }
/* The verdict is a caption; with this little room the word it captions wins.
   The syllable chips are a real aid, so they hold on one step longer. */
:root[data-tight][data-stage=check] .verdict{ font-size:var(--t-sm); margin:0; }
:root[data-cramped][data-stage=check] .syls{ display:none; }
/* The word is fitted to the width it has, which says nothing about height. With
   this little of that, its ceiling comes down — a smaller word she can see beats
   a bigger one cut off at the edge of the panel. */
:root[data-cramped]:not([data-stage=parent]):not([data-stage=done]) .word,
:root[data-cramped]:not([data-stage=parent]):not([data-stage=done]) .marked{
  font-size:clamp(.75rem, calc((min(100vw, 34rem) - 2 * var(--s4)) / (var(--wl,6) * .8)),
                  var(--t-lg));}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important; transition-duration:.001ms!important;}
}
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="bar"></div>
  <main id="screen"></main>
  <div id="act"></div>
</div>
<p id="say" class="sr" role="status" aria-live="polite"></p>
<!-- Holds the software keyboard open between stages. Without it the keyboard
     closes the moment the spelling box goes away, and the two buttons drop to the
     bottom of the screen and jump back up again on the next word — twice per

    });

  var all = englishVoices().slice().sort(function(a,b){ return voiceScore(b) - voiceScore(a); });

// Everything a sitting could ask to speak, in the order she will meet it.

}

  try{
    var a = document.createElement('audio');
    var t = CLIP_EXT === '.mp3' ? 'audio/mpeg'

function clipFor(text){

function haveClips(list){

  for(var i = 0; i < list.length; i++) if(!clipFor(list[i])) return false;

function say(text, opts){

// A piece of a word is always spoken slower than the whole, whatever speed she

function sylRate(){ return Math.max(.5, (Number(S.settings.speechRate) || .95) - .25); }

[0, 250, 800, 2000].forEach(function(ms){ setTimeout(voicesChanged, ms); });

function allLists(){
  return LISTS.map(function(l){ return {id:l.id, name:l.name, words:l.words, builtIn:true}; })

function activeList(){
  var all = allLists();
  return all.filter(function(l){ return l.id === S.words.activeId; })[0] || all[0];
}
function wordsOf(list){
  if(!list) return [];
  return Array.isArray(list.words) ? list.words.slice() : Object.keys(list.words);
}
/* iOS Smart Punctuation is on by default and a web page cannot turn it off —
   autocorrect="off" does not touch it — so the box she types in gets a curly ’
   whether anyone wants one or not. A list pasted out of a newsletter or a Word
   document brings the same characters in from the other end. Both are tidied to
   the plain ones the word lists use, so she is never marked wrong for what her
   keyboard did, and never taught "dont" because a paste dropped the apostrophe
   instead of fixing it. */
function tidyPunct(text){
  return String(text == null ? '' : text)
    .replace(/[\u2018\u2019\u201A\u201B\u2032\u00B4`]/g, "'")
    // Hyphen substitutes only. An em dash is punctuation between words, never a
    // hyphen inside one, so it is left to be treated as a separator.
    .replace(/[\u2010\u2011\u2012\u2013\u2212]/g, '-');
}
// Reading her answer, be generous about which dash came out: typing "--" on a
// phone puts an em dash in the box. Reading a pasted list, an em dash is a
// separator between words, so it is not folded there.
function tidyTyped(text){ return tidyPunct(text).replace(/[\u2014\u2015]/g, '-'); }
// Whatever the school sends: commas, new lines, numbering, stray bullets.
function parseWordList(text){
  return tidyPunct(text)
    .split(/[\s,;\u2014\u2015]+/)
    .map(function(w){
      return w.replace(/^[\d]+[.)]?/, '')
              .replace(/[^A-Za-z'\-]/g, '')
              // Bullets and stray quotes cling to the ends of pasted words.
              .replace(/^[-']+|[-']+$/g, '')
              .toLowerCase();
    })
    // Two letters up to the longest word a child would be set — anything
    // longer came from pasting something that wasn't a word list.
    .filter(function(w){ return w.length >= 2 && w.length <= 24; })
    .filter(function(w, i, a){ return a.indexOf(w) === i; });
}

/* =========================================================
   5. Syllables. Built-in lists carry hand-checked splits; this
   only has to serve words a grown-up pastes in, where readable
   chunks matter more than dictionary perfection.
   ========================================================= */
var ONSET_DIGRAPHS = ['ch','sh','th','ph','wh'];      // lead the next syllable: mo·ther
var CODA_DIGRAPHS  = ['ck','ng','gh'];                // close the previous one: neigh·bour
var DIGRAPHS = ONSET_DIGRAPHS.concat(CODA_DIGRAPHS);
// Consonant + liquid starts a syllable (ta·ble). s-clusters do not: medially the
// s closes the syllable before it (bas·ket, lis·ten, ques·tion).
var ONSET_BLENDS = ['bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','tr','tw','thr','shr'];
// Everything English will actually start a syllable with. Not the same list:
// ONSET_BLENDS is about where to prefer a cut, this is about whether a chunk can
// be said at all. "tn" and "dl" are on neither, which is the whole point —
// for·tnight and frien·dly are chunks nobody can read aloud.
var ONSET_CLUSTERS = ONSET_BLENDS.concat(ONSET_DIGRAPHS,
  ['gu','qu','sc','sk','sl','sm','sn','sp','st','sw','dw','kn','wr','gn',
   'str','spr','scr','spl','squ','chr','phr']);
function sayableOnset(c){ return c.length < 2 || ONSET_CLUSTERS.indexOf(c) >= 0; }
var VOWEL_DIGRAPHS = ['ai','ay','ea','ee','ei','ey','ie','oa','oe','oi','oo','ou','ow','oy',
                      'ue','ui','au','aw','eu','ew','ya','ye','yo'];
// Suffixes that are never part of a root, so the stem can always be kept whole:
// morn·ing, talk·ing, thought·ful. The rest need the digraph guard below, because
// spelling alone cannot tell wa·ter from wat·er, or sa·cred from sacr·ed.
var SUFFIXES_FREE = ['ing','ful','ness','less','ment','able','ible'];
var SUFFIXES = SUFFIXES_FREE.concat(['er','est','ly','ed']);
// Compounds. No rule reads a word boundary out of spelling — "therefore" comes
// out "the·re·fore" and "anything" comes out "a·nyth·ing" — so the common ones
// a Year 4/5 list actually contains are hand-split here.
var COMPOUNDS = ('any·thing any·one any·where any·body every·thing every·one every·where '
  + 'some·thing some·one some·where some·times no·thing no·body no·where there·fore '
  + 'with·out with·in him·self her·self my·self your·self it·self them·selves our·selves '
  + 'can·not in·to up·on up·stairs down·stairs out·side in·side be·side along·side '
  + 'birth·day play·ground foot·ball net·ball week·end break·fast after·noon '
  + 'grand·mother grand·father grand·parents news·paper hand·writing some·body '
  + 'class·room bed·room bath·room black·board white·board day·light sun·light '
  + 'to·day to·night to·mor·row').split(' ')
  .reduce(function(m, x){ m[x.replace(/·/g, '')] = x.split('·'); return m; }, {});

function suffixSplit(s){
  for(var i = 0; i < SUFFIXES.length; i++){
    var suf = SUFFIXES[i];
    if(s.length <= suf.length + 3 || s.slice(-suf.length) !== suf) continue;
    var stem = s.slice(0, -suf.length);
    if(SUFFIXES_FREE.indexOf(suf) < 0 && DIGRAPHS.indexOf(stem.slice(-2)) < 0) continue;
    return [stem, suf];
  }
  return null;
}
function syllables(word){
  var s = String(word || '').toLowerCase().replace(/[^a-z'-]/g, '');
  // Hyphens are word boundaries: syllabify each side and keep the hyphen with
  // the part before it, so the pieces still spell the word she is looking at.
  if(s.indexOf('-') > 0 && s.slice(-1) !== '-'){
    var bits = s.split('-'), out = [];
    bits.forEach(function(bit, n){
      var parts = bit ? syllables(bit) : [];
      if(n < bits.length - 1) parts = parts.length ? parts.slice(0, -1).concat([parts[parts.length-1] + '-'])
                                                  : ['-'];
      out = out.concat(parts);
    });
    return out.filter(Boolean);
  }
  s = s.replace(/-/g, '');
  if(s.length <= 3) return s ? [s] : [];

  if(COMPOUNDS[s]) return COMPOUNDS[s].slice();

  var suf = suffixSplit(s);
  if(suf) return syllables(suf[0]).concat([suf[1]]);

  function isV(c, i){ return 'aeiou'.indexOf(c) >= 0 || (c === 'y' && i > 0); }

  var groups = [], i, j, k;
  for(i = 0; i < s.length; i++){
    if(!isV(s[i], i)) continue;
    j = i;
    while(j + 1 < s.length && isV(s[j+1], j+1)) j++;
    var a = i;
    // 'qu' and 'gu' before another vowel are consonants: quiet, guard, language,
    // tongue. When the u is the nucleus ('re·gu·lar') j === i and this is skipped.
    if(s[i] === 'u' && i > 0 && 'qg'.indexOf(s[i-1]) >= 0 && j > i) a = i + 1;
    // A vowel run is usually one sound (rain) but sometimes two (li·on). Split
    // the pairs that aren't digraphs, keeping -tion/-sion/-cial intact.
    var start = a;
    for(k = a; k < j; k++){
      var pair = s.slice(k, k+2), before = s[k-1] || '', after = s[k+2] || '';
      var oneSound = VOWEL_DIGRAPHS.indexOf(pair) >= 0
                  || ('tscx'.indexOf(before) >= 0 && 'nl'.indexOf(after) >= 0);
      if(!oneSound){ groups.push([start, k]); start = k + 1; }
    }
    groups.push([start, j]);
    i = j;
  }
  if(groups.length < 2) return [s];

  // A final consonant + "le"/"re" is its own syllable (ta·ble, cen·tre);
  // otherwise a silent final 'e' is not a nucleus (com·plete).
  var leEnding = /[^aeiou](le|re)$/.test(s);
  if(!leEnding && s.slice(-1) === 'e' && groups.length > 1){
    var last = groups[groups.length-1];
    if(last[0] === last[1] && last[0] === s.length-1) groups.pop();
  }
  if(groups.length < 2) return [s];

  var cuts = [];
  for(k = 0; k < groups.length - 1; k++){
    var av = groups[k][1], bv = groups[k+1][0], L = bv - av - 1;
    if(L === 1 && s[av+1] === 'x'){ cuts.push(av + 2); continue; }    // ex·am, tax·i
    if(L <= 1){ cuts.push(av + 1); continue; }                        // li·on / wa·ter
    var pr = s.slice(av+1, av+3);        // the two after the vowel
    var onset2 = s.slice(bv - 2, bv);    // the two before the next one
    var nx = s.slice(av+2, av+4);
    var cut;
    if(ONSET_DIGRAPHS.indexOf(pr) >= 0)          cut = av + 1;   // mo·ther
    else if(onset2 === 'gu' || onset2 === 'qu')   cut = bv - 2;   // lan·guage, ban·quet
    else if(CODA_DIGRAPHS.indexOf(pr) >= 0)      cut = av + 3;   // neigh·bour
    else if(ONSET_BLENDS.indexOf(onset2) >= 0)   cut = bv - 2;   // ta·ble
    else if(L >= 3 && DIGRAPHS.indexOf(nx) >= 0) cut = av + 2;   // an·them
    else                                         cut = av + 2;   // hap·pen
    // Whichever of those chose it, a cut in a three-consonant cluster can leave a
    // chunk nobody can say: for·tnight, par·tner, frien·dly, a·thlete. Move it
    // along until what opens the next chunk is a real onset. The consonant-le
    // syllable is the exception — bot·tle and cas·tle are how it is taught, and
    // "tle" is only ever the end of a word.
    while(cut < bv - 1 && !sayableOnset(s.slice(cut, bv)) && !/^[^aeiouy]+le$/.test(s.slice(cut))) cut++;
    cuts.push(cut);
  }

  var out = [], from = 0;
  cuts.forEach(function(c){ if(c > from && c < s.length){ out.push(s.slice(from, c)); from = c; } });
  out.push(s.slice(from));
  return out.filter(Boolean);
}
function splitOf(word){
  var list = activeList();
  var hand = list && list.words && !Array.isArray(list.words) ? list.words[word] : null;
  return hand ? String(hand).toLowerCase().split('·') : syllables(word);
}

/* =========================================================
   6. Spaced repetition and the self-adapting pace.

   Boxes 1..7 in elapsed days, roughly doubling — where both the
   spacing research and FSRS's fitted intervals land. Boxes 6 and 7
   exist so a word she knows well stops coming back every week
   forever. Box 5 is "known well": four correct retrievals on four
   different days, which is where the benefit levels off.
   ========================================================= */
var BOX_DAYS = {1:0, 2:1, 3:2, 4:4, 5:8, 6:21, 7:60};
var MAX_BOX = 7, KNOWN_BOX = 5;

function mastery(word){
  return S.words.mastery[word] || {right:0, wrong:0, box:1, lastSeen:null};
}
function acquiring(w){ return (mastery(w).box || 1) <= 1; }
function isDue(word, today){
  var m = mastery(word);
  if(!m.lastSeen) return true;
  var gap = dayDiff(today, m.lastSeen);
  // A last-seen date in the future means the clock moved, not that she is ahead
  // of schedule. Left alone the word would never come due again.
  if(gap < 0) return true;
  return gap >= BOX_DAYS[m.box || 1];
}
// How far past its interval a word is — the one closest to being forgotten
// comes back first.
function overdueRatio(word, today){
  var m = mastery(word);
  if(!m.lastSeen) return Infinity;
  var gap = dayDiff(today, m.lastSeen);
  if(gap < 0) return 1;                     // clock moved; treat it as due now
  return gap / Math.max(1, BOX_DAYS[m.box || 1] || 1);
}
function recordWord(word, outcome){          // 'first' | 'later' | 'wrong'
  var m = Object.assign({right:0, wrong:0, box:1, lastSeen:null}, S.words.mastery[word]);
  var box = m.box || 1, sameDay = m.lastSeen === todayISO();
  if(outcome === 'first'){
    m.right++;
    // One box per calendar day: two goes in an evening shouldn't fast-track a
    // word past intervals measured in days.
    if(!sameDay) m.box = Math.min(MAX_BOX, box + 1);
  }else if(outcome === 'later'){
    m.right++;                               // got there after a miss — no penalty, no advance
  }else{
    m.wrong++;
    // Large but partial: a word known for two months slips to a one-day retry
    // rather than starting again from nothing.
    m.box = box <= 2 ? 1 : Math.max(2, box - 2);
  }
  m.lastSeen = todayISO();
  S.words.mastery[word] = m;
  save();
  return m;
}
function knownCount(list){
  return wordsOf(list).filter(function(w){ return (mastery(w).box || 1) >= KNOWN_BOX; }).length;
}

/* Pace. Practice works best around 80-85% success: below that she is being
   overloaded, above it she is coasting. So the number of new words follows her
   accuracy rather than a fixed setting. */
var ACQUIRING_CAP = 3;      // words still being learned, at once — never more
var SEED_NEW = 3;           // her very first session
var PACE_WINDOW = 5;        // sessions to judge on
var PACE_MIN_WORDS = 12;    // ...over at least this many words
var PACE_HIGH = .85, PACE_LOW = .70;
var NEW_SHARE = 1/3;        // at most a third of a sitting is new material
var MIN_SESSION = 4;

function recentAccuracy(){
  var ss = (S.words.sessions || []).slice(-PACE_WINDOW);
  var words = ss.reduce(function(n, s){ return n + (s.words || 0); }, 0);
  var first = ss.reduce(function(n, s){ return n + (s.firstTime || 0); }, 0);
  return words >= PACE_MIN_WORDS ? first / words : null;    // null = too early to judge
}
// How many words a sitting is. Doing well earns a slightly longer one; a bad
// run shortens it. Eight is the everyday case — a few minutes, not homework.
function sessionWords(){
  var acc = recentAccuracy();
  if(acc === null) return 7;
  if(acc >= PACE_HIGH) return 9;
  if(acc <  PACE_LOW)  return 6;
  return 8;
}
function newWordsToday(){
  if(!(S.words.sessions || []).length) return SEED_NEW;
  var acc = recentAccuracy();
  if(acc === null) return 1;
  if(acc >= PACE_HIGH) return 3;      // flying — up to the three-a-day ceiling
  if(acc >= PACE_LOW)  return 1;      // in the sweet spot
  return 0;                           // struggling — consolidate, add nothing
}
// The rest of the sitting is words she can already spell. Keeping new material
// to a third is what holds the success rate where practice actually sticks.
function poolCap(){
  // Her first night is all new by definition, so the share doesn't apply.
  if(!(S.words.sessions || []).length) return SEED_NEW;
  return Math.max(1, Math.min(ACQUIRING_CAP, Math.floor(sessionWords() * NEW_SHARE)));
}
function paceLabel(){
  var acc = recentAccuracy(), n = newWordsToday();
  return (acc === null ? 'Finding her level' : Math.round(acc * 100) + '% right first time')
       + ' · ' + (n === 0 ? 'no new words yet' : n + (n === 1 ? ' new word' : ' new words') + ' a session');
}

/* Yesterday's words come back before anything new is introduced, most of a
   session is words she can already spell, and it opens with one she is likely
   to get right rather than the hardest thing she owns. */
function buildSession(list, today){
  var all = wordsOf(list);
  function seen(w){ return !!S.words.mastery[w]; }

  var review = all.filter(function(w){ return seen(w) && !acquiring(w) && isDue(w, today); })
                  .sort(function(a,b){ return overdueRatio(b, today) - overdueRatio(a, today); });
  var started = all.filter(function(w){ return seen(w) && acquiring(w); })
                   .sort(function(a,b){ return String(mastery(a).lastSeen).localeCompare(String(mastery(b).lastSeen)); });
  var never = all.filter(function(w){ return !seen(w); });

  var size = sessionWords(), cap = poolCap();
  var acq = started.slice(0, cap);
  var room = Math.min(newWordsToday(), cap - acq.length);
  never.forEach(function(w){ if(room-- > 0) acq.push(w); });

  // The rest of the sitting is review. If not enough is strictly due, pull
  // forward the nearest — better than a screen of nothing but misses.
  var wantRev = Math.max(2, size - acq.length);
  var rev = review.slice(0, wantRev);
  if(rev.length < wantRev){
    all.filter(function(w){ return seen(w) && !acquiring(w) && rev.indexOf(w) < 0; })
       .sort(function(a,b){ return overdueRatio(b, today) - overdueRatio(a, today); })
       .forEach(function(w){ if(rev.length < wantRev) rev.push(w); });
  }
  // A floor, so a bad run cannot freeze the app: one new word beats a
  // thirty-second session she has no reason to come back to. It is best-effort
  // and the cap on words being learned at once always wins — a list where she
  // has one word in hand and a bad week behind her yields a three-word sitting
  // rather than three new words at once, which is the right way round.
  if(acq.length + rev.length < MIN_SESSION){
    never.forEach(function(w){
      if(acq.length + rev.length < MIN_SESSION && acq.length < cap && acq.indexOf(w) < 0) acq.push(w);
    });
  }
  if(!rev.length && !acq.length){
    return all.slice().sort(function(a,b){ return overdueRatio(b, today) - overdueRatio(a, today); })
              .slice(0, size);
  }

  // Thread the acquiring words through the review rather than blocking them at
  // the front, and open with the safest one.
  var total = acq.length + rev.length;
  var out = [];
  if(rev.length) out.push(rev.shift());
  var gap = Math.max(1, Math.ceil((rev.length + 1) / (acq.length + 1)));
  var ri = 0, ai = 0;
  while(ri < rev.length || ai < acq.length){
    for(var k = 0; k < gap && ri < rev.length; k++) out.push(rev[ri++]);
    if(ai < acq.length) out.push(acq[ai++]);
  }
  return out.filter(function(w, i, a){ return a.indexOf(w) === i; })
            .slice(0, Math.min(size, total));
}

/* =========================================================
   7. Comparing her attempt. Longest common subsequence, so one
   dropped letter doesn't mark the whole word wrong.
   ========================================================= */
function matched(attempt, target){
  // Tidied on both sides, so the marking lines up on what she meant to type
  // rather than on which apostrophe her phone chose.
  var a = tidyTyped(attempt).toLowerCase(), b = tidyTyped(target).toLowerCase();
  var n = a.length, m = b.length, dp = [], i, j;
  for(i = 0; i <= n; i++){ dp.push(new Array(m+1).fill(0)); }
  for(i = 1; i <= n; i++)
    for(j = 1; j <= m; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  var hit = {}, count = 0;
  i = n; j = m;
  while(i > 0 && j > 0){
    if(a[i-1] === b[j-1]){ hit[j-1] = true; count++; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  return {hit:hit, count:count};
}
function sameWord(a, b){
  return tidyTyped(a).trim().toLowerCase() === tidyTyped(b).trim().toLowerCase();
}

/* =========================================================
   8. A practice session.

   A brand-new word gets look, cover, write, check. Every word she
   has met before goes straight to writing it from memory — showing
   it first would make this a copying exercise, which is what undoes
   the benefit of practising at all.
   ========================================================= */
var W = null;
function stageFor(word){ return acquiring(word) ? 'look' : 'write'; }
// Starting a word: within a session it is only ever shown once. After that —
// whether she missed it or copied it correctly — it is asked from memory.
// Records the showing, so call it once per word as it comes up.
function beginStage(word){
  if(W && (W.failed.indexOf(word) >= 0 || W.shown.indexOf(word) >= 0)) return 'write';
  var st = stageFor(word);
  if(st === 'look' && W) W.shown.push(word);
  return st;
}

function start(){
  var words = buildSession(activeList(), todayISO());
  if(!words.length) return false;
  W = {words:words, i:0, stage:'write', attempt:'', tries:0,
       // plan is the number of words the sitting set out to cover. Requeued
       // words lengthen W.words but not the plan, so progress only ever moves
       // forward — a row of dots that grew would read as losing ground.
       plan:words.length, right:0, firstTime:0,
       requeue:[], failed:[], shown:[], asked:[], done:[]};
  W.stage = beginStage(words[0]);
  screen = 'day';
  render();
  // Speaking never waits on the network: it says the word now, and the rest of
  // the sitting is fetched behind it so nothing after this one waits at all. The
  // word just spoken is left out, or the element and the prefetch would race for
  // the same file and it would be fetched twice.
  say(words[0]);
  // The word just spoken goes last, so the element's own request finishes first
  // and this one comes off the browser's cache instead of racing it — but it is
  // still stored, or a sitting with no signal would start on a missing clip.
  var ahead = sittingPhrases().filter(function(p){ return p !== words[0]; });
  warmClips(ahead.concat([words[0]]));
  return true;
}
function word(){ return W && W.words[W.i]; }

function check(){
  var w = word();
  W.attempt = (el('#type') ? el('#type').value : W.attempt) || '';
  // An empty box isn't an attempt — a fumbled tap must not cost her a word.
  if(!W.attempt.trim()){ toast('Have a go — type the word.'); return; }
  W.tries++;
  var ok = sameWord(W.attempt, w);
  var firstAsk = W.asked.indexOf(w) < 0;
  if(firstAsk) W.asked.push(w);
  if(ok){
    // Only the first ask of the day can advance the word — a second correct go
    // in the same sitting is a good sign, not a day's worth of progress.
    recordWord(w, firstAsk ? 'first' : 'later');
    W.right++;
    if(W.done.indexOf(w) < 0) W.done.push(w);      // finished, however many goes it took
    if(firstAsk){
      W.firstTime++;
      // A word she has just been shown gets one more go later in this same
      // session, from memory. That way its first cold retrieval happens today
      // while it is still fresh, rather than as a hard surprise tomorrow.
      if(W.shown.indexOf(w) >= 0 && W.requeue.indexOf(w) < 0) W.requeue.push(w);
    }
    chime('right');
  }else if(W.failed.indexOf(w) < 0){
    // Marked down once, then queued to come back later in this same session —
    // a real retrieval a few words on, rather than a copy off the screen.
    W.failed.push(w);
    recordWord(w, 'wrong');
    if(W.requeue.indexOf(w) < 0) W.requeue.push(w);
  }
  W.stage = 'check';
  render();
  if(!ok) sayParts(w, splitOf(w));
}
function next(){
  // Keep just ahead of her: the next word and its pieces, if they are not
  // already on the device.
  if(W){
    var soon = W.words.slice(W.i + 1, W.i + 3);
    if(soon.length) setTimeout(function(){
      warmClips(soon.concat(soon.reduce(function(a, w){ return a.concat(splitOf(w)); }, [])));
    }, 0);
  }
  if(W.i + 1 < W.words.length) W.i++;
  else if(W.requeue.length){ W.words.push(W.requeue.shift()); W.i++; }
  else { finish(); return; }
  W.stage = beginStage(word()); W.attempt = ''; W.tries = 0;
  render();
  say(word());
}
function finish(){
  var distinct = W.words.filter(function(w, i, a){ return a.indexOf(w) === i; }).length;
  S.words.sessions.push({date:todayISO(), list:(activeList() || {}).id,
                         asked:W.words.length, words:distinct,
                         right:W.right, firstTime:W.firstTime});
  if(S.words.sessions.length > 60) S.words.sessions = S.words.sessions.slice(-60);
  save();
  var every = W.firstTime === distinct;
  W = null;
  saying = withName(every ? 'Every one, first go{n}.' : 'All done{n}.');
  screen = 'day'; render();
  chime('done');
  /* The praise is shown, not spoken. There is no recording of it — there is no
     recording of anything with her name in it — so the phone voice had to read it,
     and a synthetic voice delivering "Every one, first go" lands somewhere between
     flat and sarcastic. Praise that sounds insincere is worse than praise nobody
     said out loud. The words she is practising are still spoken, because there the
     job is the sound of the word and not the warmth of it, and a screen reader is
     still told through the live region. */
}

/* =========================================================
   9. Render
   ========================================================= */
var screen = 'day', saying = '';
function el(s){ return document.querySelector(s); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function withName(s){
  var n = (S.profile.name || '').trim();
  return s.replace('{n}', n ? ', ' + n : '');
}
var SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M11 5 6.5 9H3.5v6h3L11 19V5Z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.4 6.6a8 8 0 0 1 0 10.8"/></svg>';

// The one live region in the app. It exists in the document from the start,
// because a region created inside fresh innerHTML is not reliably announced.
// A screen reader reads "because" as a word. She needs the letters.
function spellOut(w){ return String(w).split('').join(' '); }
// The eye gets the word; a screen reader gets its spelling, because reading
// "because" as a word conveys nothing about how it is spelt. role="img" is what
// makes the label authoritative over the contents — on a role-less div the
// label is not reliably exposed, and a second visually-hidden copy would put
// the word into the element's own text twice.
function wordBlock(cls, inner, word, style){
  return '<div class="' + cls + '" role="img" aria-label="' + esc(spellOut(word)) + '"'
       + style + '>' + inner + '</div>';
}
var _said = '';
function announce(text){
  var n = el('#say');
  if(!n) return;
  n.textContent = (text === _said ? text + ' ' : text);   // nudge a repeat so it is re-read
  _said = n.textContent;
}
/* The keyboard closing between stages made the two buttons jump down the screen
   and back up again, twice for every word. Keeping a focused input on the page
   at all times keeps it open, so they stay put. Touchscreens only: for anyone
   driving by keyboard or screen reader this would be a focus thief. */
function touchOnly(){
  try{ return matchMedia('(hover: none) and (pointer: coarse)').matches; }catch(e){ return false; }
}
function holdKeyboard(){
  var h = el('#kbhold');
  if(!h) return;
  // Held only while she is working through words on a touchscreen. Anywhere else
  // it has to let go, or the keyboard would sit over the grown-ups screen and
  // over the screen that tells her she is finished.
  var hold = !_kbd && touchOnly() && screen !== 'parent' && !!W && !el('#type');
  if(!hold){
    if(document.activeElement === h){ h.value = ''; try{ h.blur(); }catch(e){} }
    return;
  }
  if(document.activeElement === h) return;
  h.value = '';                                      // stray taps must not carry over
  try{ h.focus({preventScroll:true}); }catch(e){}
}

// Only move focus for someone driving by keyboard; on a touchscreen a focus
// ring appearing out of nowhere is just noise.
var _kbd = false;
addEventListener('keydown', function(e){ if(e.key === 'Tab') _kbd = true; }, true);
addEventListener('pointerdown', function(){ _kbd = false; }, true);

/* The visual viewport is what the software keyboard changes; on iOS the layout
   viewport and 100dvh both stay put. Following it keeps the footer above the
   keyboard, and tells the stylesheet how little room is left — measured against
   her actual root font size, because that is what decides whether the box fits. */
/* The keyboard's space is reserved from the moment her screen opens, using what
   it measured last time, and stays reserved even if the keyboard drops for a
   moment. Growing the app back and shrinking it again is the "dance": the two
   buttons slide down the screen and back up, and she has to look for them. A
   stable band of empty space is worth more than a moving target. Remembered
   across sittings, so the buttons are in the same place from the first screen —
   only the very first sitting on a new phone can move at all. */
var _kbInset = 0;

function fitViewport(){
  var vv = window.visualViewport;
  var h = Math.round(vv ? vv.height : window.innerHeight);
  var r = document.documentElement;
  if(!h) return;
  var full = Math.round(window.innerHeight) || h;
  var inset = Math.max(0, full - h);
  // Only a keyboard takes this much; browser chrome appearing is smaller and
  // should not pin the layout.
  if(inset > 120){
    if(inset > _kbInset) _kbInset = inset;
    if(S && S.settings && inset > (Number(S.settings.kbInset) || 0) && inset < full * 0.8){
      S.settings.kbInset = inset; save();
    }
  }
  if(!_kbInset && S && S.settings) _kbInset = Number(S.settings.kbInset) || 0;
  // Reserved on her screens only: on the grown-ups screen a band of dead space
  // would just get in the way of a long page.
  if(_kbInset && screen !== 'parent') h = Math.min(h, Math.max(200, full - _kbInset));
  r.style.setProperty('--vh', h + 'px');
  var em = parseFloat(getComputedStyle(r).fontSize) || 16;
  // 22em is what the writing screen needs with everything on it; 13em is what it
  // needs with the box and the action alone. Both measured, not guessed — the
  // first was 21em until the progress dots became her word shapes, which is half
  // a line taller than a row of circles was; measured across her five text sizes
  // the writing screen now wants 21.96em at the smallest of them. The panel is a
  // flex column, which does not collapse adjacent margins the way block layout
  // did, so the column runs a little taller than the arithmetic of the elements
  // alone suggests.
  if(h < 22 * em) r.setAttribute('data-tight', ''); else r.removeAttribute('data-tight');
  if(h < 13 * em) r.setAttribute('data-cramped', ''); else r.removeAttribute('data-cramped');
}
if(window.visualViewport){
  visualViewport.addEventListener('resize', fitViewport);
  visualViewport.addEventListener('scroll', fitViewport);
}
addEventListener('resize', fitViewport);
addEventListener('orientationchange', fitViewport);

/* Plays one recording on its own, with no fallback in the way, and reports what
   actually happened. Without this a browser that cannot decode them looks
   identical to one that can — the phone voice simply covers for it. */
/* Puts every recording on the device in one go, so nothing waits on a network
   again — and so a sitting works with no signal at all. */
var _saving = false, _savedMsg = '';
function saveAllClips(){
  if(_saving) return;
  _saving = true; _savedMsg = 'Saving…'; render();
  var all = CLIPS.slice();
  warmClips(all).then(function(n){
    _saving = false;
    var missed = all.filter(function(t){ return !clipUrl(t) ? false : !_blob[t]; }).length;
    // Blaming the connection when the app is open from a saved file, and there
    // is no connection involved at all, sends someone off fixing the wrong thing.
    _savedMsg = !canWarm()
      ? 'This copy is open from a file rather than from the web, so there is nothing to fetch.'
      : missed
        ? (all.length - missed) + ' of ' + all.length + ' saved on this device. '
          + missed + ' could not be saved — try again on a better connection, or make '
          + 'some room on the phone.'
        : 'All ' + all.length + ' saved on this device. They will not need the network again.';
    render();
  }).catch(function(){
    _saving = false;
    _savedMsg = 'Could not save them. Nothing was lost — she will hear the phone voice.';
    render();
  });
}

function testClip(){
  var first = null;
  for(var i = 0; i < CLIPS.length && !first; i++) if(clipFor(CLIPS[i])) first = CLIPS[i];
  if(!first){ _clipTest = 'Nothing is recorded yet.'; render(); return; }
  _clipTest = 'Playing “' + first + '”…';
  render();
  var el = new Audio(clipFor(first));
  var settled = false;
  function done(msg){ if(settled) return; settled = true; _clipTest = msg; render(); }
  el.addEventListener('ended', function(){
    done('Heard it. Recordings are working — that was “' + first + '”.'); });
  el.addEventListener('error', function(){
    done('That did not play. ' + (clipPlayable() ? 'The file may be damaged.'
         : 'This browser cannot decode ' + CLIP_EXT + ' at all.') +
         ' She is hearing the phone voice instead.'); });
  setTimeout(function(){ done('No answer either way after four seconds. ' +
    'If you heard it, recordings are working.'); }, 4000);
  var p = el.play();
  if(p && p.catch) p.catch(function(){ done('The browser refused to play it — tap again.'); });
}

function applySettings(){
  var r = document.documentElement;
  r.style.setProperty('--scale', S.settings.textScale || 1);
  r.setAttribute('data-tint', S.settings.tint || 'cream');
  fitViewport();                      // her text size changes what will fit
}
function render(){
  applySettings();
  document.documentElement.setAttribute('data-stage',
    screen === 'parent' ? 'parent' : W ? W.stage : 'done');
  if(screen === 'parent') renderParent();
  else if(W) renderWord();
  else renderDone();
  fitScreen();
  restoreFocus();
}

/* main scrolls inside itself, so anything that does not fit is quietly cut in
   half rather than pushed onto a second screen — and a screen that looks
   finished is not one a nine-year-old thinks to scroll. On a 375px phone at the
   largest text that was cutting "You'll see this one again in a moment." after
   "again"; on a 320px one it took the syllable pieces with it, which are the
   most useful thing on that screen.

   So: measure, and drop the least useful thing until the rest fits. Measured
   here rather than declared in a media query, because rem in a media query
   resolves against the initial font size and not the size she chose. It runs
   inside the same task as the render, so nothing is ever painted and then taken
   away. */
function fitScreen(){
  if(screen === 'parent') return;              // a long page there is fine
  var m = el('#screen');
  if(!m) return;
  // Least useful first. The word and its pieces are the lesson and never go; on
  // her finished screen the count is the point of the screen, so the bar and the
  // tick go before it. What is dropped is still announced either way.
  var order = W ? ['.note', '.dots', '.verdict'] : ['.pbar', '.tick', '.note'];
  for(var i = 0; i < order.length && m.scrollHeight > m.clientHeight + 1; i++){
    var n = m.querySelector(order[i]);
    if(n) n.style.display = 'none';
  }
}
// Focus follows the render: the spelling box when there is one, otherwise the
// action, otherwise whatever the first control is — the finished screen offers
// only a quiet button, and dropping to the top of the document there would
// leave a keyboard user hunting for it. Touch users get none of this: a focus
// ring appearing from nowhere is only noise.
function restoreFocus(){
  var inp = el('#type');
  if(inp){
    inp.focus({preventScroll:true});
    inp.setSelectionRange(inp.value.length, inp.value.length);
    return;
  }
  if(!_kbd){ holdKeyboard(); return; }
  var go = el('#act button') || el('#screen .primary') || el('#screen button');
  if(go) go.focus({preventScroll:true});
}
/* The mark on her screens: a seed, drawn the way everything else she is
   collecting is drawn — the same jitter and the same cornerless curve through the
   midpoints as a progress dot or a cell on her map, with three points in the ring
   instead of seven, so it is three lobes rather than three sides.

   It is a sibling of cellPoints rather than a call to it. Laid out from angle zero,
   three points put a lobe straight out to the right and the thing lies on its
   side; this one is turned so a lobe sits at the bottom and two carry the top.
   That does not belong in the function that draws her words, where every shape is
   one of a hundred in a colony and none of them has an up.

   Three near-equal lobes, chosen over a tapered seed after looking at sixteen
   variants at the size it is actually used — 15 to 20 pixels, where anything with
   a fine point loses it. The angles carry their own asymmetry (95, 212, 330 rather
   than 90, 210, 330), which is why this needs no random number generator at all:
   the jitter is in the numbers, so it is the same shape on every render and every
   reload without having to be seeded. */
var MARK_LOBES = [[95, 10.4], [212, 9.5], [330, 10.2]];    // degrees, then radius
function markPoints(){
  return MARK_LOBES.map(function(s){
    var a = s[0] * Math.PI / 180;
    return [Math.cos(a) * s[1], Math.sin(a) * s[1]];
  });
}
/* Fitted to the square the outline actually fills, so the drawing meets the edges
   of the box the letters had rather than sitting inside a margin of nothing — and
   so it lands identically at every text size, the box being the only thing that
   changes. Built once: the shape is fixed, and the header is rebuilt on every
   render. */
function markSvg(){
  var pts = markPoints(), b = blobBounds(pts);
  var side = Math.max(b.x1 - b.x0, b.y1 - b.y0);
  var vx = (b.x0 + b.x1) / 2 - side / 2, vy = (b.y0 + b.y1) / 2 - side / 2;
  // role="img" with a label is what makes it announce as "Acorn" rather than as a
  // path nobody can read — the same reason the word she is shown carries one.
  return '<svg viewBox="' + vx.toFixed(2) + ' ' + vy.toFixed(2) + ' '
       + side.toFixed(2) + ' ' + side.toFixed(2) + '" role="img" aria-label="Acorn">'
       + '<path d="' + blobPath(pts) + '"/></svg>';
}
var MARK = markSvg();

// Her header: the mark (press and hold for grown-ups) and today's progress.
function header(done, total){
  var bar = (done != null && total)
    ? '<span class="daybar" role="img" aria-label="' + done + ' of ' + total + ' words done">'
      + '<i style="width:' + Math.round(100 * Math.min(done, total) / total) + '%"></i></span>' : '';
  el('#bar').innerHTML = '<h1 class="wordmark mark" id="wordmark">' + MARK
                       + '</h1><span class="sp"></span>' + bar;
}

/* The row above her word is her own words, not a row of circles: dot k is the
   word the sitting set out to cover at k, drawn with the outline that word has on
   the map on the grown-ups screen — the same shape for the same word, every time.
   The box each one sits in is a fixed size and the differences in size and
   spacing happen inside it, so the row is the same width whatever words came up
   and nothing reflows when the current one is scaled up. */
var DOT_BOX = 20;      // the little square each dot is drawn in
var DOT_R = 6.4;       // its middling radius, near enough the circle it replaces
function dotShape(w){
  var rnd = seeded('dot' + w);
  // The map's own driver — word length, capped at nine letters — but squeezed
  // into a tenth either side of the middle. On the map a long word is nearly
  // twice a short one; on a row of eight that would read as a ranking of her
  // words by length rather than as texture.
  var len = String(w).replace(/[^a-z']/gi, '').length;
  var r = DOT_R * (0.9 + 0.2 * Math.min(9, len) / 9);
  // And a nudge off centre, seeded by the word, so the gaps between them are not
  // all identical either. It stays inside the box, so it costs no layout.
  return {r:r, x:DOT_BOX / 2 + (rnd() - .5) * 5, y:DOT_BOX / 2 + (rnd() - .5) * 1.2};
}

function renderWord(){
  var w = word(), parts = splitOf(w), done = W.done.length;
  header(done, W.plan);

  // One dot per word the sitting set out to cover, filled as each is finished.
  var dots = '<div class="dots" aria-hidden="true">';
  for(var k = 0; k < W.plan; k++){
    var dw = W.words[k] || String(k), ds = dotShape(dw);
    dots += '<i class="' + (k < done ? 'on' : k === done ? 'now' : '') + '"'
         + ' data-r="' + ds.r.toFixed(2) + '" data-x="' + ds.x.toFixed(2) + '">'
         + '<svg viewBox="0 0 ' + DOT_BOX + ' ' + DOT_BOX + '" aria-hidden="true">'
         + '<path d="' + cellPath(dw, ds.x, ds.y, ds.r) + '"/></svg></i>';
  }
  dots += '</div>';

  // A one-syllable word needs no syllable row — it would just repeat itself.
  var sylRow = parts.length > 1
    ? '<div class="syls">' + parts.map(function(p){
        return '<button class="syl" data-syl="' + esc(p) + '" aria-label="Hear ' + esc(p)
             + '">' + esc(p) + '</button>'; }).join('') + '</div>'
    : '';
  var hear = '<button class="hear" id="hear" aria-label="Hear it">' + SPK + '<span>Hear it</span></button>';
  var body, act;

  var wl = ' style="--wl:' + w.length + '"';

  if(W.stage === 'look'){
    announce('Look at this word: ' + w + '. ' + spellOut(w) + '.');
    body = wordBlock('word', esc(w), w, wl) + sylRow
         // Saying it aloud is a free win and nothing checks it, so there is no
         // way for it to go wrong. Tracing used to be suggested here too, but a
         // finger dragged across the word scrolls the panel instead, so the app
         // was asking her to do something it then fought.
         + '<div class="note">Say it out loud.</div>';
    act = hear + '<button class="primary" id="cover">Cover it up</button>';
  }
  else if(W.stage === 'write'){
    var fresh = W.shown.indexOf(w) < 0 && W.failed.indexOf(w) < 0;
    // Never the word itself here — announcing it would give the spelling away.
    announce(fresh ? 'Listen, then write it.' : 'Now write it from memory.');
    body = '<div class="note">' + (fresh ? 'Listen, then write it.' : 'Now write it from memory.') + '</div>'
         + '<input class="spellin" id="type" type="text" inputmode="text" autocomplete="off" '
         +   'autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" '
         +   'value="' + esc(W.attempt) + '" aria-label="Type the word">';
    act = hear + '<button class="primary" id="check">Check</button>';
  }
  else {
    var ok = sameWord(W.attempt, w);
    var m = matched(W.attempt, w);
    var missing = w.length - m.count;
    // Marking every letter says only "all of this is wrong", which helps nobody
    // — so below half matched, show the word plainly instead. And with nothing
    // missing there is nothing to mark: every letter of the word was there, so
    // she has added something ("togeather"). Naming that is more use than a row
    // of unmarked letters under "look at these letters".
    var close = w.length ? m.count / w.length >= .5 && missing > 0 : false;
    var extra = !ok && missing === 0;
    var marks = w.split('').map(function(c, i){
      return m.hit[i] ? '<b>' + esc(c) + '</b>' : '<u>' + esc(c) + '</u>'; }).join('');
    var more = (W.i + 1 < W.words.length) || W.requeue.length;
    var verdict = ok ? (W.failed.indexOf(w) >= 0 ? 'You got there.' : 'Yes — that’s it.')
                : extra ? 'So close — there’s an extra bit in there.'
                : close ? (missing === 1 ? 'So close. Look at this letter.'
                                         : 'So close. Look at these letters.')
                        : 'Here it is. Have a good look.';
    // Spelt out letter by letter: a screen reader would otherwise read the word
    // as a word and never convey the spelling, which is the whole point here.
    announce(verdict + ' ' + w + '. ' + spellOut(w) + '.');
    body = '<div class="verdict ' + (ok ? 'ok' : 'again') + '">' + verdict + '</div>'
         // Only ever the correct spelling on screen. Seeing her own misspelling
         // is the one thing that measurably sets spelling back.
         + (ok || !close ? wordBlock('word', esc(w), w, wl)
                         : wordBlock('marked', marks, w, wl))
         + sylRow
         // Words first, then what happens next, then the buttons — so what she
         // reads runs top to bottom without a button interrupting it.
         + (!ok ? '<div class="note">You’ll see this one again in a moment.</div>' : '');
    act = hear + '<button class="primary" id="next">' + (more ? 'Next word' : 'Finish') + '</button>';
  }

  el('#screen').innerHTML = dots + body;
  el('#act').innerHTML = act;
}

function renderDone(){
  var list = activeList(), all = wordsOf(list), known = knownCount(list);
  var pct = all.length ? Math.round(100 * known / all.length) : 0;
  var head = saying || 'All done for today';
  var count = all.length ? known + ' of ' + all.length + (all.length === 1 ? ' word' : ' words')
                           + ' known well'
                         : 'No words yet. Ask a grown-up to add some.';
  header();
  announce(head + ' ' + count);
  el('#screen').innerHTML =
      '<h2 class="headline' + (saying ? ' cheer' : '') + '">' + esc(head) + '</h2>'
    + '<div class="tick" aria-hidden="true">✓</div>'
    + '<div class="note">' + esc(count) + '</div>'
    + (all.length
        ? '<div class="pbar" role="img" aria-label="' + pct + ' per cent of this list known well">'
          + '<i style="width:' + pct + '%"></i></div>'
        : '');
  el('#act').innerHTML = all.length
    ? '<button class="quiet" id="again">Practise a bit more</button>' : '';
}

function renderParent(){
  el('#act').innerHTML = '';
  var list = activeList(), all = wordsOf(list), net = networkData();
  var voices = offerVoices(), chosen = pickVoice();
  var tricky = Object.keys(S.words.mastery)
    .filter(function(w){ return mastery(w).wrong > 0 && (mastery(w).box || 1) < KNOWN_BOX; })
    .sort(function(a,b){ return mastery(b).wrong - mastery(a).wrong; }).slice(0, 12);
  var scales = [['Smaller',.9],['Normal',1],['Large',1.15],['Larger',1.3],['Largest',1.5]];
  var tints  = [['cream','#FBF6EC'],['peach','#FBF0E8'],['mint','#EDF6F0'],['blue','#EDF2F8'],['grey','#F2F1EE']];

  el('#bar').innerHTML = '<button class="back" data-go="day" aria-label="Back">← Back</button>'
    + '<span class="sp"></span><span class="wordmark crumb">Grown-ups</span>';

  el('#screen').innerHTML =
      // A device that will not store anything loses every session silently. Her
      // screens stay quiet about it — it is nothing she can act on — but a
      // grown-up looking for why progress vanished should find it here.
      (_saveFailed
        ? '<div class="sect"><h2>Something to know</h2><div class="hint danger" id="nosave">'
          + 'This device isn’t saving her progress — it may be out of space, or in a private '
          + 'browsing window. Practice still works, but today won’t be remembered.</div></div>'
        : '')
    + renderNetwork(net)
      // The same three numbers the picture above states, from the same count.
      // They used to be worked out separately and to different scopes — one
      // list here, everything there — so the screen gave two answers to
      // "how many does she know well?".
    + '<div class="sect"><h2>Progress</h2><div class="stats">'
    +   '<div class="stat"><b>' + (net ? net.known : 0) + '</b><span>known well</span></div>'
    +   '<div class="stat"><b>' + (net ? net.met : 0) + '</b><span>words met</span></div>'
    +   '<div class="stat"><b>' + S.words.sessions.length + '</b><span>sessions</span></div>'
    + '</div>'
    + '<div class="hint">' + esc(paceLabel()) + '. The pace follows her over her last five '
    + 'sessions: above 85% right first time she gets a nine-word sitting and up to three new '
    + 'words, in the middle eight words and one new, under 70% six words and nothing new — so a '
    + 'hard week slows the intake instead of piling up. New words never take more than a third '
    + 'of a sitting; the rest is words she can already spell.</div></div>'

    + (tricky.length
      ? '<div class="sect"><h2>Still tricky</h2><div class="chips">'
        + tricky.map(function(w){ return '<button class="chip" data-hear="' + esc(w)
              + '" aria-label="Hear ' + esc(w) + '">' + esc(w) + '</button>'; }).join('')
        + '</div><div class="hint">Tap one to hear it. These come back most often.</div></div>'
      : '')

    + '<div class="sect"><h2>Which list</h2><div class="seg">'
    +   allLists().map(function(l){
          return '<button data-list="' + esc(l.id) + '" aria-pressed="' + (l.id === list.id) + '">'
               + esc(l.name) + ' <span style="opacity:.6">' + wordsOf(l).length + '</span></button>'; }).join('')
    + '</div><div class="hint">Lists are ordered easiest first. She works through one list at a time.</div></div>'

    + '<div class="sect"><h2>Her own list</h2>'
    +   '<div class="field"><label for="paste">Paste this week’s words</label>'
    +     '<textarea id="paste" placeholder="said, they, went…" autocapitalize="off" spellcheck="false"></textarea></div>'
    +   '<div class="field"><label for="pname2">List name</label>'
    +     '<input type="text" id="pname2" placeholder="Week 4" autocomplete="off"></div>'
    +   '<button class="quiet" id="pasteSave">Save this list</button>'
    +   '<div class="hint">Commas, spaces or one per line — numbering and bullets are ignored. '
    +   'A long list is dripped a couple of words at a time, never dumped on her at once.</div>'
    +   (S.words.lists.length
        ? '<div class="field" style="margin-top:1rem"><div class="lbl" id="l-saved">Saved lists</div>'
          + '<div class="seg" role="group" aria-labelledby="l-saved">'
          + S.words.lists.map(function(l){
              return '<button class="danger" data-del="' + esc(l.id) + '">Delete “' + esc(l.name) + '”</button>'; }).join('')
          + '</div></div>'
        : '')
    + '</div>'

    + '<div class="sect"><h2>Her name</h2>'
    +   '<div class="field"><label for="pname">First name</label>'
