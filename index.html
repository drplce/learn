    var last = groups[groups.length-1];
    if(last[0] === last[1] && last[0] === s.length-1) groups.pop();
  }
  if(groups.length < 2) return [s];

  var cuts = [];
  for(k = 0; k < groups.length - 1; k++){
    var av = groups[k][1], bv = groups[k+1][0], L = bv - av - 1;
    if(L === 1 && s[av+1] === 'x'){ cuts.push(av + 2); continue; }    // ex·am, tax·i
    if(L <= 1){ cuts.push(av + 1); continue; }                        // li·on / wa·ter
    var pr = s.slice(av+1, av+3);        // the two after the vowel
    var onset2 = s.slice(bv - 2, bv);    // the two before the next one
    var nx = s.slice(av+2, av+4);
    var cut;
    if(ONSET_DIGRAPHS.indexOf(pr) >= 0)          cut = av + 1;   // mo·ther
    else if(onset2 === 'gu' || onset2 === 'qu')   cut = bv - 2;   // lan·guage, ban·quet
    else if(CODA_DIGRAPHS.indexOf(pr) >= 0)      cut = av + 3;   // neigh·bour
    else if(ONSET_BLENDS.indexOf(onset2) >= 0)   cut = bv - 2;   // ta·ble
    else if(L >= 3 && DIGRAPHS.indexOf(nx) >= 0) cut = av + 2;   // an·them
    else                                         cut = av + 2;   // hap·pen
    // Whichever of those chose it, a cut in a three-consonant cluster can leave a
    // chunk nobody can say: for·tnight, par·tner, frien·dly, a·thlete. Move it
    // along until what opens the next chunk is a real onset. The consonant-le
    // syllable is the exception — bot·tle and cas·tle are how it is taught, and
    // "tle" is only ever the end of a word.
    while(cut < bv - 1 && !sayableOnset(s.slice(cut, bv)) && !/^[^aeiouy]+le$/.test(s.slice(cut))) cut++;
    cuts.push(cut);
  }

  var out = [], from = 0;
  cuts.forEach(function(c){ if(c > from && c < s.length){ out.push(s.slice(from, c)); from = c; } });
  out.push(s.slice(from));
  out = out.filter(Boolean);
  /* No chunk may end on an apostrophe. The vowel rule knows nothing about one, so it put
     the boundary straight after it and left "they're" as they' + re — two chips, both
     tappable, both of which speak, and neither of which is a piece of the word. Same for
     you're, we're and o'clock. An apostrophe belongs to whatever follows it, so a chunk
     that would end on one is joined to the next.

     This was always here; contractions have been paste-able since the beginning. What
     changed is that the cues now cover they're and you're, so it is no longer a word she
     would have to be unlucky to meet. haven't, children's and everybody's split correctly
     already and are untouched — their apostrophes fall inside a chunk, not at its edge. */
  for(var q = 0; q < out.length - 1; ){
    if(out[q].slice(-1) === "'"){ out[q] += out[q + 1]; out.splice(q + 1, 1); }
    else q++;
  }
  return out;
}
function splitOf(word){
  var list = activeList();
  var hand = list && list.words && !Array.isArray(list.words) ? list.words[word] : null;
  return hand ? String(hand).toLowerCase().split('·') : syllables(word);
}

/* =========================================================
   6. Spaced repetition and the self-adapting pace.

   Boxes 1..7 in elapsed days, roughly doubling — where both the
   spacing research and FSRS's fitted intervals land. Boxes 6 and 7
   exist so a word she knows well stops coming back every week
   forever. Box 5 is "known well": four correct retrievals on four
   different days, which is where the benefit levels off.
   ========================================================= */
var BOX_DAYS = {1:0, 2:1, 3:2, 4:4, 5:8, 6:21, 7:60};
var MAX_BOX = 7, KNOWN_BOX = 5;

function mastery(word){
  return S.words.mastery[word] || {right:0, wrong:0, box:1, lastSeen:null};
}
function acquiring(w){ return (mastery(w).box || 1) <= 1; }
function isDue(word, today){
  var m = mastery(word);
  if(!m.lastSeen) return true;
  var gap = dayDiff(today, m.lastSeen);
  // A last-seen date in the future means the clock moved, not that she is ahead
  // of schedule. Left alone the word would never come due again.
  if(gap < 0) return true;
  return gap >= BOX_DAYS[m.box || 1];
}
// How far past its interval a word is — the one closest to being forgotten
// comes back first.
function overdueRatio(word, today){
  var m = mastery(word);
  if(!m.lastSeen) return Infinity;
  var gap = dayDiff(today, m.lastSeen);
  if(gap < 0) return 1;                     // clock moved; treat it as due now
  return gap / Math.max(1, BOX_DAYS[m.box || 1] || 1);
}
function recordWord(word, outcome){          // 'first' | 'later' | 'wrong'
  var wasMet = !!S.words.mastery[word];
  var m = Object.assign({right:0, wrong:0, box:1, lastSeen:null}, S.words.mastery[word]);
  var box = m.box || 1, sameDay = m.lastSeen === todayISO();
  if(outcome === 'first'){
    m.right++;
    // One box per calendar day: two goes in an evening shouldn't fast-track a
    // word past intervals measured in days.
    if(!sameDay) m.box = Math.min(MAX_BOX, box + 1);
  }else if(outcome === 'later'){
    m.right++;                               // got there after a miss — no penalty, no advance
  }else{
    m.wrong++;
    // Large but partial: a word known for two months slips to a one-day retry
    // rather than starting again from nothing.
    m.box = box <= 2 ? 1 : Math.max(2, box - 2);
  }
  m.lastSeen = todayISO();
  S.words.mastery[word] = m;
  save();
  /* What changed, so the finished screen can show tonight rather than describe it.
     Nothing recorded this before: the sitting knew how many words she got right and
     not which of them moved, and W is thrown away at the end of it. "First met
     tonight" and "climbed a box tonight" are the two things a picture of her words
     can honestly light up. */
  if(W){
    if(!wasMet && W.fresh.indexOf(word) < 0) W.fresh.push(word);
    if(m.box > box && W.grew.indexOf(word) < 0) W.grew.push(word);
    // A word can climb and later slip in the same sitting; the slip is the truth.
    if(m.box < box){
      var at = W.grew.indexOf(word);
      if(at >= 0) W.grew.splice(at, 1);
      if(W.slipped.indexOf(word) < 0) W.slipped.push(word);
    }
  }
  return m;
}
/* Everything tonight changed, across every sitting she has done today and the one
   she may be in the middle of. */
function tonight(){
  var out = {fresh:[], grew:[], slipped:[]}, t = todayISO();
  function take(src){
    if(!src) return;
    ['fresh', 'grew', 'slipped'].forEach(function(k){
      (src[k] || []).forEach(function(w){ if(out[k].indexOf(w) < 0) out[k].push(w); });
    });
  }
  (S.words.sessions || []).forEach(function(x){ if(x.date === t) take(x); });
  take(W);
  // A word that slipped at any point in the evening is not also growth.
  out.grew = out.grew.filter(function(w){ return out.slipped.indexOf(w) < 0; });
  return out;
}
function knownCount(list){
  return wordsOf(list).filter(function(w){ return (mastery(w).box || 1) >= KNOWN_BOX; }).length;
}
/* Every word on her lists, counted once. Her lists overlap — "said" and "they" are on
   half of them — so this is the honest size of what she is working through. */
function allWords(){
  var out = [], seen = bare(null);
  allLists().forEach(function(l){
    wordsOf(l).forEach(function(w){ if(seen[w]) return; seen[w] = 1; out.push(w); });
  });
  return out;
}
function knownEverywhere(){
  return allWords().filter(function(w){ return (mastery(w).box || 1) >= KNOWN_BOX; }).length;
}

/* Pace. Practice works best around 80-85% success: below that she is being
   overloaded, above it she is coasting. So the number of new words follows her
   accuracy rather than a fixed setting. */
/* The intake ceiling is now a grown-up setting — settings.newMax, which poolCap()
   and newWordsToday() read directly — and ACQUIRING_CAP below is only its default.
   At that default of 3 nothing has moved: poolCap() holds at least newMax and the old
   floor(sessionWords() * NEW_SHARE) term tops out at floor(9/3) = 3, so the two tie
   exactly as they always did and the simulations are byte-for-byte unchanged. A
   grown-up who lifts newMax pushes the pool past NEW_SHARE's third-of-a-sitting guard
   deliberately (RESEARCH §3/§4); one who lowers it slows the intake. See
   tests/pace-levers.spec.js and tests/pace-settings.spec.js. */
var ACQUIRING_CAP = 3;      // the default of settings.newMax — the live ceiling is the setting
var SEED_NEW = 3;           // her very first session
var PACE_WINDOW = 5;        // sessions to judge on
var PACE_MIN_WORDS = 12;    // ...over at least this many words
var PACE_HIGH = .85, PACE_LOW = .70;
/* The one that steers. 1/3 lands her at 86-89% right first time on every list she
   has material ahead of, which is 1-4 points above the 80-85% this is aiming for.
   Measured alternatives, 60 days, 12 learners: at 0.4, easy/tricky are 85.5%/84.6%
   and she learns 57.3/50.9 of 100; at 0.45 they are 85.2%/84.5% and 58.7/51.5, with
   fewer hard days (0.3 against 0.5) and no short sittings at all. Left at 1/3
   because it is her difficulty level and not a number to change on a simulation's
   word — the trade is a worst-day-in-ten of 66.7% against 75.0%. */
var NEW_SHARE = 1/3;        // at most a third of a sitting is new material
var MIN_SESSION = 4;

function recentAccuracy(){
  var ss = (S.words.sessions || []).slice(-PACE_WINDOW);
  var words = ss.reduce(function(n, s){ return n + (s.words || 0); }, 0);
  var first = ss.reduce(function(n, s){ return n + (s.firstTime || 0); }, 0);
  return words >= PACE_MIN_WORDS ? first / words : null;    // null = too early to judge
}
// How many words a sitting is. Doing well earns a slightly longer one; a bad
// run shortens it. Eight is the everyday case — a few minutes, not homework.
function sessionWords(){
  var acc = recentAccuracy();
  if(acc === null) return 7;
  if(acc >= PACE_HIGH) return 9;
  if(acc <  PACE_LOW)  return 6;
  return 8;
}
// The tiers that used to be hard-wired at 3 / 1 / 0 now read the two grown-up levers:
// newMax is the intake on a flying day, newMin on a hard one, and the middle band and
// the too-early case sit at one, but never outside [newMin, newMax]. At the defaults
// (mn=0, mx=3) these yield 3 / 1 / 3 / 1 / 0 — exactly what they were before the levers
// existed, which is what keeps the simulations byte-for-byte unchanged.
function clampN(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function newWordsToday(){
  var mn = S.settings.newMin, mx = S.settings.newMax;
  if(!(S.words.sessions || []).length) return Math.min(SEED_NEW, mx);
  var acc = recentAccuracy();
  if(acc === null)     return clampN(1, mn, mx);   // too early to judge — a gentle one
  if(acc >= PACE_HIGH) return mx;                  // flying — the grown-up's ceiling
  if(acc >= PACE_LOW)  return clampN(1, mn, mx);   // in the sweet spot
  return mn;                                       // struggling — down to the floor
}
// The rest of the sitting is words she can already spell. Keeping new material
// to a third is what holds the success rate where practice actually sticks.
function poolCap(){
  // Her first night is all new by definition, so the share doesn't apply.
  if(!(S.words.sessions || []).length) return SEED_NEW;
  /* The pool holds at least what today actually asks for — newWordsToday(), which the
     grown-up's newMax bounds — so lifting the intake past NEW_SHARE's third-of-a-sitting
     guard actually gets through it. That guard is the default for a reason (RESEARCH §4),
     but the lever is theirs to push (RESEARCH §3).

     The floor is newWordsToday(), not newMax itself: on a flying day the two are equal, but
     in the middle band and on a hard day newWordsToday() is one or nought while newMax is
     still three, so using newMax as the floor would widen the pool from two to three there
     and quietly carry an extra acquiring word every non-flying sitting — which is precisely
     what moved every number in tests/sim.js when it was tried. Bounded by what the day
     asks for, the default (newMax 3) reproduces the old max(1, min(3, floor(9/3))) in every
     band and the simulations are byte-for-byte unchanged; raise newMax and the pool follows,
     lower it and it shrinks. See tests/pace-settings.spec.js. */
  var mx = S.settings.newMax;
  return Math.max(1, Math.min(mx, Math.max(newWordsToday(), Math.floor(sessionWords() * NEW_SHARE))));
}
function paceLabel(){
  var acc = recentAccuracy(), n = newWordsToday();
  return (acc === null ? 'Finding her level' : Math.round(acc * 100) + '% right first time')
       + ' · ' + (n === 0 ? 'no new words yet' : n + (n === 1 ? ' new word' : ' new words') + ' a session');
}

/* Yesterday's words come back before anything new is introduced, most of a
   session is words she can already spell, and it opens with one she is likely
   to get right rather than the hardest thing she owns. */
/* New words come from the list she is on, and then from the ones after it.
   Without that the app quietly stops teaching her. Measured on the sixteen-word
   starter list: she knew every word by day nine, and then practised the same
   nine-word review for a hundred and eleven days at a hundred per cent right first
   time, while the pace controller asked for three new words every single day and
   got none — a hundred and thirteen sittings out of a hundred and twenty. The other
   eighty-four built-in words sat there the whole time, reachable only by a grown-up
   knowing to go into the grown-ups screen and switch lists by hand. Nothing in the
   app said anything was wrong: she practised, she got everything right, and it told
   her so. */
function newPool(list){
  var out = [], seen = bare(null), ls = allLists(), at = 0, i, j;
  for(i = 0; i < ls.length; i++) if(ls[i].id === (list || {}).id){ at = i; break; }
  for(i = at; i < ls.length; i++){
    var ws = wordsOf(ls[i]);
    for(j = 0; j < ws.length; j++){
      if(seen[ws[j]] || S.words.mastery[ws[j]]) continue;
      seen[ws[j]] = 1; out.push(ws[j]);
    }
  }
  return out;
}
/* And review is every word she has met, wherever it now lives. Moving her on and
   then never asking for the old list again would let a whole term's work go quietly
   while the map showed it dimming. */
function metWords(){
  var out = [], seen = bare(null);
  allLists().forEach(function(l){
    wordsOf(l).forEach(function(w){
      if(seen[w] || !S.words.mastery[w]) return;
      seen[w] = 1; out.push(w);
    });
  });
  return out;
}
/* When every word on the list she is on is known well, she moves to the next list
   that still needs work. A grown-up should not have to notice that she has finished
   one, and she should not have to wait for them to. */
function advanceList(){
  var l = activeList();
  if(!l) return;
  var ws = wordsOf(l);
  if(!ws.length || knownCount(l) < ws.length) return;
  var ls = allLists(), at = -1, i;
  for(i = 0; i < ls.length; i++) if(ls[i].id === l.id){ at = i; break; }
  for(i = at + 1; i < ls.length; i++){
    var next = wordsOf(ls[i]);
    if(next.length && knownCount(ls[i]) < next.length){
      S.words.activeId = ls[i].id; save(); return;
    }
  }
}
function buildSession(list, today){
  var all = wordsOf(list), met = metWords();
  function seen(w){ return !!S.words.mastery[w]; }

  var review = met.filter(function(w){ return !acquiring(w) && isDue(w, today); })
                  .sort(function(a,b){ return overdueRatio(b, today) - overdueRatio(a, today); });
  var started = met.filter(function(w){ return acquiring(w); })
                   .sort(function(a,b){ return String(mastery(a).lastSeen).localeCompare(String(mastery(b).lastSeen)); });
  var never = newPool(list);

  var size = sessionWords(), cap = poolCap();
  var acq = started.slice(0, cap);
  var room = Math.min(newWordsToday(), cap - acq.length);
  never.forEach(function(w){ if(room-- > 0) acq.push(w); });

  // The rest of the sitting is review. If not enough is strictly due, pull
  // forward the nearest — better than a screen of nothing but misses.
  var wantRev = Math.max(2, size - acq.length);
  var rev = review.slice(0, wantRev);
  if(rev.length < wantRev){
    met.filter(function(w){ return !acquiring(w) && rev.indexOf(w) < 0; })
       .sort(function(a,b){ return overdueRatio(b, today) - overdueRatio(a, today); })
       .forEach(function(w){ if(rev.length < wantRev) rev.push(w); });
  }
  // A floor, so a bad run cannot freeze the app: one new word beats a
  // thirty-second session she has no reason to come back to. It is best-effort
  // and the cap on words being learned at once always wins — a list where she
  // has one word in hand and a bad week behind her yields a three-word sitting
  // rather than three new words at once, which is the right way round.
  if(acq.length + rev.length < MIN_SESSION){
    never.forEach(function(w){
      if(acq.length + rev.length < MIN_SESSION && acq.length < cap && acq.indexOf(w) < 0) acq.push(w);
    });
  }
  if(!rev.length && !acq.length){
    return all.slice().sort(function(a,b){ return overdueRatio(b, today) - overdueRatio(a, today); })
              .slice(0, size);
  }

  // Thread the acquiring words through the review rather than blocking them at
  // the front, and open with the safest one.
  var total = acq.length + rev.length;
  var out = [];
  if(rev.length) out.push(rev.shift());
  var gap = Math.max(1, Math.ceil((rev.length + 1) / (acq.length + 1)));
  var ri = 0, ai = 0;
  while(ri < rev.length || ai < acq.length){
    for(var k = 0; k < gap && ri < rev.length; k++) out.push(rev[ri++]);
    if(ai < acq.length) out.push(acq[ai++]);
  }
  return out.filter(function(w, i, a){ return a.indexOf(w) === i; })
            .slice(0, Math.min(size, total));
}

/* =========================================================
   7. Comparing her attempt. Longest common subsequence, so one
   dropped letter doesn't mark the whole word wrong.
   ========================================================= */
function matched(attempt, target){
  // Tidied on both sides, so the marking lines up on what she meant to type
  // rather than on which apostrophe her phone chose.
  // The same letters sameWord judged, so the marking lines up with the verdict rather
  // than counting a stray full stop as a letter she added.
  var a = typedLetters(attempt), b = typedLetters(target);
  var n = a.length, m = b.length, dp = [], i, j;
  for(i = 0; i <= n; i++){ dp.push(new Array(m+1).fill(0)); }
  for(i = 1; i <= n; i++)
    for(j = 1; j <= m; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  var hit = {}, count = 0;
  i = n; j = m;
  while(i > 0 && j > 0){
    if(a[i-1] === b[j-1]){ hit[j-1] = true; count++; i--; j--; }
    else if(dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  return {hit:hit, count:count};
}
function sameWord(a, b){
  return typedLetters(a) === typedLetters(b);
}
// One typed character, folded the way a whole answer is, so the trace accepts a curly
// apostrophe, a smart dash or an accented letter as the plain one it stands for, and
// matching is case-insensitive.
function foldKey(c){ return tidyPunct(String(c == null ? '' : c)).toLowerCase(); }

/* =========================================================
   8. A practice session.

   A brand-new word gets look, cover, write, check. Every word she
   has met before goes straight to writing it from memory — showing
   it first would make this a copying exercise, which is what undoes
   the benefit of practising at all.
   ========================================================= */
var W = null;
function stageFor(word){ return acquiring(word) ? 'look' : 'write'; }
// Starting a word: within a session it is only ever shown once. After that —
// whether she missed it or copied it correctly — it is asked from memory.
// Records the showing, so call it once per word as it comes up.
function beginStage(word){
  if(W && (W.failed.indexOf(word) >= 0 || W.shown.indexOf(word) >= 0)) return 'write';
  var st = stageFor(word);
  if(st === 'look' && W) W.shown.push(word);
  return st;
}

function start(){
  advanceList();
  var words = buildSession(activeList(), todayISO());
  if(!words.length) return false;
  W = {words:words, i:0, stage:'write', attempt:'', tries:0,
       // Which list, and which day, this sitting belongs to — so a grown-up who
       // looks in mid-word can be handed back the same sitting, and only the same
       // sitting. See go().
       listId:(activeList() || {}).id, day:todayISO(),
       // plan is the number of words the sitting set out to cover. Requeued
       // words lengthen W.words but not the plan, so progress only ever moves
       // forward — a row of dots that grew would read as losing ground.
       plan:words.length, right:0, firstTime:0,
       // What tonight actually did, for the screen at the end of it.
       fresh:[], grew:[], slipped:[],
       // corr counts how many times each word has been written correctly IN THIS sitting.
       // The lit dome (WIN-3) shows once a word reaches two — "done for the second time
       // tonight" — so it is earned within the sitting, not carried in from long-term mastery.
       requeue:[], failed:[], shown:[], asked:[], done:[], corr:{}, keys:0};
  W.stage = beginStage(words[0]); W.traced = 0;
  screen = 'day';
  render();
  // Speaking never waits on the network: it says the word now, and the rest of
  // the sitting is fetched behind it so nothing after this one waits at all. The
  // word just spoken is left out, or the element and the prefetch would race for
  // the same file and it would be fetched twice.
  say(words[0]);
  // The word just spoken goes last, so the element's own request finishes first
  // and this one comes off the browser's cache instead of racing it — but it is
  // still stored, or a sitting with no signal would start on a missing clip.
  var ahead = sittingPhrases().filter(function(p){ return p !== words[0]; });
  warmClips(ahead.concat([words[0]]));
  return true;
}
function word(){ return W && W.words[W.i]; }
// Enough to be unique between two windows on the same phone finishing at the same moment.
function sessionId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
/* Counted the way a person counts them, not the way the string is stored. An emoji is one
   press of one key and two UTF-16 units, so measuring .length made three smileys look like
   six characters arriving from nowhere and flagged her own typing — and because the check
   for an answer with no letters in it returns before anything clears the flag, that verdict
   then sat there waiting for the next word she wrote properly. Both halves found by the
   adversarial pass, which types emoji at the box on purpose. */
function chars(s){ return s ? [].concat(Array.from(String(s))).length : 0; }

function check(){
  var w = word();
  W.attempt = (el('#type') ? el('#type').value : W.attempt) || '';
  /* An empty box isn't an attempt — a fumbled tap must not cost her a word. Nor is a
     box with no letters in it: typed for real, a single "." next to the space bar was
     recorded as a miss and requeued the word. Same fumble, same answer. */
  if(!/[a-z]/.test(typedLetters(W.attempt))){
    // Cleared here too, or a fumble ends the moment she next writes something properly.
    W.notWritten = false;
    toast('Have a go — type the word.'); return;
  }
  /* The answer has to have been written. She found the microphone key and said the word,
     and the phone spelled it — which is a good thing to have worked out and no use at all
     for learning to spell, because the one thing that makes a spelling stick is pulling it
     out of her own head. Same for a tap on the predictive bar, a glide across the keys and
     a paste: all of them hand her the letters.

     She keeps the word rather than losing it. Nothing is recorded, the box is emptied, the
     word is spoken again and she is asked to have another go — no miss, no requeue, nothing
     to notice on the map, because this is not her getting a word wrong. The delivery is the
     box clearing and the word being read out again, and nothing else: no toast, no telling
     off. She worked out something clever about her phone, and the quiet reset says "have
     another go" without making a moment of it. A grown-up can turn the whole check off,
     both because dictation is a real accommodation in other places and because if this ever
     misfires on her phone it must not be the thing that stops her practising. */
  /* Letters in the box with no keystroke behind any of them, on a device that has been seen
     to report keystrokes. See the keydown handler for why this is trusted only once the
     device has proved it reports them. */
  if(S.settings.sawKeys && !(W.keys > 0) && typedLetters(W.attempt).length > 0)
    W.notWritten = true;
  if(W.notWritten && S.settings.written !== false){
    W.notWritten = false;
    W.attempt = '';
    if(el('#type')) el('#type').value = '';
    say(w);                                  // the word again — the whole of the cue
    /* Being handed the word back should leave her able to write it. On her phone this is
       already so — the button's own pointerdown keeps the box focused, which is the whole
       point of that trick — but a mouse click moves focus to the button, and this branch
       returns before the render that would normally put it back. */
    restoreFocus();
    return;
  }
  W.notWritten = false;
  W.tries++;
  var ok = sameWord(W.attempt, w);
  var firstAsk = W.asked.indexOf(w) < 0;
  if(firstAsk) W.asked.push(w);
  if(ok){
    // Only the first ask of the day can advance the word — a second correct go
    // in the same sitting is a good sign, not a day's worth of progress.
    recordWord(w, firstAsk ? 'first' : 'later');
    W.right++;
    W.corr[w] = (W.corr[w] || 0) + 1;              // a correct go tonight; two of these root the pebble
    if(W.done.indexOf(w) < 0) W.done.push(w);      // finished, however many goes it took
    if(firstAsk){
      W.firstTime++;
      // A word she has just been shown gets one more go later in this same
      // session, from memory. That way its first cold retrieval happens today
      // while it is still fresh, rather than as a hard surprise tomorrow.
      if(W.shown.indexOf(w) >= 0 && W.requeue.indexOf(w) < 0) W.requeue.push(w);
    }
    W.retrace = false;
    chime('right');
  }else{
    /* A miss becomes a re-trace (WIN-1): the word back in its box to copy letter by letter,
       her slip marked, before the sitting moves on. missAttempt holds what she wrote so the
       verdict and the slipped letters can be worked out from it even as the box is re-copied
       over the top; retrace drives the render and survives the resizes that re-run it. */
    W.retrace = true;
    W.missAttempt = W.attempt;
    W.traced = 0;
    if(W.failed.indexOf(w) < 0){
      // Marked down once, then queued to come back later in this same session —
      // a real retrieval a few words on, rather than a copy off the screen.
      W.failed.push(w);
      recordWord(w, 'wrong');
      if(W.requeue.indexOf(w) < 0) W.requeue.push(w);
    }
  }
  W.stage = 'check';
  render();
  if(ok){
    /* A win carries her on by itself, once she has had a moment to read "Yes — that's
       it" and hear the chime. A tap on the verdict or a return skips the wait. next()
       clears this timer at its start, so a tap, a return, or a driver calling next()
       straight after check() — as the sim and the harnesses do — can never advance
       twice, which is what keeps that loop timing-independent. */
    clearAuto();
    W.autoTimer = setTimeout(next, REWARD.hold);   // the beat she rests on the filled pebble (see REWARD)
  }else{
    // A miss holds — no timer. She dwells on the corrected word and moves on when she
    // is ready. The whole word is spoken again — not its pieces (David, 13.33: the
    // syllabifier still split some words wrong, and a wrong break is worse than none in
    // the ear as much as on the screen, so the spoken breakdown is gone with the seams).
    // No force: a miss respects read-aloud-off, the way the spoken parts used to.
    say(w);
  }
}
// Cancel a pending auto-advance (win) or trace-settle timer. Called at the head of
// every path that moves her — next(), go(), finish() — so nothing double-fires.
function clearAuto(){ if(W && W.autoTimer){ clearTimeout(W.autoTimer); W.autoTimer = null; } stopHearCue(); }

/* The hear-again cue (WIN-4): with the speaker button gone, a bare speaker glyph fades in
   below the box if she stalls on the WRITING stage — where she is recalling a hidden word —
   to show that a tap replays it, then fades out the moment she types or taps. ~8s of stillness
   is "stuck"; anything she does resets it. A behaviour timer, not a CSS duration (the fade
   itself is --m-slow), so the count lives here in JS. */
var _hearCue = 0, HEAR_CUE_MS = 8000;
function stopHearCue(){
  if(_hearCue){ clearTimeout(_hearCue); _hearCue = 0; }
  var c = el('.hearcue'); if(c) c.removeAttribute('data-show');
}
function armHearCue(){
  stopHearCue();
  if(!(W && W.stage === 'write' && touchOnly())) return;
  _hearCue = setTimeout(function(){
    _hearCue = 0;
    var c = el('.hearcue'); if(c) c.setAttribute('data-show', '');
  }, HEAR_CUE_MS);
}
function next(){
  clearAuto();
  // Keep just ahead of her: the next word and its pieces, if they are not
  // already on the device.
  if(W){
    var soon = W.words.slice(W.i + 1, W.i + 3);
    if(soon.length) setTimeout(function(){
      warmClips(soon.concat(soon.reduce(function(a, w){ return a.concat(splitOf(w)); }, [])));
    }, 0);
  }
  if(W.i + 1 < W.words.length) W.i++;

      if(el0){
        var base = el0.querySelector('.pb-base');
        if(base){
          var green = getComputedStyle(base).fill;          // the CSS target (deep rim if rooted)
          var grey = pebVar('--line-2') || green;
          base.animate([{fill: grey}, {fill: green}], {duration: REWARD.fill, easing: EASE});
        }
        el0.animate([{transform: 'scale(1.5)'}, {transform: 'scale(' + REWARD.swellPeak + ')', offset: .45},
                     {transform: 'scale(1.5)'}], {duration: REWARD.swell, easing: EASE});
        // A second win roots the pebble: fade its lit dome in rather than snapping it on.
        if((corr[cur] || 0) >= 2 && (prev.corr[cur] || 0) < 2){
          var dome = el0.querySelector('.pb-dome');
          if(dome) dome.animate([{opacity: 0}, {opacity: 1}], {duration: REWARD.fill, easing: EASE});
        }
      }
    }
    // 2) She has moved on — hand the big pebble off: the one she left shrinks, the next grows,
    //    and the incoming word rises gently into focus with it (not a hard pop).
    if(prev.cur != null && prev.cur !== cur){
      var leftEl = byWord.get(prev.cur);
      if(leftEl)
        leftEl.animate([{transform: 'scale(1.5)'}, {transform: 'scale(1)'}],
                       {duration: REWARD.handoff, easing: EASE});
      var newEl = cur != null ? byWord.get(cur) : null;
      if(newEl)
        newEl.animate([{transform: 'scale(1)'}, {transform: 'scale(1.5)'}],
                      {duration: REWARD.handoff, easing: EASE});
      // The word she is about to write (shown on a new word's trace; a covered review word has
      // no visible letters to move, so this simply finds nothing).
      var wordEl = document.querySelector('.tracew, .word');
      if(wordEl)
        wordEl.animate([{opacity: .35, transform: 'translateY(5px)'},
                        {opacity: 1, transform: 'translateY(0)'}],
                       {duration: REWARD.wordIn, easing: EASE});
    }
  }
  _pebPrev = {cur: cur, done: W.done.slice(), corr: Object.assign({}, corr)};
}

function renderWord(){
  var w = word();
  header();

  /* One dot per word the sitting set out to cover. State is by WORD, not by position: "on" for a
     word she has spelled right (it greens on success, not on arrival), "now" (enlarged, and faint
     until she earns it) for the word she is on RIGHT NOW, faint for the rest.
     It used to be by count — done ones were dots 0..done-1 and the current one was dot[done] — but
     a miss (or a from-memory requeue) moves her forward without adding to that count, so the
     enlarged pebble fell behind onto the wrong word. Keying off the current word (and the done set)
     keeps the big pebble on whatever she is actually spelling, and re-visiting an earlier word
     lights its own earlier pebble again, which is exactly what a repeat should look like. */
  var dots = '<div class="dots" aria-hidden="true">';
  for(var k = 0; k < W.plan; k++){
    var dw = W.words[k] || String(k), ds = dotShape(dw);   // ds.y is bbox-centred (see dotShape)
    /* Two paths, base first (the tests and the map read the first path as THE outline): the
       full blob, then a smaller concentric blob offset up and left — the lit dome of the
       two-tone pebble (WIN-3). The dome is the SECOND layer: it completes only once she has
       written the word correctly a SECOND time in this same sitting (David) — the from-memory
       requeue she nails, or a word she gets right twice tonight. So it is earned within the
       sitting (corr >= 2), not carried in from long-term mastery: a word collected once tonight
       is flat accent green, and an unmet dot is the flat faint blob it always was. Same seed,
       so the dome is the same shape, just smaller. */
    var rooted = ((W.corr || {})[dw] || 0) >= 2;
    // Size and fill are independent: `now` (enlarged) marks the word she is ON; `on` (green)
    // marks a word she has spelled right. A word can be both — the one she has just won and not
    // yet moved on from, or a from-memory word she has won once and is now writing again — so it
    // greens WHILE it is still large (the reward, WIN-3), and only shrinks when she moves on and
    // the next pebble grows. syncPebbles() animates that hand-off; here we just set the states.
    var cls = (W.done.indexOf(dw) >= 0 ? 'on' : '') + (dw === w ? ' now' : '') + (rooted ? ' rooted' : '');
    dots += '<i class="' + cls.trim() + '"'
         + ' data-r="' + ds.r.toFixed(2) + '" data-x="' + ds.x.toFixed(2) + '">'
         + '<svg viewBox="0 0 ' + DOT_BOX + ' ' + DOT_BOX + '" aria-hidden="true">'
         + '<path class="pb-base" d="' + cellPath(dw, ds.x, ds.y, ds.r) + '"/>'
         + '<path class="pb-dome" d="' + cellPath(dw, ds.x - ds.r * 0.10, ds.y - ds.r * 0.15, ds.r * 0.65) + '"/>'
         + '</svg></i>';
  }
  dots += '</div>';

  // The syllable split is no longer a row of its own — it is drawn as seams under the word
  // itself (sylWord, on the trace and the check word), so nothing is assembled here.
  // Icon only now — the speaker shape carries it, and its spoken name stays on the
  // aria-label. Dropping the word takes the last read-aloud label off her word screens.
  // The speaker button is gone (WIN-4): nothing in #act on a word, so it collapses. She
  // hears the word when it appears, and a tap anywhere replays it; the fade-in cue below the
  // box teaches that. Kept as an empty string so the three `act =` sites read unchanged.
  var hear = '';
  // The three zones of the anchored word screen: what sits above the word, the
  // word itself (always the centred row), and what sits below it. Dots ride above
  // on every stage; each branch fills in the rest.
  // One skeleton for every stage: dots (a fixed height, top), a reserved caption slot (the
  // meaning cue on write, the verdict on check — a fixed height whether or not it has a line,
  // so it never shoves the dots), the centred word, then everything else below it. Each branch
  // only fills `supraInner` (the caption) and `below`; `above` is assembled once, constant.
  var supraInner = '', wordslot = '', below = '', act;

  var wl = ' style="--wl:' + w.length + '"';

  if(W.stage === 'look'){
    /* A never-met word arrives to be TRACED, not just looked at. She copies it into a
       focused box letter by letter: the letters she has landed are solid, the next one
       is lit, the rest are faint. A key is taken only when it is the next letter of the
       word (folded the way an answer is, so a curly apostrophe still lands); anything
       else is dropped by the keydown handler before it can be drawn — so the trace on
       screen and the box behind it are always exactly the correctly-copied prefix, and
       her error is never put in front of her (§5). Nothing is recorded here: copying is
       not a retrieval. The completed trace is the cover — a short pause, then she writes
       the same word blind, and that write is the real first retrieval (§8). The finger
       drag that used to fight the panel is gone; the keyboard does the tracing now. */
    var t = W.traced || 0;
    announce('Trace this word: ' + w + '. ' + spellOut(w) + '.');
    var traced = sylWord(w, function(c, i){
      var cls = i < t ? 'on' : i === t ? 'now' : 'off';
      return '<span class="' + cls + '">' + esc(c) + '</span>';
    });
    wordslot = '<div class="trace"' + wl + '>'
         // The same pebble-echo box as the writing screen sits behind the trace — the box
         // means "this is where you write", and the trace is a writing moment (she copies
         // the word into it). Same seed 'box' as the write screen, so it is visibly the
         // SAME box carrying over from trace to write. The lit-letter guidance rides on top.
         +   '<svg class="hair" viewBox="' + HAIR_VB + '" preserveAspectRatio="none" aria-hidden="true">'
         +     '<path d="' + boxHairPath('box') + '"/></svg>'
         // role=img with the word spelled out, exactly as the shown word carries it
         // elsewhere: a screen reader gets the spelling, not the letters read as a word,
         // and the per-letter state colours are hidden behind the one label.
         +   '<div class="tracew" role="img" aria-label="' + esc(spellOut(w)) + '">' + traced + '</div>'
         +   '<input class="tracein" id="type" type="text" inputmode="text" autocomplete="off" '
         +     'autocorrect="off" autocapitalize="off" spellcheck="false" '
         +     'value="' + esc(w.slice(0, t)) + '" aria-label="Trace the word">'
         + '</div>';
    // No visible instruction on the trace either now (David: strip "Type it to trace it." —
    // the whole flow is "no other text"). The spoken announcement above still says "Trace this
    // word", so a screen reader keeps the steer; the lit letter shows her where she is. The
    // syllable seams ride under the letters in the box now (sylWord), not in a row below.
    below = '';
    // No cover button any more — the trace completing is the cover.
    act = hear;
  }
  else if(W.stage === 'write'){
    var fresh = W.shown.indexOf(w) < 0 && W.failed.indexOf(w) < 0;
    // A brand-new word keeps "Listen, then write it" — it tells her to hear it before
    // she writes, which she cannot work out for herself. A word she has already met
    // needs no line: the covered word, the focused box and having just heard it say
    // enough, and the same sentence every time read as noise. (§ writing-screen polish.)
    // No visible instruction on the writing screen any more (WIN-4: "no other text"). The
    // spoken cue below still tells her, through the live region, to listen then write.
    var told = '';
    // The cue is the one thing on this screen she cannot work out for herself,
    // so it is announced with the instruction and it is not in fitScreen()'s
    // shed list — on a cramped screen the instruction goes and the cue stays.
    var cue = meaningOf(w);
    // Never the word itself here — announcing it would give the spelling away.
    // The spoken instruction stays even when the on-screen line is dropped: a screen
    // reader still needs telling she is now writing from memory. Only the visible line
    // goes for a just-traced word — she watched herself copy it a second ago.
    var spoken = fresh ? 'Listen, then write it.' : 'Now write it from memory.';
    announce(spoken + (cue ? ' The one that means: ' + cue + '.' : ''));
    // The meaning cue (the one thing on this screen she cannot work out for herself) rides in
    // the reserved caption slot just above the box — present or not, the slot is the same
    // height, so the dots never move. "the one that means" cost 18 characters and pushed the
    // longest to three lines at her largest text; read, "means:" does the same job in five, and
    // the announcement keeps the fuller wording.
    supraInner = cue ? '<p class="cue">means: <b>' + esc(cue) + '</b></p>' : '';
    wordslot = '<div class="spellinwrap">'
         +   '<svg class="hair" viewBox="' + HAIR_VB + '" preserveAspectRatio="none" aria-hidden="true">'
         +     '<path d="' + boxHairPath('box') + '"/></svg>'
         +   '<input class="spellin" id="type" type="text" inputmode="text" autocomplete="off" '
         +   'autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" '
         +   'value="' + esc(W.attempt) + '" aria-label="Type the word">'
         + '</div>';
    // No Check button — she is on touch and the keyboard's return key submits.
    // enterkeyhint="done" labels it, and the Enter handler calls check().
    // Below the box: the hear-again cue — a bare speaker glyph, faded out until the idle timer
    // (armHearCue, set after render) fades it in when she stalls. Writing is the one stage that
    // earns the hint.
    below = '<div class="hearcue" aria-hidden="true">' + SPK + '</div>';
    act = hear;
  }
  else {
    /* She has checked. A win greens the word and carries her on; a miss becomes a re-trace
       (WIN-1) — the word back in its box with her slipped letter in orange, copied letter by
       letter to fix the shape before the sitting moves on. W.retrace (set in check() on a miss)
       tells the two apart and survives the re-renders a resize causes — reading the box's
       half-copied value back would otherwise flip a miss into a "win" mid-copy. The verdict and
       the slip come from missAttempt, what she actually wrote, not the box being re-filled. */
    var att = W.retrace ? (W.missAttempt || '') : W.attempt;
    var ok = !W.retrace && sameWord(W.attempt, w);
    var m = matched(att, w);
    var missing = w.length - m.count;
    // Marking every letter says only "all of this is wrong", which helps nobody
    // — so below half matched, the re-trace marks nothing and she simply copies it whole.
    var close = w.length ? m.count / w.length >= .5 && missing > 0 : false;
    var extra = !ok && missing === 0;
    /* With nothing missing there is nothing for the usual marking to catch: every letter
       of the word was in her answer, so what she has done is add something — "togeather",
       "saidd", "happenned". Naming that used to be the whole of the reply, and it left her
       reading "there's an extra bit in there" over a word with no mark on it anywhere.
       Tested against the shapes a dyslexic nine-year-old actually produces, this was the
       one verdict of six that pointed at nothing, and two of the three cases that reach it
       are doubled letters — about the commonest slip there is.
       The surplus is in her answer and her answer is never put back in front of her, so
       what gets marked is the letter of the word it was added next to: walk the two
       together and the first character of hers that the word does not account for sits
       just after the letter to look at. "happenned" marks the n, "saidd" the last d,
       "togeather" the e that the extra a came after. */
    var extraAt = -1;
    if(extra){
      var ai = 0, wj = 0, at = tidyTyped(String(att || '')).trim().toLowerCase();
      while(ai < at.length && wj < w.length){
        if(at[ai] === w[wj]){ ai++; wj++; continue; }
        break;                                   // hers, unaccounted for, right here
      }
      extraAt = Math.max(0, wj - 1);
    }
    /* The letters she slipped on — marked orange in the re-trace until she copies past them.
       An extra letter points at the letter the surplus was added beside; a close miss marks
       the letters that did not match; a barely-recognisable miss (not close) marks nothing and
       is simply re-copied whole, which is kinder than an orange word. */
    var slip = extra ? [extraAt]
             : close ? w.split('').map(function(c, i){ return i; }).filter(function(i){ return !m.hit[i]; })
             : [];
    /* What she is missing, in order. Computed before the verdict because the message
       depends on what kind of thing it is. */
    var look = w.split('').filter(function(c, i){ return !m.hit[i]; });
    /* Dropping the apostrophe is the commonest slip on a contraction — "dont", "its",
       "theyre" — and the marking would underline the apostrophe and the verdict would
       say "Look at this letter", which points a nine-year-old at a mark that is not a
       letter, and read aloud came out "Look at the letter '." When the only thing
       missing is punctuation, name it: an apostrophe or a hyphen is a thing she is
       taught, and the marked word still shows her where it goes. */
    var isLetter = function(c){ return /[a-z]/i.test(c); };
    var onlyMarks = look.length > 0 && look.every(function(c){ return !isLetter(c); });
    var markPhrase = (look.indexOf("'") >= 0 && look.indexOf('-') >= 0) ? 'an apostrophe and a hyphen'
                   : look.indexOf("'") >= 0 ? 'an apostrophe'
                   : look.indexOf('-') >= 0 ? 'a hyphen'
                   : 'a little mark';
    var verdict = ok ? (W.failed.indexOf(w) >= 0 ? 'You got there.' : 'Yes — that’s it.')
                : extra ? 'So close — there’s an extra bit here.'
                : close ? (onlyMarks ? 'So close — it needs ' + markPhrase + '.'
                           : missing === 1 ? 'So close. Look at this letter.'
                                           : 'So close. Look at these letters.')
                        : 'Here it is. Have a good look.';
    /* "Look at this letter" points at something a screen reader cannot see: the
       marked-up word reads out as "s a i d" with no hint which letter is the one,
       because <u> against <b> carries no meaning to read. So the announcement
       names them instead of pointing. Same information, each in the medium that
       can carry it. The apostrophe case already names what is missing, so it reads
       aloud as it stands rather than listing "the letter '". */
    var said_ = !close || onlyMarks ? verdict
              : 'So close. Look at the letter' + (look.length > 1 ? 's ' : ' ')
                + listOf(look.filter(isLetter)) + '.';
    // Spelt out letter by letter: a screen reader would otherwise read the word
    // as a word and never convey the spelling, which is the whole point here.
    announce(said_ + ' ' + w + '. ' + spellOut(w) + '.');
    /* The every-time "Yes — that's it." is gone (WIN-5): on a plain win the word itself
       greens and breathes, and a caption saying what the colour already says only added
       noise. Two lines survive because they carry something the green cannot: the EARNED
       "You got there." after she fought back from a miss, and every miss's own steer. The
       spoken announcement is untouched — it still says the verdict, so nothing is lost to
       the ear. */
    var earned = ok && W.failed.indexOf(w) >= 0;
    if(W.retrace){
      /* A miss re-traces (WIN-1). The word is back in its box, copied letter by letter (the same
         mechanic as the first trace — landed letters solid, the next lit, the rest faint), with
         the letters she slipped on shown orange until she reaches and re-copies them. Only the
         correct spelling is ever on the screen; her own misspelling is never put back in front of
         her. No visible caption (David: "ditch the re-trace caption" — the orange letter and the
         word reappearing in its box are the whole signal, and the spoken word-in-parts still
         plays); the spoken verdict stays on the live region (announce, above) untouched. No note
         and no chevron — copying the word to its end is what carries her on (the keydown handler
         advances when the re-trace completes), and the word is already recorded and requeued. */
      supraInner = '';
      var t = W.traced || 0;
      var traced = sylWord(w, function(c, i){
        // Copied letters go solid; a letter she slipped on stays orange until she copies past it
        // (the slip colour wins even at the letter she is on, so the one that matters is never
        // hidden behind the green "type this" cue — it is the leftmost uncopied letter anyway);
        // the next non-slip letter is the lit green one; the rest are faint.
        var cls = i < t ? 'on'
                : slip.indexOf(i) >= 0 ? 'slip'
                : i === t ? 'now'
                : 'off';
        return '<span class="' + cls + '">' + esc(c) + '</span>';
      });
      wordslot = '<div class="trace"' + wl + '>'
           +   '<svg class="hair" viewBox="' + HAIR_VB + '" preserveAspectRatio="none" aria-hidden="true">'
           +     '<path d="' + boxHairPath('box') + '"/></svg>'
           +   '<div class="tracew" role="img" aria-label="' + esc(spellOut(w)) + '">' + traced + '</div>'
           +   '<input class="tracein" id="type" type="text" inputmode="text" autocomplete="off" '
           +     'autocorrect="off" autocapitalize="off" spellcheck="false" '
           +     'value="' + esc(w.slice(0, t)) + '" aria-label="Copy the word again">'
           + '</div>';
      below = '';
      act = hear;
    }else{
      /* A win: the word IS the reward (greens + breathes, WIN-5) and the tap-to-skip-the-wait
         target (id="advance"). The earned "You got there." after a fought-back miss rides in the
         caption slot; a plain win has no line — the green word is the whole of it. */
      supraInner = earned ? '<div class="verdict ok">' + verdict + '</div>' : '';
      wordslot = wordBlock('word won', sylWord(w, function(c){ return esc(c); }), w, wl, 'advance');
      below = '';
      act = hear;
    }
  }

  // The dots and the reserved caption slot, assembled once: constant structure on every stage,
  // so the dots hold one position and the word stays centred whatever the caption is doing.
  var above = dots + '<div class="supra">' + supraInner + '</div>';
  el('#screen').innerHTML = '<div class="wordscreen"' + wl + '>'
    + '<div class="above">' + above + '</div>'
    + '<div class="wordslot">' + wordslot + '</div>'
    + '<div class="below">' + below + '</div>'
    + '</div>';
  el('#act').innerHTML = act;
  // Start (or clear) the idle countdown for the hear-again cue for whatever stage this is.
  armHearCue();
}

/* Counted across all her words, not the list she happens to be on. It used to be the
   open list, which was fine while she never left one — and then 9.1 started moving her
   on when she had mastered it, and her bar went from full to empty overnight: "16 of 16
   words known well" one evening and "0 of 16" the next, with sixteen words of work
   apparently gone. The number she is shown has to be one that cannot go backwards. */
function renderDone(){
  /* No totals are worked out here any more. all/known/pct went with the count: pct had been
     dead since the progress bar came off this screen in 9.7 and nothing noticed, because it
     was still being computed from two live functions and so read like working code. The
     numbers this screen shows are the ones renderNetwork puts on the picture. */
  /* Whether she has anything to practise is a different question from how many words
     exist: the built-in lists are always there, so the count is never zero, but a
     grown-up who has left her on an empty list has given her a dead end and should be
     told. She can practise if the list she is on has words, or there are words ahead
     of it, or there is something of hers to come back to. */
  var canPractise = wordsOf(activeList()).length || newPool(activeList()).length
                    || metWords().length;
  var head = saying || 'All done for today';
  /* Only the dead end left. This was a ternary whose other branch built "N of M words known
     well" for the announcement, and with that gone the branch had nothing left to reach —
     computed on every finished screen, used on none of them, and carrying the only
     singular-plural rule in this function along with it. Exactly the shape the shed list
     was in for four versions: correct code describing a screen that no longer exists.
     The numbers themselves are not gone. They are on the picture, in its own label, which
     is where a screen reader now finds them. */
  var deadEnd = 'No words yet. Ask a grown-up to add some.';
  /* Her words, at the end of the sitting that changed them. A tick says only that
     she stopped; the picture says what tonight did, and it is the same drawing a
     grown-up sees, so it means the same thing in both places. The screen is three
     fixed rows — the line at the top, the picture in a window that is the same size
     whatever she knows, and the praise at the bottom when she has earned it — so nothing
     moves as her map grows over the months. (That last row was described here as the
     count for four versions after the count came off the screen.) */
  /* Met tonight and climbed tonight are the same event for a brand-new word — it is
     recorded in both lists — so counting them separately told her "10 more took root"
     when five shapes had changed. What she is being told is how many words moved, and
     a word moves once. */
  /* A word she met tonight and never once got right has not taken root. tonight()
     records meeting it, which is true and is why a new shape appears on her map —
     but the line above the map is a claim about learning, and it was making that
     claim on the strength of having been shown the word. Driven for real: a sitting
     where every answer was wrong still said "Three took root tonight." The evening
     she struggled is the worst possible evening to be told something she knows is
     not so. A fresh word has no history, so its right count is tonight's: one
     correct answer, at any point today, is the whole test. The shape still appears;
     it just does not flourish or count until she has actually got it, which puts
     the flourish on the evening that earned it. */
  var t = tonight(), got = t.fresh.filter(function(w){ return mastery(w).right > 0; });
  var grew = got.concat(t.grew.filter(function(w){ return got.indexOf(w) < 0; }));
  var net = canPractise ? networkData() : null;
  /* A grown-up who has left her on an empty list has given her a dead end, and that
     is the one thing this screen has to say instead of anything else — stripping the
     totals off it took that message with them the first time. */
  var line = !canPractise ? deadEnd
    /* "Three more took root tonight" was two lines at her ordinary text size and three
       at the largest, on a 375px phone — a headline taller than the picture it is
       introducing. "More" was doing no work either: the picture already shows what she
       had before tonight. Measured, the shorter line is one line at the default size on
       both phones and never more than two anywhere. */
    : grew.length ? said(grew.length) + ' took root tonight.'
    : head;
  // Computed once and used for both the announcement and the markup, so the two
  // cannot say different things.
  var cheer = (saying && line !== head) ? head : '';
  header();
  /* What is on the screen, in the order it is on the screen — and nothing else.

     The running total used to be appended here, on the reasoning that a screen reader
     should still hear where she is up to. Read back, that came out as "Three took root
     tonight. Every one, first go, Ivy. 0 of 100 words known well." — a perfect evening,
     and then a nought. The bar and the total were taken off this screen in 9.7 precisely
     because they read as a target she has not reached rather than as work she has done,
     and appending the same number to the announcement handed it to the one child who
     cannot see that it was removed. Reserving the totals for a grown-up has to mean the
     same thing by ear as it does by eye; a grown-up who wants them has a screen of their
     own, and it reads them out properly.

     The dead end keeps its count, because there the count is the whole message — "No
     words yet. Ask a grown-up to add some." is already the line. */
  announce([line, cheer].filter(Boolean).join(' '));
  /* The picture does the talking. What was here — a heading, the picture, tonight's
     line, a running total and a progress bar — was five things saying versions of the
     same thing, and the bar in particular reads as a target she has not reached rather
     than as work she has done. So: what tonight did, at the top, her words underneath
     it, and the praise beneath them when she has earned it. The totals belong to a
     grown-up and are on the grown-ups screen; a screen reader still hears where she is
     up to, because that is announced. */
  el('#screen').innerHTML =
      '<h2 class="headline">' + esc(line) + '</h2>'
    + (net ? '<div class="donenet">' + renderNetwork(net, true) + '</div>'
           : '<div class="tick" aria-hidden="true">✓</div>')

/* A backup nobody can put back is not a backup. This is the only way in, and it
   goes through load() so a hand-edited or truncated file meets exactly the same
   hardening as anything already in storage. Nothing is written until the text has
   been read and found to be hers, and the old state is put back if it is not. */
/* A backup that has been through an email cannot be put back — and an email to yourself
   is what the button next to this one tells a grown-up to do with it, so this is the only
   route by which a year of her work comes home after a lost phone. Driven for real, out
   of the app's own Copy button and back in as a paste, five of the eleven things a mail
   client routinely does to plain text made the restore refuse it outright: a quoted reply
   puts "> " on every line, a phone appends a signature after the closing brace, smart
   quotes turn " into a curly pair, a copy through a web page hands over non-breaking
   spaces, and the same copy can carry zero-width characters. Not one of them changes a
   character of her data — they are all packaging. So the packaging comes off, and the
   shape check further down is still the only thing that decides whether what is inside is
   hers.

   The two halves of that are deliberately separate, because they carry different risks.
   This one takes out characters that cannot belong in a backup at all, and it runs on
   every text whether it parses or not. A soft hyphen is legal inside a JSON string, so a
   backup that Word has hyphenated parses perfectly well — into an object whose keys are
   "na-me" and "ma-stery" with an invisible character in the middle of each. That passes
   the shape check on the strength of the one key that happened to survive intact, restores
   an empty mastery and a list she is not on, and says "Restored" while a year of her work
   goes quietly missing. A refusal would have been much better than that; scrubbing is
   better than either. */

    // Invisibles a copy through a web page picks up, and Word's soft hyphen.
    .replace(/[​-‍⁠﻿­]/g, '')
    // Every space a mail client substitutes, back to the one JSON knows.
    .replace(/[  -   　]/g, ' ')
    .replace(/\r\n?/g, '\n');

/* And the structural repairs, which only ever run on text that would not parse at all —

function unwrapBackup(t){

     that a "Hi Mum!" above and a "Sent from my phone" below are not counted as unquoted
     lines by the test below and do not stop the reply prefixes coming off with them. Each
     of those two arrived on its own and was handled; all of them together was not, which
     is the arrangement a real forwarded email actually turns up in.

     Not done when a bracket comes first: the outermost thing is then an array, and slicing
     to the braces would be unwrapping her data rather than its packaging. */
  var a = t.indexOf('{'), b = t.lastIndexOf('}'), sq = t.indexOf('[');
  if(a >= 0 && b > a && !(sq >= 0 && sq < a)) t = t.slice(a, b + 1);
  /* A quoted reply prefixes every line. Only taken off when it is on essentially every
     line with anything on it — one stray ">" is a character, not a wrapper. A backup
     cannot contain one anyway: every line of it starts with a brace, a bracket, a quote
     or a space, and a saved word has had everything that is not a letter taken out. */
  var lines = t.split('\n');
  var body = lines.filter(function(l){ return l.trim(); });
  var quoted = body.filter(function(l){ return /^\s*>+\s?/.test(l); }).length;
  if(body.length && quoted >= body.length - 1)
    t = lines.map(function(l){ return l.replace(/^\s*>+\s?/, ''); }).join('\n');

     for the plain quote JSON needs — the curly single quote is left alone, because it is
     the apostrophe in "don't" and folding it here would be folding her data. */
  return t.replace(/[“”„‟]/g, '"');
