   be read at all. */
function parseBackup(text){
  var t = scrubBackup(text);
  try{ return JSON.parse(t); }catch(e){}
  try{ return JSON.parse(unwrapBackup(t)); }catch(e){}
  return null;
}
function looksLikeBackup(text){
  var o = parseBackup(text);
  if(!o || typeof o !== 'object' || Array.isArray(o)) return null;
  var w = o.words;
  if(!w || typeof w !== 'object') return null;
  if(!Array.isArray(w.lists) && !w.mastery && !Array.isArray(w.sessions)) return null;
  return o;
}
function restore(btn){
  var box = el('#restore'), text = box ? box.value.trim() : '';
  if(!text){ toast('Paste the backup text in the box first.'); return; }
  var o = looksLikeBackup(text);
  if(!o){ toast('That does not look like a backup from this app.'); return; }

  var words = Object.keys((o.words && o.words.mastery) || {}).length;
  var lists = ((o.words && o.words.lists) || []).length;
  var sits  = ((o.words && o.words.sessions) || []).length;
  var summary = words + (words === 1 ? ' word' : ' words') + ', '
              + lists + (lists === 1 ? ' saved list' : ' saved lists') + ', '
              + sits + (sits === 1 ? ' sitting' : ' sittings');

  if(!btn.dataset.armed){
    btn.dataset.armed = '1';
    btn.classList.add('danger');           // it is about to replace everything
    btn.textContent = 'Tap again to replace everything with: ' + summary;
    setTimeout(function(){ if(btn.isConnected){ delete btn.dataset.armed; render(); } }, 6000);
    return;
  }

  var before = null;
  try{ before = localStorage.getItem(KEY); }catch(e){}
  try{
    localStorage.setItem(KEY, JSON.stringify(o));
    load();
    // load() falls back to a blank slate on anything it cannot use, which would
    // be a silent wipe. Check it took, and undo if it did not.
    if(!S || !S.words || typeof S.words.mastery !== 'object') throw new Error('did not take');
    save();
    go('day');
    if(!start()) render();
    toast('Restored: ' + summary);
  }catch(e){
    try{ if(before !== null) localStorage.setItem(KEY, before); }catch(e2){}
    load(); render();
    toast('That backup could not be restored. Nothing was changed.');
  }
}

/* =========================================================
   The shape of what she knows. Every word she has met is here, and a few days of
   what is coming next as faint outlines waiting to be filled — a word that slips
   back dims rather than vanishing. It grows outward from the middle in the order
   she meets the words, so the oldest are at the heart of it and the newest at the
   rim, and a hairline joins words that share a spelling chunk, because that is the
   structure she is actually learning: "or" is what morning, sorted and report have
   in common.
   The layout is deterministic. It has to be the same shape every time or it is
   decoration rather than her map.
   ========================================================= */
var NET_W = 320;
// How much bigger the sketch line round an unmet word is than the word itself.
var SKETCH_R = 1.07;
/* Room per word, in the layout's own units: the area each word is allowed to sit
   in, and so the one number that says how tightly the colony packs. The size of
   the whole thing falls out of it — a word takes up the same room whether she has
   sixteen of them or a hundred — which is why it is stated as room and not as a
   radius. At this value neighbouring words touch, which is what the icon taught us:
   a colony of separated cells does not read as one thing, and the picture the owner
   kept calling separate bushes was one where the words covered eight per cent of the
   paper.
   Measured, as the share of the frame the cells cover, before and after: 6.1 -> 23.5
   with nothing met, 14.8 -> 19.8 at eight words, 9.5 -> 23.4 at twenty-eight cells
   drawn, 11.7 -> 29.8 at thirty words, 7.8 -> 30.1 at seventy-four cells, 8.4 -> 37.9
   with everything met. Tighter than this and the disc at the end goes solid; looser
   and the middle states come apart again. */
var NET_ROOM = 160;
/* The share of its own wedge a family actually uses. The rest is a seam, so two
   families that sit side by side are not one continuous mass — but a thin one,
   because the picture is meant to read as a single organism first and a set of
   seven patterns second. */
var NET_SEAM = 0.94;
/* The picture is always the same box on the page — see renderNetwork. That means
   the frame it crops has to be the same shape every time, and this is that shape.
   Square, because what is drawn is a disc once she is a way in and a rounded clump
   before that, so a square wastes the least paper on padding. The frame is fitted
   to the drawing and then let out to this ratio; it never crops to reach it. */
var NET_ASPECT = 1;

/* How far ahead the outlines reach. Every word she has met stays on the map for
   good, but an unmet one is only worth drawing while it is nearly here: a hundred
   empty outlines from the first day said more about how much there is to get
   through than about her.
   So it is a few days of new words at the pace she is actually on —
   newWordsToday() is 0 to 3, and 3 on her very first sitting — taken from the
   open list in the order buildSession() will introduce them. The floor is the
   most she can be learning at once, so a hard week (which earns no new words at
   all) still leaves something waiting rather than a bare shape; the ceiling keeps
   a good run from ghosting half the list again. */
/* Not the pace she is on, though: following it made the picture go backwards.
   newWordsToday() answers 3 before her first sitting and 1 after it, so her very
   first evening of practice took the shape from twelve outlines down to four —
   she does some work and her map gets smaller. */
/* And not a fixed dozen either, which is what it was: twelve empty outlines on
   her first evening is a picture that starts big and blank and spends a term
   filling up. It starts at two sittings' worth of new words — six, the three she
   meets tonight and the three behind them — and widens by one for every five
   words she has met. So the first evening is a handful of shapes she is about to
   fill, and by the time a hundred are behind her the map looks that much further
   ahead as well.
   Words met, and not words known well or the pace she is on, because it is the
   only one of those that cannot go down. A horizon that retracted after a bad
   week would be taking shapes off her map for having a bad week. The ceiling is
   there so a good run does not end up ghosting a whole list she has not
   started. */
var GHOST_MIN = 6, GHOST_MAX = 14, GHOST_PER_MET = 5;
/* How far the horizon may reach into a family that is neither the one she is on nor
   one she has begun: the first few words of it and no more. Enough to say something
   is coming, not enough to be a promise about a list nobody has opened — the
   hundred-empty-outlines mistake in miniature. It also keeps the picture honest
   about its own size: the camera has to hold room for everything drawn, and a
   handful of outlines in a family she has not touched would otherwise make it
   reserve that whole family's room and leave the drawing sitting in a third of the
   frame. Measured: reserving whole families for four outlines took the ink at
   twenty-four words met down to 13.2%.
   Four and not fewer, because a sitting introduces at most three words she has never
   met — see newWordsToday() — and every word she is about to meet has to be on the
   picture already, or an outline fills in that was never there to fill. */
var GHOST_EDGE = 4;
// Every word she has ever met, whatever list it came from and however long ago:
// the one measure of how far she has come that can only ever go up.
function wordsMet(){ return Object.keys(S.words.mastery || {}).length; }
function ghostAhead(){
  return Math.min(GHOST_MAX, GHOST_MIN + Math.floor(wordsMet() / GHOST_PER_MET));
}

/* The unmet words she is about to meet, in the order she will meet them: the front
   of the open list, and then on into the lists behind it.
   It used to stop at the open list, and that was a real hole. The evening she
   finishes a list, the horizon has nothing left to offer and the picture loses its
   outlines altogether — measured at twenty-four words met with the open list
   complete: twenty-seven cells drawn and not one outline, however wide the horizon
   was. Nothing coming, ever again, until a grown-up changed her list by hand. The
   whole point of the horizon is that there is always something next.
   So it walks on through the lists in the order they are offered, and round to the
   beginning if it started part-way down, which only matters on the last list. The
   one state where it comes back empty is the right one: everything met, nothing
   left to come, and the caption then says nothing about outlines. */
function ghostWords(){
  var want = ghostAhead(), out = bare(null), n = 0, all = allLists();
  var here = (activeList() || {}).id, from = 0;
  all.forEach(function(l, i){ if(l.id === here) from = i; });
  // The same walk newPool() takes, and deliberately so: the outlines are then the
  // words the engine really will hand her next, in the order it will hand them over,
  // rather than a second guess at it. Forward only, like newPool and like
  // advanceList — she is never sent back to a list she has finished.
  for(var i = from; i < all.length && n < want; i++){
    var l = all[i], ws = wordsOf(l);
    // The list she is on, and any she has begun, can be shown to the end of the
    // horizon. A family she has not touched shows its first few and then the walk
    // stops: looking one fence over says what is coming, looking over three says
    // nothing except how much is left.
    var mine = l.id === here || ws.some(function(w){ return !!S.words.mastery[w]; });
    var cap = mine ? want : GHOST_EDGE, took = 0;
    ws.forEach(function(w){
      if(S.words.mastery[w] || out[w] || n >= want || took >= cap) return;
      out[w] = true; n++; took++;
    });
    if(!mine && took) break;
  }
  return out;
}

// A small deterministic generator, so the jitter that keeps this from looking
// mechanical is the same jitter every time.
function seeded(str){
  var h = 2166136261;
  for(var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return function(){
    h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13;
    return ((h >>> 0) % 100000) / 100000;
  };
}

/* Each word gets its own shape, seeded by the word itself, so no two are the same
   and none of them is a circle. Bigger for a longer word, but only a little —
   enough to give the colony texture, not enough to read as a ranking. */
function cellPoints(w, x, y, r){
  var rnd = seeded('shape' + w), n = 7, pts = [];
  for(var i = 0; i < n; i++){
    var a = (i / n) * Math.PI * 2 + (rnd() - .5) * 0.35;
    var rr = r * (0.8 + rnd() * 0.4);
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  return pts;
}
/* How far an outline actually reaches, so the frame can be fitted to the shapes
   themselves rather than to circles drawn around them — the difference is the
   width of a cell, which is the difference between the colony filling the picture
   and sitting inside a margin of nothing. Each piece of the outline is a
   quadratic, so its extreme is either one of its ends or its one turning point. */
function cellBounds(w, x, y, r){ return blobBounds(cellPoints(w, x, y, r)); }
function blobBounds(pts){
  var n = pts.length;
  var lo = [Infinity, Infinity], hi = [-Infinity, -Infinity];
  function see(k, v){ if(v < lo[k]) lo[k] = v; if(v > hi[k]) hi[k] = v; }
  for(var j = 0; j < n; j++){
    var p = pts[j], q = pts[(j + 1) % n], nx = pts[(j + 2) % n];
    for(var k = 0; k < 2; k++){
      var A = (p[k] + q[k]) / 2, B = q[k], C = (q[k] + nx[k]) / 2, den = A - 2 * B + C;
      see(k, A); see(k, C);
      if(!den) continue;
      var t = (A - B) / den;
      if(t > 0 && t < 1) see(k, A + 2 * t * (B - A) + t * t * den);
    }
  }
  return {x0:lo[0], y0:lo[1], x1:hi[0], y1:hi[1]};
}
function cellPath(w, x, y, r){ return blobPath(cellPoints(w, x, y, r)); }
/* The write box's edge (WIN-2, Option 4 "pebble-echo"): a hand-drawn hairline that
   undulates with the same character as the pebbles she is collecting — a ring of points
   round the box perimeter, jittered along each edge's normal like a pebble's ring but
   lower-frequency and a touch higher-amplitude, fed through the same cornerless blobPath.
   Drawn once at a reference size and stretched to the real box with a non-scaling stroke,
   so the wobble follows the box but the line stays hairline-thin. Seeded, so it is the
   same edge every render and never crawls. */
var HAIR_W = 320, HAIR_H = 84;
/* The viewBox carries a uniform margin around the box on all four sides, so the jittered
   perimeter points (up to +-amp off each edge) never reach the viewBox boundary. With
   preserveAspectRatio="none" a point sitting on the boundary lands on the element edge,
   where the non-scaling stroke straddles it and renders thin/clipped — which is why the
   right and bottom edges came out lighter than the left. The margin (>= amp + stroke)
   insets every edge equally, so the hairline is one uniform weight all the way round.
   Both the trace box and the writing box draw from this same viewBox, so it fixes both. */
var HAIR_M = 5;
var HAIR_VB = (-HAIR_M) + ' ' + (-HAIR_M) + ' ' + (HAIR_W + 2 * HAIR_M) + ' ' + (HAIR_H + 2 * HAIR_M);
function boxHairPath(seed){
  var rnd = seeded('hair' + seed), amp = 3.4, R = 20, W = HAIR_W, H = HAIR_H, pts = [], i, n = 3;
  function push(x, y, nx, ny){ pts.push([x + nx * (rnd() - .5) * 2 * amp, y + ny * (rnd() - .5) * 2 * amp]); }
  for(i = 0; i < n; i++) push(R + (W - 2 * R) * i / n, 0, 0, -1);      // top, left to right
  push(W - R, 0, 0, -1);
  push(W, R, 1, 0); push(W, H - R, 1, 0);                             // right edge
  for(i = 0; i < n; i++) push(W - R - (W - 2 * R) * i / n, H, 0, 1);  // bottom, right to left
  push(R, H, 0, 1);
  push(0, H - R, -1, 0); push(0, R, -1, 0);                           // left edge
  return blobPath(pts);
}
/* The outline itself: a closed curve through the midpoints of the ring, each
   piece a quadratic bending towards the point between them. Nothing in here has
   a corner, and it works for any number of points — seven for a word, three for
   the mark in her header, which is what keeps the two of a piece. */
function blobPath(pts){
  var n = pts.length, d = '';
  for(var j = 0; j < n; j++){
    var p = pts[j], q = pts[(j + 1) % n];
    var mid = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    if(!j) d = 'M' + mid[0].toFixed(1) + ' ' + mid[1].toFixed(1);
    var nx = pts[(j + 2) % n];
    d += 'Q' + q[0].toFixed(1) + ' ' + q[1].toFixed(1) + ' '
       + ((q[0] + nx[0]) / 2).toFixed(1) + ' ' + ((q[1] + nx[1]) / 2).toFixed(1);
  }
  return d + 'Z';
}

/* Render `w` letter by letter — letterHtml(char, index) draws each one (a plain letter on the
   read word, a lit span on the trace, a marked span on a miss). The word stays one clean run,
   so its innerText reads whole for the harness and the screen-reader spellout. (This used to
   group each syllable's letters in a .sylseg and lay a faint hairline "seam" under each chunk —
   a picture of where the word breaks. Ditched 13.31: the syllabifier was still splitting some
   words wrong, e.g. to·ge·ther for to·geth·er, and a wrong break shown under the word is worse
   than none at all, David. The word now shows as itself, unbroken.) */
function sylWord(w, letterHtml){
  var html = '';
  for(var i = 0; i < w.length; i++) html += letterHtml(w[i], i);
  return html;
}

/* One shared middle, one wedge of the turn for each spelling pattern, and inside a
   wedge the words run outward in the order she will meet them: the first word of a
   list nearest the middle, the last of it furthest out. So the filled-in part of
   the picture grows outward from a dense heart, and the words she has not met yet
   are the rim just beyond it.

   It was the other way up until now. Each family was a frond — its words gathered
   into a head at the tip of a stalk, the last few trailing back down the stem — and
   the fronds radiated from a core. Which meant that with several lists going, the
   words nearest the middle of the picture were the *last* words of each list, and
   the middle itself was the empty space between distant heads. That is what the
   owner kept seeing: separate bushes with string between them. The drawing spanned
   95% of the frame and covered 8% of it.

   Why a phyllotaxis spiral inside the wedge, over the alternatives: it is the only
   arrangement that is even without being regular. Rows and rings read as a diagram
   and leave visible gaps between themselves; a plain random scatter clumps in one
   place and leaves holes in another, which is the look this whole change is trying
   to get rid of. Radius by the square root of the index spaces the words at uniform
   density, so the middle is exactly as full as the rim — that is what stops the rim
   reading as a thin scatter — and stepping the angle across the wedge by the golden
   ratio means no two words she meets in a row land next to each other, and the
   wedge fills evenly however many words end up in it.

   Turning the order round moves the near horizon from the middle of the picture to
   the rim, and the old layout put the last few words of a list on the stem for
   exactly that reason: so that the front of the list — which is what the outlines
   always are — was not drawn on a bare stalk. Two things keep the rim from being a
   thin scatter now. The outlines are consecutive words of one list, so they are a
   run of neighbours in one wedge rather than a sprinkle round the whole edge; and a
   wedge is narrow, so a horizon of six to fourteen words fills it several deep
   instead of stringing out along a circumference. Measured at every stage: the
   biggest group of cells within half a cell of each other holds all but one or two
   of everything drawn, and the median cell overlaps its neighbour. The state that
   really is sparse is the evening before she starts, when six outlines are all there
   is to draw and there is nothing to be dense about.

   Nothing in here moves when she learns a word: a word's place comes from its list,
   its index in that list and the shape of her list of lists, and from nothing else.

   The hairs are gone with the fronds. Five fine threads ran from the core out to
   each head, and their whole job was to make separated clusters read as one body —
   scaffolding for a layout that was falling apart. A dense colony needs no threads
   to hold it together, every one of them reached past the outermost word and so
   pushed the frame out into empty paper, and in a picture that is full in the
   middle they would be hidden under the cells anyway. What is left is the filaments,
   which are not decoration: they say two words share a spelling chunk, which is the
   one thing in here a shape cannot say on its own. */
function networkData(){
  /* This is a map of her words, not of the lists — so a word is on it once even
     when it is on two lists. "said" and "they" turn up on half the sight-word
     lists anyone would paste in, and counting them twice both inflated "in all"
     and drew the same word as two unconnected cells, one of which got none of
     the filaments. A word belongs to the earliest list that has it, which is
     also the pattern it was first taught as, since lists run easiest first. */
  var claimed = bare(null);
  var lists = allLists().map(function(l){
    var mine = wordsOf(l).filter(function(w){
      if(claimed[w]) return false;
      claimed[w] = true; return true;
    });
    return {list:l, words:mine};
  }).filter(function(g){ return g.words.length; });
  if(!lists.length) return null;
  var rnd = seeded(lists.map(function(g){ return g.list.id + g.words.length; }).join('|'));
  var cx = NET_W / 2, cy = NET_W / 2;
  // "In all" is every word on her lists, counted once — the whole corpus, not the
  // part of it that is drawn today. It is the honest answer to how many there are,
  // and the hint under the picture says which of the two it is.
  var total = lists.reduce(function(n, g){ return n + g.words.length; }, 0);
  var laid = [], byWord = bare(null);
  // The whole colony is a disc with NET_ROOM of room in it for every word she has.
  var R = Math.sqrt(total * NET_ROOM / Math.PI);
  var TURN = Math.PI * 2;
  // The golden ratio's fractional part. Stepping a fraction of a turn by it lands
  // evenly however many steps are taken, and never twice in the same place.
  var PHI = 0.6180339887;
  // The colony sits at a seeded angle rather than square to the page, so the seams
  // between families do not line up with anything.
  var spin = -Math.PI / 2 + (rnd() - .5) * 0.7;
  var at = 0;

  /* Every word is laid out, whether it is drawn or not, so a cell's place is
     fixed by its list and its position in it and by nothing else. The outlines
     that are drawn move forward as she meets words; the colony itself never
     shifts, because a map that reshuffled when she learned a word would be
     decoration rather than hers. */
  lists.forEach(function(g, li){
    var l = g.list, words = g.words, n = words.length;
    var jr = seeded('wedge' + l.id);
    /* A family's share of the turn is its share of her words, so a long list and a
       short one pack at the same density and the colony comes out as one disc
       rather than as a fan of unequal spokes. Seeded per list, so adding a list of
       her own does not reshuffle the jitter inside the others. */
    var w0 = spin + at * TURN, w1 = spin + (at + n / total) * TURN;
    at += n / total;
    var seam = (w1 - w0) * (1 - NET_SEAM) / 2;
    w0 += seam; w1 -= seam;
    var phase = jr();

    words.forEach(function(k_w, k){
      // Outward by index, at uniform density: the middle is as full as the rim.
      var rr = R * Math.sqrt((k + 0.35) / n) * (0.95 + jr() * 0.1);
      var ang = w0 + (w1 - w0) * ((k * PHI + phase) % 1)
              + (jr() - .5) * (w1 - w0) * 0.16;
      laid.push({w:k_w, k:k, x:cx + Math.cos(ang) * rr, y:cy + Math.sin(ang) * rr,
                 /* Subtle: a long word is a bigger cell, a short one smaller. The
                    base is what makes neighbours touch — a colony of cells with
                    daylight between all of them is a scatter, not one thing. */
                 r:4.0 + Math.min(9, k_w.replace(/[^a-z']/gi, '').length) * 0.42,
                 box:mastery(k_w).box || 1, met:!!S.words.mastery[k_w], fam:li});
    });
  });

  /* What is drawn: everything she has met — progress is never hidden — and the near
     horizon of unmet words, from the open list and on into the ones behind it. */
  var ghost = ghostWords();
  var cells = laid.filter(function(c){ return c.met || ghost[c.w]; });
  cells.forEach(function(c){ byWord[c.w] = c; });

  /* The frame is a camera, not the layout: it crops in, so a dozen outlines fill
     the picture as well as a hundred do rather than sitting in a corner of an
     empty square. The strokes are pinned to the screen, so cropping in does not
     turn a fine line into a rope, and a floor on the frame stops two or three
     cells being blown up like a poster.

     What it must not do is follow what happens to be drawn. A camera that does
     re-frames every time she meets a word, and then the whole colony slides and
     rescales under her: measured on a 375px screen, all seven cells moved and grew
     when she learned three words.

     So it reserves room per family, and only ever more of it. A family she has met
     a word of is hers for good, and the camera holds room for the whole of it from
     then on. A family the picture has only reached with outlines gets room for as
     far ahead as the horizon can ever see into it — a fixed number, so the frame
     does not creep outward as the horizon widens. And on the evening before she has
     met a single word, the camera holds nothing back at all and shows exactly the
     handful of outlines that are there, because reserving room for the whole of a
     list she has not touched would put six shapes in the corner of an empty square.
     The frame therefore changes at two moments in a family's life — the first time
     the picture shows a word of it, and the first time she meets one — and never for
     learning a word inside what it is already showing.

     It is the same shape every time, because the picture is the same box on the page
     at every stage now: fitted to the drawing and then let out to NET_ASPECT, never
     cropped to reach it. The breathing room is a share of the drawing rather than a
     fixed number of units, so the margin looks the same on the evening there are six
     outlines as it does with a hundred cells on. */
  var metFam = {}, drawnFam = {}, room = {}, here = (activeList() || {}).id;
  laid.forEach(function(c){ if(c.met) metFam[c.fam] = true; });
  cells.forEach(function(c){ drawnFam[c.fam] = true; });
  var going = wordsMet() > 0;
  lists.forEach(function(g, li){
    if(metFam[li] || (going && g.list.id === here)) room[li] = g.words.length;
    else if(drawnFam[li] && going) room[li] = GHOST_EDGE;
  });
  // The drawn cells are in the frame whatever the reservation says: nothing may be
  // outside it, and that guarantee does not depend on the arithmetic above.
  var inFrame = laid.filter(function(c){
    return c.k < (room[c.fam] || 0) || c.met || ghost[c.w];
  });
  if(!inFrame.length) inFrame = cells;
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  /* Every word is measured with the sketch line round it, whether it has one today
     or not. The sketch is the second line an unmet word carries, and it reaches a
     little further than the word — so measuring only the words that have one made the
     frame depend on which words she had met, and it shrank by a hair each time an
     outline filled in. That is a re-frame, small but real: at fifteen words met the
     frame came in from 85.4 units to 84.3 and every cell shifted with it. Half a unit
     of margin round a met cell costs nothing; the picture holding still is worth
     everything. */
  inFrame.forEach(function(c){
    var b = cellBounds(c.w, c.x, c.y, c.r);
    var sb = cellBounds(c.w + '~', c.x, c.y, c.r * SKETCH_R);
    x0 = Math.min(x0, b.x0, sb.x0); x1 = Math.max(x1, b.x1, sb.x1);
    y0 = Math.min(y0, b.y0, sb.y0); y1 = Math.max(y1, b.y1, sb.y1);
  });
  if(!isFinite(x0)){ x0 = y0 = 0; x1 = y1 = NET_W; }
  var floor = NET_W * 0.13, w = Math.max(x1 - x0, floor), h = Math.max(y1 - y0, floor);
  if(w < h * NET_ASPECT) w = h * NET_ASPECT; else h = w / NET_ASPECT;
  var pad = Math.max(w, h) * 0.012;
  var view = {x:(x0 + x1) / 2 - w / 2 - pad, y:(y0 + y1) / 2 - h / 2 - pad,
              w:w + pad * 2, h:h + pad * 2};

  /* A hairline where two words share a chunk, and only where the chunk is
     telling: one that turns up in a dozen words says nothing.
     These are the only threads left in the picture, and they earn it: a shape can
     say she has met a word and how well she holds it, and it cannot say that this
     word and that one are built the same way. Both ends have to be drawn and near
     each other, so there are none at all for her first few weeks and then a few more
     each month — counted on her real lists: none with eight words met, none at
     twenty-eight cells drawn, six at thirty words, nine at seventy-four cells,
     nineteen with everything met. That is why the caption below only mentions them
     when there are some — a caption describing something that is not on the screen is
     worse than none. */
  var byPiece = bare(null);
  cells.forEach(function(c){
    splitOf(c.w).forEach(function(p){
      if(p.length < 2) return;
      (byPiece[p] = byPiece[p] || []).push(c.w);
    });
  });
  /* Two control points with opposite-ish offsets: a lazy S rather than an arc.
     They are what makes it lazy, and pushed out sideways they can carry the curve
     out of the picture even though both of its ends are cells sitting safely
     inside it — the other half of the hairlines-off-the-edge complaint. A curve
     stays inside the box its control points are in, so holding those just inside
     the frame is enough, and it only bites on the handful of filaments that were
     bulging out anyway. It has to happen after the frame, which is why the
     filaments are worked out here rather than above the fit. */
  function held(p){
    return [Math.min(view.x + view.w - 1, Math.max(view.x + 1, p[0])),
            Math.min(view.y + view.h - 1, Math.max(view.y + 1, p[1]))];
  }
  /* How far a filament will reach. Shorter than it was: in a colony packed this
     tightly, a thread across half the picture passes under a dozen words on its way
     and reads as clutter rather than as a join. About four words' worth of room, so
     a filament is a short thread between near neighbours. */
  var links = [], far = Math.sqrt(NET_ROOM) * 4.4;
  Object.keys(byPiece).forEach(function(p){
    var ws = byPiece[p];
    if(ws.length < 2 || ws.length > 4) return;
    for(var i = 1; i < ws.length && links.length < 110; i++){
      var A = byWord[ws[i-1]], B = byWord[ws[i]];
      if(!A || !B || Math.hypot(A.x - B.x, A.y - B.y) > far) continue;
      var rnd = seeded('lnk' + p + A.w + B.w);
      var dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      var nx = -dy / len, ny = dx / len;
      var o1 = (rnd() - .35) * len * 0.22, o2 = (rnd() - .65) * len * 0.22;
      links.push({a:A, b:B, piece:p,
                  p1:held([A.x + dx * 0.33 + nx * o1, A.y + dy * 0.33 + ny * o1]),
                  p2:held([A.x + dx * 0.67 + nx * o2, A.y + dy * 0.67 + ny * o2])});
    }
  });

  return {cells:cells, links:links,
          total:total, cx:cx, cy:cy, view:view,
          known:cells.filter(function(c){ return c.box >= KNOWN_BOX; }).length,
          met:cells.filter(function(c){ return c.met; }).length};
}

/* bare: just the picture, for her finished screen. The section, the heading and the
   paragraph explaining it belong to the grown-ups screen — she does not need telling
   what her own words are, and the drawing is the same drawing either way, which is
   the point of using it in both places. */
function renderNetwork(d, bare){
  if(!d) return '';
  /* One picture, one label. role="img" is supposed to make the children
     presentational, but browsers do not prune SVG shapes that carry a <title>:
     without aria-hidden a screen reader walks a hundred word-shaped nodes in
     layout order, which is the word list read out scrambled and with no idea
     which ones she knows. Every shape below is hidden by hand and the whole
     thing says its numbers once. The <title>s stay — they are the hover
     tooltip, which is the only thing they are good for. */
  /* One box, the same at every stage. It used to be drawn small on her first
     evening and grow to full width by eighty words, and the owner has asked for
     the opposite: "keep the window or frame for the network diagram the same size
     for all." It is the better call for two reasons. The text around the picture
     stops shifting down the page as her map fills out over the months — the
     grown-ups screen is the same screen all year. And "it grew" is far more legible
     as a fuller frame than as a slightly larger one: six outlines and a hundred
     cells differ by a factor of sixteen in what is on the paper, and by a factor of
     1.6 in how wide the box was, which is the difference nobody could see.
     The camera still crops to what is drawn, so a small colony is simply drawn
     larger inside the same window. */
  var svg = '<svg class="net" viewBox="' + d.view.x.toFixed(1) + ' ' + d.view.y.toFixed(1)
    + ' ' + d.view.w.toFixed(1) + ' ' + d.view.h.toFixed(1) + '"'
    + ' role="img" aria-label="'
    + 'A growing picture of her words, grouped by spelling pattern: '
    + d.met + ' met, ' + d.known + ' known well, ' + d.total + ' in all">';

  d.links.forEach(function(k){
    svg += '<path class="net-link' + (k.a.met && k.b.met ? ' lit' : '') + '" aria-hidden="true" d="M'
        + k.a.x.toFixed(1) + ' ' + k.a.y.toFixed(1)
        + 'C' + k.p1[0].toFixed(1) + ' ' + k.p1[1].toFixed(1) + ' '
        + k.p2[0].toFixed(1) + ' ' + k.p2[1].toFixed(1) + ' '
        + k.b.x.toFixed(1) + ' ' + k.b.y.toFixed(1) + '"/>';
  });

  /* A word she has not met is sketched rather than drawn: a second line round it,
     the same word's shape at a different jitter and a hair's width bigger, so the
     two lines open and close around each other the way a pen does when it goes
     round twice. It arrived by accident — two outlines happened to overlap and
     looked hand-drawn — and it earns its place, because a word that is only coming
     up should look provisional. A word she has met is one confident shape, and the
     difference between the two is now something you can see across the room. */
  d.cells.forEach(function(c){
    if(c.met) return;
    svg += '<path class="net-sketch" aria-hidden="true" d="'
        + cellPath(c.w + '~', c.x, c.y, c.r * SKETCH_R) + '"/>';
  });

  /* Every cell gets the paper painted in behind it first. A word she has not met
     yet is a hollow outline, and the hairs run under the cells to reach the words
     they land on — so the thread showed straight through the empty ones and a faint
     outline with a line through it reads as crossed out. Which is the opposite of
     what an outline means here: it is a word she is coming to, not one she has
     lost. Two paths for the same shape is cheap; the alternative is stopping the
     threads short of the words they belong to. */
  d.cells.forEach(function(c){
    svg += '<path class="net-plate" aria-hidden="true" d="'
        + cellPath(c.w, c.x, c.y, c.r) + '"/>';
  });

  d.cells.forEach(function(c){
    /* Ghosted until she meets it, then darker with every box it climbs — all seven
       of them. The ramp used to saturate at KNOWN_BOX, so boxes 5, 6 and 7 all came
       out identical at full strength: four distinct tones across seven boxes, and
       once she knew everything the whole picture was one flat green with nothing
       left to say. Spread over the whole ladder there are seven tones, so a mature
       colony still has range in it: the words she has held longest are the darkest
       and the ones she has only just consolidated are lighter, which is the
       difference between a picture of what she knows and a picture of what she has
       finished. Monotonic — a word must never darken backwards — and box 1 stays
       clearly above an empty outline, which is nothing at all. */
    var fill = c.met ? (0.18 + 0.82 * (Math.min(MAX_BOX, c.box) - 1) / (MAX_BOX - 1)) : 0;
    svg += '<path class="net-cell' + (c.met ? ' met' : '') + (c.box >= KNOWN_BOX ? ' well' : '')
        + '" aria-hidden="true" d="' + cellPath(c.w, c.x, c.y, c.r) + '" style="--f:' + fill.toFixed(2) + '"'
        + ' data-x="' + Math.round(c.x) + '" data-y="' + Math.round(c.y) + '"'
        + ' data-r="' + c.r.toFixed(1) + '"><title>' + esc(c.w) + '</title></path>';
  });
  svg += '</svg>';

  /* The outline clause is conditional too, for the same reason the filament one is:
     it promised "the few she is coming to next as faint outlines" on the day she has
     met every word on every list and there is nothing coming at all. A caption that
     describes a picture you are not looking at is worse than no caption. */
  var ahead = d.cells.filter(function(c){ return !c.met; }).length;
  if(bare) return svg;
  return '<div class="sect"><h2>What she knows</h2>' + svg
    + '<div class="hint">Every word she has met is here'
    + (ahead ? ', and the few she is coming to next as faint outlines' : '')
    + '. It fills outward from the middle in the order she meets them, so the words '
    + 'that have been hers longest are at the heart of it and the newest are round the '
    + 'edge'
    + (ahead
        ? '; the outlines reach a little further ahead with every few words she meets, '
          + 'and the rest of her lists are not drawn until she is close to them, because '
          + 'a hundred empty outlines says more about how far there is to go than about her'
        : '')
    + '. They fill in and darken as she learns them, and a word she is losing dims '
    + 'rather than disappearing. Each family is one spelling pattern'
    /* Only when there are some. Two words sharing a chunk are usually a good way
       apart in the list, so both ends of a filament are rarely inside the near
       horizon: there are none at all until she is thirty or so words in. The copy
       promised a grown-up something that was not on the screen, and a caption that
       describes a picture you are not looking at is worse than no caption. */
    + (d.links.length
        ? '; the hairlines join words that share a chunk — <b>or</b> is what '
          + 'morning, sorted and report have in common. '
        : '. ')
    + d.met + ' met, <b>' + d.known + ' known well</b>, '
    + d.total + ' in all on her lists.</div></div>';
}

var _toastT = null;
function toast(msg){
  var t = el('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}
// Has she already finished a sitting on this list today? Keyed to the list,
// because a grown-up pasting this week's words has given her a new task, not
// more of the one she just completed.
function finishedToday(){
  var id = (activeList() || {}).id, t = todayISO();
  return (S.words.sessions || []).some(function(x){ return x.date === t && x.list === id; });
}
/* Is the sitting we walked away from still the sitting to come back to? It is if it
   belongs to today and to the list she is still on, and every word in it still exists
   somewhere in the corpus. Anything a grown-up did that invalidates it — switching
   lists, deleting the one she was on, restoring a backup, erasing everything, or
   simply staying until midnight — fails one of those and she gets a fresh one. */
function sessionStillGood(){
  if(!W) return false;
  if(W.day !== todayISO()) return false;
  if(W.listId !== (activeList() || {}).id) return false;
  var have = allWords();
  for(var i = 0; i < W.words.length; i++) if(have.indexOf(W.words[i]) < 0) return false;
  return true;
}
function go(s){
  /* Leaving her screen used to throw the sitting away outright, and coming back
     built a new one. Two things went with it. Her half-typed answer, which is
     annoying. And W.shown — the record of which words she had already been shown —
     so a word she had covered up and was writing from memory was shown to her again:
     a grown-up glancing at Progress mid-word silently turned the one exercise that
     works into a copying exercise. The sitting is kept now and validated on the way
     back instead. */
  clearAuto();
  if(s !== 'day'){ screen = s; saying = ''; window.scrollTo(0, 0); render(); return; }
  // Landing on her screen with no session used to render "All done for today",
  // so a grown-up who pasted the week's list and tapped Back handed her a
  // screen saying there was nothing to do.
  screen = s; saying = ''; window.scrollTo(0, 0);
  if(!sessionStillGood()) W = null;
  if(!W && !finishedToday() && start()) return;
  render();
}

/* =========================================================
   10. Events — one delegated handler. unlock() on every tap so
   iOS lets sound and speech through later.
   ========================================================= */
document.addEventListener('click', function(ev){
  var t = ev.target, hit;
  unlock();

  if((hit = t.closest('[data-go]'))){ go(hit.dataset.go); return; }
  if(t.closest('#again')){ if(!start()) toast('Nothing to practise just now.'); return; }
  // The verdict on a win is the tap target that skips the auto-advance wait; the
  // wordless chevron/tick after a miss (or at the end) carries her on. There is no
  // Cover button (the trace is the cover) and no Check button (return submits).
  if(t.closest('#advance')){ next(); return; }
  if(t.closest('#next')) { next(); return; }
  // (The [data-syl] tap-a-piece-to-hear handler went with the syllable chips/seams, 13.33.)
  if((hit = t.closest('[data-hear]'))){ say(hit.dataset.hear, {force:true}); return; }

  // ---- grown-ups
  if((hit = t.closest('[data-ra]'))){ S.settings.readAloud = hit.dataset.ra === '1'; save(); render(); return; }
  if((hit = t.closest('[data-sn]'))){ S.settings.sound = hit.dataset.sn === '1'; save(); render(); if(S.settings.sound) chime('right'); return; }
  if((hit = t.closest('[data-wr]'))){ S.settings.written = hit.dataset.wr === '1'; save(); render(); return; }
  if((hit = t.closest('[data-sc]'))){ S.settings.textScale = Number(hit.dataset.sc); save(); render(); return; }
  if((hit = t.closest('[data-tn]'))){ S.settings.tint = hit.dataset.tn; save(); render(); return; }
  if((hit = t.closest('[data-rate]'))){ S.settings.speechRate = Number(hit.dataset.rate); save(); render(); say('Every word counts.', {force:true}); return; }
  if((hit = t.closest('[data-voice]'))){
    S.settings.voice = hit.dataset.voice; _voiceKey = null; save(); render();
    say('Hello ' + (S.profile.name || '') + '. Time to practise.', {force:true});
    return;
  }
  if((hit = t.closest('[data-list]'))){ S.words.activeId = hit.dataset.list; save(); render(); return; }
  // The two pace steppers. newMax lives in 0–5; newMin in 0–3 and never above newMax, so
  // lowering the ceiling drags the floor down and raising the floor is bounded by the
  // ceiling. Every tap persists at once, like every other setting on this screen.
  if((hit = t.closest('[data-newmax]'))){
    S.settings.newMax = intBand(S.settings.newMax + (+hit.dataset.newmax), 0, 5, 3);
    if(S.settings.newMin > S.settings.newMax) S.settings.newMin = S.settings.newMax;
    save(); render(); return;
  }
  if((hit = t.closest('[data-newmin]'))){
    S.settings.newMin = intBand(S.settings.newMin + (+hit.dataset.newmin), 0, Math.min(3, S.settings.newMax), 0);
    save(); render(); return;
  }
  if(t.closest('#paceReset')){ S.settings.newMax = 3; S.settings.newMin = 0; save(); render(); return; }
  // ---- the playlist: add, reorder, remove
  if(t.closest('#addwordGo')){
    var box = el('#addword');
    var add = parseWordList(box ? box.value : '');
    if(!add.length){ toast('Type a word to add.'); return; }
    var pool = ownList();
    if(!pool){ pool = {id:OWN_ID, name:'My list', words:[]}; S.words.lists.push(pool); }
    if(!Array.isArray(pool.words)) pool.words = wordsOf(pool);
    var added = 0;
    add.forEach(function(w){ if(pool.words.indexOf(w) < 0){ pool.words.push(w); added++; } });
    // Her new words come from the pool she is curating, so make it the one she is on.
    S.words.activeId = OWN_ID;
    if(box) box.value = '';
    save(); render();
    toast(added ? (added === 1 ? 'Added.' : added + ' added.')
                : 'Already on her list.');
    return;
  }
  if((hit = t.closest('[data-wordup], [data-worddown], [data-wordrm]'))){
    var pool2 = ownList();
    if(!pool2 || !Array.isArray(pool2.words)) return;
    var ws = pool2.words;
    if(hit.dataset.wordup !== undefined){ var i = +hit.dataset.wordup;
      if(i > 0){ var a = ws[i-1]; ws[i-1] = ws[i]; ws[i] = a; } }
    else if(hit.dataset.worddown !== undefined){ var j = +hit.dataset.worddown;
      if(j < ws.length - 1){ var b2 = ws[j+1]; ws[j+1] = ws[j]; ws[j] = b2; } }
    else { ws.splice(+hit.dataset.wordrm, 1);
      // An empty pool is not a list — drop it, and move her off it if she was on it.
      if(!ws.length){
        S.words.lists = S.words.lists.filter(function(l){ return l.id !== OWN_ID; });
        if(S.words.activeId === OWN_ID) S.words.activeId = (allLists()[0] || {}).id;
      }
    }
    save(); render();
    return;
  }
  if((hit = t.closest('[data-del]'))){
    var b = hit;
    if(b.dataset.armed){
      var id = b.dataset.del;
      S.words.lists = S.words.lists.filter(function(l){ return l.id !== id; });
      if(S.words.activeId === id) S.words.activeId = (allLists()[0] || {}).id;
      save(); render(); toast('List deleted.'); return;
    }
    b.dataset.armed = '1'; b.textContent = 'Tap again to delete';
    setTimeout(function(){ if(b.isConnected){ delete b.dataset.armed; render(); } }, 3000);
    return;
  }
  if(t.closest('#pasteSave')){
    if(looksLikeBackup(el('#paste').value)){
      toast('That is a backup — use Restore, further down.');
      return;
    }
    var words = parseWordList(el('#paste').value);
    if(!words.length){ toast('No words found in that.'); return; }
    var name = (el('#pname2').value || '').trim() || 'Her list';
    var n = S.words.lists.reduce(function(mx, l){ return Math.max(mx, Number(String(l.id).slice(1)) || 0); }, 0);
    var id = 'w' + (n + 1);
    S.words.lists.push({id:id, name:name, words:words});
    S.words.activeId = id;
    save(); render();
    toast(words.length + (words.length === 1 ? ' word saved.' : ' words saved.'));
    return;
  }
  if(t.closest('#cliptest')){ testClip(); return; }
  if(t.closest('#clipsave')){ saveAllClips(); return; }
  if(t.closest('#copy')){
    var text = JSON.stringify(S, null, 2);
    try{
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(text).then(function(){ toast('Progress copied.'); },
                                                 function(){ toast('Could not copy.'); });
      else {
        var a = document.createElement('textarea');
        a.value = text; document.body.appendChild(a); a.select();
        document.execCommand('copy'); a.remove(); toast('Progress copied.');
      }
    }catch(e){ toast('Could not copy.'); }
    return;
  }
  if(t.closest('#restoreGo')){ restore(t.closest('#restoreGo')); return; }
  if(t.closest('#reset')){
    var r = t.closest('#reset');
    if(r.dataset.armed){
      localStorage.removeItem(KEY); load(); go('day');
      if(!start()) render();
      toast('Everything erased.');
      return;
    }
    r.dataset.armed = '1'; r.textContent = 'Tap again to erase everything';
    setTimeout(function(){ if(r.isConnected){ delete r.dataset.armed; r.textContent = 'Erase everything'; } }, 3000);
    return;
  }

  /* A tap that hit nothing on her word screen replays the word (WIN-4). The speaker button
     is gone, so the whole screen — the word, the box, the space around it — is how she hears
     it again. Not the control buttons/links or the syllable chips (they returned above with
     their own taps), and touch only, so a keyboard/screen-reader user is left alone. The win
     word (#advance) already returned above, so a tap there carries her on rather than replays. */
  if(screen === 'day' && word() && touchOnly()
     && !t.closest('button, a[href], [data-syl], [data-hear]')){
    say(word(), {force:true});
    armHearCue();               // she acted — hide the cue and restart its idle countdown
  }

  /* A tap that hit nothing, while she has a word to write. The whole design keeps some
     input focused at all times so the software keyboard never closes and the two buttons
     never jump — holdKeyboard() does it between stages, and the spelling box itself does
     it while she is writing. A finger that lands slightly wide, on the covered word or the
     space by the box, blurs the box and there was nothing to put it back: the keyboard
     closes and the buttons move, which is the exact dance #kbhold was added to stop.
     Touchscreens only, as everywhere else here — pulling focus back would fight anyone
     driving by keyboard or exploring by screen reader. */
  if(el('#type') && touchOnly() && !_kbd && !t.closest('button, input, textarea, a[href], [data-syl]')
     && document.activeElement !== el('#type')){
    var box = el('#type');
    try{ box.focus({preventScroll:true}); box.setSelectionRange(box.value.length, box.value.length); }catch(e){}
  }
});

/* How the letters got into the box.

   She found the microphone key on the phone's keyboard and said the word, and it spelled
   it for her. A web page cannot reach the software keyboard — there is no API for hiding
   one of its keys — so the mic itself cannot be taken away. What it can do is notice that
   the letters did not come from her writing them.

   Measured across six ways of filling the box, the signature is unambiguous. Typing puts
   in one character per input event; dictation, glide typing, a tap on the predictive bar
   and a paste all put in the whole word in a single event. Keystroke counts separate them
   just as cleanly — nine against nought — but the jump size is the signal this leans on,
   because it does not depend on what a particular keyboard does about keydown, and an iOS
   keyboard's keydown behaviour is the one thing that cannot be checked from here.

   Counting keystrokes and comparing them against the letters in the box would catch one
   more case — a phone that dictates a letter at a time — and it is deliberately not done,
   because its safety rests entirely on that same unverifiable behaviour. If an iOS software
   keyboard turned out not to fire keydown for its letters, every word she wrote by hand
   would be refused, and the failure would be invisible from here and total on her phone.
   The jump test cannot fail that way: if it is wrong about something, it is wrong in the
   direction of letting an answer through.

   Deleting is not counted: a select-all-and-delete removes several characters at once and
   is nothing to do with any of this. */
document.addEventListener('beforeinput', function(ev){
  if(ev.target.id !== 'type' || !W) return;
  // A pasted answer is never her writing the word: it never lands, and the word is read out
  // again so the cue is the same as any other hand-back — the box unchanged, the word spoken.
  if(ev.inputType === 'insertFromPaste'){ ev.preventDefault(); say(word()); return; }
  if(chars(ev.data) > 1) W.notWritten = true;
});
/* Every letter she types is a keystroke first, and a dictated one is not.
   This was left out when the check went in, because its safety rested on a software keyboard
   firing keydown for its letters and that could not be checked from a desktop — if it did
   not, every word she wrote by hand would have been refused, invisibly here and totally on
   her phone. Measured on the phone since: typing "beautiful" on iOS 18.7 gives nine
   keydowns, and dictating it gives none at all. So the signal is real, and it catches what
   the jump test cannot — a recogniser that hands over one letter at a time, or a one-letter
   word where there is no jump to see.
   Still not trusted blindly. It only counts against her once this device has been seen to
   produce a keystroke, so a keyboard that reports none can never lock her out: at worst the
   very first word, before she has ever typed anything, goes through. Remembered the same way
   the keyboard inset is, from a real observation rather than an assumption. */
addEventListener('keydown', function(ev){
  if(!W || !ev.target || ev.target.id !== 'type') return;
  /* Anything that could be a letter going in — not navigation, editing or a lone modifier.
     Deliberately generous: a single character is the plain case, but an IME hands over
     key "Unidentified" or keyCode 229 and that is still her pressing a key, so it counts
     too. Backspace, Enter and the arrows do not — deleting and moving about are not writing.
     Measured on her phone, typing on iOS 18.7 fires one of these per letter and dictation
     fires none, which is the whole basis for trusting the count. */
  var k = String(ev.key || '');
  if(/^(Backspace|Delete|Enter|Tab|Escape|Arrow|Home|End|Page|Shift|Control|Alt|Meta|CapsLock|F\d)/.test(k))
    return;
  W.keys = (W.keys || 0) + 1;
  if(S && S.settings && !S.settings.sawKeys){ S.settings.sawKeys = true; save(); }
}, true);
/* The trace. On a never-met word she copies it letter by letter into the focused box.
   A key is taken only when it is the next letter of the word — folded so a curly
   apostrophe or an accented letter matches the plain one — and every keystroke is
   preventDefault'd so the box is never written to by the browser: it is set here to the
   correctly-copied prefix and nothing else. A wrong key is simply dropped, so her error
   is never drawn (§5) and no input event fires to record anything (copying is not a
   test). When the whole word is traced the box IS the cover: a short settle, then the
   same word is asked blind, with keys and attempt reset so the write-stage guard counts
   only what she types from memory. Capture phase, ahead of the key counter, and it does
   not touch W.keys — the reset on the way to write is what keeps that guard clean. */
addEventListener('keydown', function(ev){
  // The letter-by-letter copy drives two screens: the first trace of a new word (stage 'look')
  // and the re-trace of a missed one (W.retrace, WIN-1). Both accept only the next correct letter.
  if(!W || !(W.stage === 'look' || W.retrace) || !ev.target || ev.target.id !== 'type') return;
  var k = String(ev.key || '');
  if(k === 'Tab') return;                               // focus must still be able to leave the box
  ev.preventDefault();                                  // the box is ours to fill; nothing else edits it
  if(k.length !== 1) return;                            // Enter, Backspace, arrows, modifiers: swallowed
  var w = word(), t = W.traced || 0;
  if(t >= w.length) return;
  if(foldKey(k) !== foldKey(w.charAt(t))) return;       // not the next letter — discard it
  W.traced = t + 1;
  if(W.traced >= w.length){
    clearAuto();
    if(W.retrace){
      /* The re-trace is complete — the missed word copied back correctly. A short settle so it
         registers, then the sitting simply moves on (WIN-1: corrective, no re-score — the miss
         was already recorded and requeued for a real retrieval later). */
      W.autoTimer = setTimeout(function(){
        if(!W || !W.retrace) return;
        W.retrace = false;
        next();
      }, 500);
    }else{
      /* The whole word is copied. A short settle so the finished trace registers, then the
         blind write of the same word — the first real retrieval. Cancellable like the win
         timer, so a programmatic cover() or next() never races it. */
      W.autoTimer = setTimeout(function(){
        if(!W || W.stage !== 'look') return;
        // notWritten reset too: the blind write is a fresh retrieval, and if she used the
        // mic or glided on the TRACE (a whole-word insert sets the flag), it must not follow
        // her to the write and hand back a word she then writes by hand.
        W.stage = 'write'; W.attempt = ''; W.keys = 0; W.traced = 0; W.notWritten = false;
        render();
      }, 500);
    }
  }
  render();
}, true);
document.addEventListener('input', function(ev){
  if(ev.target.id === 'pname'){ S.profile.name = ev.target.value; save(); }
  if(ev.target.id !== 'type' || !W) return;
  var was = String(W.attempt || ''), now = ev.target.value;
  // More than one letter appearing between two events is not something a hand does.
  if(chars(now) - chars(was) > 1) W.notWritten = true;
  if(chars(ev.data) > 1) W.notWritten = true;
  W.attempt = now;
  armHearCue();                 // she is typing — hide the cue and restart its countdown
});
// Enter checks the word — she shouldn't have to find a button.
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Enter' && ev.target.id === 'type' && W && W.stage === 'write'){
    ev.preventDefault(); unlock(); check(); return;
  }
  /* On a WIN, return carries her on — the win's wait skipped — without her having to wait it
     out. Gated to her own screen and placed after the write branch so the same keypress that
     checks a word cannot also advance past its verdict. Not on a re-trace (W.retrace): there
     Enter is swallowed by the copy handler above, because copying the word to the end is what
     moves her on, not a keypress that skips the correction. */
  if(ev.key === 'Enter' && W && W.stage === 'check' && !W.retrace && screen === 'day'){
    ev.preventDefault(); unlock(); next(); return;
  }
  // Enter in the add-a-word box adds it, so a grown-up can rattle a few in.
  if(ev.key === 'Enter' && ev.target.id === 'addword'){
    ev.preventDefault();
    var go = el('#addwordGo'); if(go) go.click();
  }
});

/* A tap on a button takes focus off the input, and iOS starts closing the
   keyboard the moment that happens — refocusing afterwards is too late, which is
   why holding it open was not enough on the phone. Cancelling the default on
   mousedown stops the focus moving at all, so the keyboard never begins to go.
   The click still fires. Touch only, and never over something she needs to type
   in. */
document.addEventListener('mousedown', function(ev){
  if(_kbd || !touchOnly()) return;
  var t = ev.target;
  if(!t || !t.closest) return;
  if(t.closest('input, textarea')) return;              // she is aiming at a box
  if(!t.closest('button')) return;
  var on = document.activeElement;
  if(!on || (on.tagName !== 'INPUT' && on.tagName !== 'TEXTAREA')) return;
  ev.preventDefault();                                  // focus stays where it is
}, true);

// Belt and braces: if the focus moved anyway, put it back.
document.addEventListener('click', function(){ holdKeyboard(); });

// Grown-ups: press and hold ACORN. No PIN to forget, and nothing on her screens
// that looks like a way in. Delegated, because the header is rebuilt every render.
(function(){
  var timer = null;
  function stop(){ clearTimeout(timer); timer = null; }
  document.addEventListener('pointerdown', function(ev){
    if(!ev.target.closest || !ev.target.closest('.wordmark')) return;
    stop();
    timer = setTimeout(function(){ unlock(); go('parent'); }, 700);
  });
  ['pointerup','pointercancel','pointerleave','scroll'].forEach(function(e){
    document.addEventListener(e, stop, true);
  });
  document.addEventListener('contextmenu', function(ev){
    if(ev.target.closest && ev.target.closest('.wordmark')) ev.preventDefault();
  });
})();

// Midnight must roll the day over, on resume and while the app sits open.
var _renderedDay = null;
function checkRollover(){
  if(_renderedDay && _renderedDay !== todayISO()){
    _renderedDay = todayISO();
loadClips(); saying = '';
    if(screen !== 'parent'){ W = null; if(!start()) render(); }
  }
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') checkRollover();
});
setInterval(checkRollover, 60000);

/* =========================================================
   11. Test hook. Playwright drives the pure logic and travels
   through time. No behaviour depends on this existing.
   ========================================================= */
window.__acorn = {
  VERSION: VERSION,
  get state(){ return S; },
  save: save, load: load,
  setToday: function(d){ _today = d; _renderedDay = todayISO();
loadClips(); render(); },
  todayISO: todayISO, dayDiff: dayDiff,
  syllables: syllables, splitOf: splitOf, offerVoices: offerVoices, sameWord: sameWord,
  clearVoiceCache: function(){ _voice = null; _voiceKey = null; }, parseWordList: parseWordList, COMPOUNDS: COMPOUNDS, SYLLABLES: SYLLABLES,
  matched: function(a, b){ var m = matched(a, b); return {count:m.count, hit:Object.keys(m.hit).map(Number).sort(function(x,y){return x-y;})}; },
  mastery: mastery, recordWord: recordWord, isDue: isDue, overdueRatio: overdueRatio,
  acquiring: acquiring, knownCount: knownCount,
  // What the last finished sitting changed: met for the first time, climbed a box,
  // slipped back. The screen at the end of a sitting is built from these.
  /* The whole evening, not the last sitting of it: she may practise twice, and a
     reload starts a fresh sitting whose lists are empty, which would otherwise hide
     what she had already done. A word that slipped at any point in the evening is
     counted as slipped and nowhere else — the slip is the truth about it. */
  tonight: tonight,
  buildSession: buildSession, recentAccuracy: recentAccuracy,
  newWordsToday: newWordsToday, poolCap: poolCap, stageFor: stageFor,
  allLists: allLists, activeList: activeList, wordsOf: wordsOf, allWords: allWords,
  englishVoices: englishVoices, offerVoices: offerVoices, voiceScore: voiceScore,
  voicesChanged: voicesChanged, holdKeyboard: holdKeyboard,
  clipKb: function(){ return CLIP_KB; },
  // Tests drive the clip index directly rather than depending on what happens to
  // be recorded in the repo at the time.
  // Changing the clip set invalidates the element holding the old one, in flight
  // or not. Without this a test's stub is never reached: the app plays a word as
  // soon as it opens, so a real element already exists by then.
  setClips: function(list, ext){
    stopClips(); _clipEl = null;
    Object.keys(_blob).forEach(function(k){
      try{ URL.revokeObjectURL(_blob[k]); }catch(e){} delete _blob[k]; });
    _warming = bare(null);
    CLIPS = list || []; if(ext) CLIP_EXT = ext; loadClips();
  },
  warmClips: warmClips, sittingPhrases: sittingPhrases,
  clipUrl: clipUrl, warmed: function(){ return Object.keys(_blob).length; },
  clipFor: clipFor,
  start: start, check: check, next: next, paceLabel: paceLabel, announce: announce,
  // Enough of a handle to drive a whole session from a script — the
  // simulations in tests/sim.js run the real flow, not a copy of it.
  // A clean slate: wipe storage AND drop any live session. Without the W = null a session
  // built at page load (before a test's setToday) outlives the reset, and on the one date where
  // its day equals the test's target it passes sessionStillGood and renders over a screen the
  // test is trying to reach — a done-screen test that only failed when the wall clock caught up
  // to its hard-coded date. reset is a test/sim hook, never the app.
  reset: function(){ W = null; localStorage.removeItem(KEY); load(); },
  // Drop any live sitting without wiping her data — for tests that build a specific state and
  // then a specific screen, where the sitting the app auto-starts at page load (its day is the
  // real clock's, set before the test's setToday) would otherwise still be valid for the test's
  // date and render over the screen the test is reaching for. A test hook, never the app.
  clearSession: function(){ clearAuto(); W = null; },
  // Jumps 'look' -> 'write' the way completing the trace does, resetting attempt, keys
  // and the trace so a programmatic driver (and the sim) skips the trace exactly as the
  // old cover step did. At the look stage these are already clear, so this stays a no-op
  // for the sim and leaves its numbers byte-identical.
  cover: function(){ if(W){ clearAuto(); W.stage = 'write'; W.attempt = ''; W.keys = 0; W.traced = 0; W.retrace = false; render(); } },
  type: function(v){ if(W){ W.attempt = v; if(el('#type')) el('#type').value = v; } },
  /* plan, day, listId and shown are here so a test can tell the sitting she was
     handed back apart from a fresh one that happens to look like it. Without them,
     asserting plan === plan compared undefined with undefined and passed. */
  session: function(){ return W && {words:W.words.slice(), i:W.i, stage:W.stage, tries:W.tries,
                                     right:W.right, firstTime:W.firstTime, failed:W.failed.slice(),
                                     requeue:W.requeue.slice(), plan:W.plan, day:W.day,
                                     listId:W.listId, shown:W.shown.slice(),
                                     done:(W.done || []).slice(),
                                     keys:W.keys || 0,
                                     retrace:!!W.retrace,
                                     notWritten:!!W.notWritten}; },
  go: go, screen: function(){ return screen; },
  BOX_DAYS: BOX_DAYS, MAX_BOX: MAX_BOX, KNOWN_BOX: KNOWN_BOX,
  meanings: function(){ return Object.assign({}, MEANING); },
  shedOrder: function(){ return {word: SHED_ORDER.word.slice(), done: SHED_ORDER.done.slice()}; },
  twins: function(){ return TWINS.map(function(p){ return p.slice(); }); },
  ACQUIRING_CAP: ACQUIRING_CAP, SEED_NEW: SEED_NEW, sessionWords: sessionWords,
  // The pace-lever sanitiser, exposed so a test can hand it junk directly rather than
  // only through a reload — same coercion either way.
  saneSettings: saneSettings,
  // The map: how far the outlines reach, and the one outline every word carries
  // — the dots on her word screen are the same shapes from the same function.
  ghostAhead: ghostAhead, ghostWords: function(){ return Object.keys(ghostWords()); },
  cellPath: cellPath, dotShape: dotShape
};

/* ---- boot: she opens the app and is on a word ---- */
load();
_renderedDay = todayISO();
loadClips();
if(!start()) render();
})();
</script>
