<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Acorn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Acorn">
<meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#22242A" media="(prefers-color-scheme:dark)">
<!-- The one file this app cannot inline. iOS does not reliably honour a data: URI
     for apple-touch-icon, so the tile has to be a real PNG next to this page — and
     it has to be fully opaque, because iOS composites transparency to black and
     applies its own rounded mask, so square corners and no alpha channel.
     It is the mark from her header, drawn as an outline: the same three lobes, the
     same accent green, hollow instead of filled.
     iOS snapshots this when the shortcut is created and never re-fetches it, so
     changing it here does nothing to a phone that already has the app on its Home
     Screen — that needs the shortcut deleted and added again. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="A calm spelling practice app.">
<style>
/* ===========================================================
   Acorn — spelling practice, dyslexia-friendly by default.

   Cream surface, dark-slate ink (never black), one calm accent.
   Large well-spaced type, short lines, one task per screen.

   Three scales and nothing off them: type, spacing, radius. The
   evidence on "dyslexia fonts" is that they don't help; size,
   letter spacing, line spacing and line length do. So that is
   where the effort goes.
   =========================================================== */
:root{
  --surface:#FBF6EC; --surface-2:#FFFDF7; --ink:#3B4149; --ink-soft:#686E76;
  --line:rgba(59,65,73,.14); --line-2:rgba(59,65,73,.26);
  --acc:#35705A; --acc-ink:#FFFFFF; --acc-soft:#E4EFE8;
  /* Two-tone pebble (WIN-3, David's pick B): a deep rim and a lighter dome, so a collected
     word reads as a raised pebble rather than a flat blob. Brackets --acc either side. */
  --acc-deep:#285442; --acc-lite:#5E9A82;
  --good:#3B795F; --retry:#A15D27;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",sans-serif;

  /* type — every size in the app is one of these */
  --t-xs:.75rem; --t-sm:.875rem; --t-md:1rem; --t-lg:1.125rem;
  --t-xl:1.375rem; --t-2xl:2rem; --t-3xl:2.5rem; --t-4xl:3.5rem;
  /* spacing — quarter-rem steps, so the vertical rhythm is even */
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem; --s7:2.5rem;
  /* radius — three, plus a pill for the thin bars */
  --r-sm:.75rem; --r-md:1rem; --r-lg:1.25rem; --r-pill:999px;
  /* Tap targets. 3rem is 51px at the default root, comfortably over the 44px floor —
     but rem follows her text-size setting, and at the smallest stored value (.8, which
     saneSettings accepts from a restored backup even though the buttons only offer .9
     and up) 3rem measured 41px and every button in the app was under the floor. The
     max() is a physical floor under a scale that otherwise still grows with her text.
     --tap-lg and --tap-xl are 48px and 54px even at .8, so they need none. */
  --tap:max(44px, 3rem); --tap-lg:3.5rem; --tap-xl:4rem;

  --scale:1;
  --shadow:0 1px 2px rgba(59,65,73,.05), 0 6px 18px rgba(59,65,73,.06);
  /* Motion. One easing everywhere, and three durations that were already a coherent
     ladder — .18s for a press, .3s for a small state change, .6s for the slow ones —
     but written as literals in six places, which is how a seventh ad-hoc value gets
     in without anyone noticing. Same drift the length scales had in 10.3. */
  --ease:cubic-bezier(.22,.61,.36,1);
  --m-press:.18s; --m-quick:.3s; --m-slow:.6s;
}
/* Background tints — some readers find a particular tint easier. */
[data-tint="peach"]{--surface:#FBF0E8;--surface-2:#FFF8F2;}
[data-tint="mint"] {--surface:#EDF6F0;--surface-2:#F7FCF9;}
[data-tint="blue"] {--surface:#EDF2F8;--surface-2:#F8FAFD;}
[data-tint="grey"] {--surface:#F2F1EE;--surface-2:#FAFAF8;}

@media (prefers-color-scheme:dark){
  :root{
    --surface:#22242A; --surface-2:#2A2D34; --ink:#E8E3D9; --ink-soft:#A9A49B;
    --line:rgba(232,227,217,.13); --line-2:rgba(232,227,217,.26);
    --acc:#7CC0A2; --acc-ink:#14231C; --acc-soft:#2C3A34;
    --acc-deep:#579A7E; --acc-lite:#A6DCC2;                /* two-tone pebble, on the dark screen */
    --good:#7CC0A2; --retry:#DCA173;
    --shadow:0 1px 2px rgba(0,0,0,.2), 0 6px 18px rgba(0,0,0,.24);
  }
  [data-tint]{--surface:#22242A;--surface-2:#2A2D34;}   /* tints are a light-mode comfort */
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  /* rem against the browser's own base, so the OS text-size setting still counts */
  font-size:calc(1.0625rem * var(--scale));
}
/* The document is a fixed frame that never scrolls or rubber-bands: everything
   that needs to scroll does so inside main (below), which is overscroll-contained.
   overflow:hidden + overscroll-behavior alone were NOT enough on iOS — in a
   Home-Screen app the keyboard overlays (the layout viewport never shrinks) and
   WebKit still lets the whole page be dragged with the keyboard up. Pinning the
   body with position:fixed removes the thing there is to drag: the layout viewport
   is nailed down, so there is no document pan (worklist SCR-1; verify on device).
   Safe-area insets live on #app, not here, so the body is never a notch taller than
   the screen — which was itself enough to make the page draggable. */
html,body{margin:0; height:100%; overflow:hidden; overscroll-behavior:none;
          background:var(--surface);}
body{
  position:fixed; inset:0; width:100%;
  color:var(--ink); font-family:var(--sans);
  /* generous line and word spacing: the part of typography that does help */
  line-height:1.7; letter-spacing:.01em; word-spacing:.06em; text-align:left;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit; color:inherit; letter-spacing:inherit;}
button{border:0; background:none; cursor:pointer; touch-action:manipulation;}
h1,h2{line-height:1.3; letter-spacing:0; margin:0; font-weight:700;}
/* Keyboard focus stays visible; a tap never draws one. */
:focus-visible{outline:3px solid var(--acc); outline-offset:2px;}

#app{max-width:34rem; margin:0 auto;
     /* safe-area insets fold into the app's own padding, inside the border-box
        height, so the frame stays exactly the height of the screen (no overflow). */
     padding:calc(var(--s4) * var(--ornament) + env(safe-area-inset-top)) calc(var(--s4) + env(safe-area-inset-right)) calc(var(--s4) * var(--ornament) + env(safe-area-inset-bottom)) calc(var(--s4) + env(safe-area-inset-left));
     height:100vh; height:100dvh; height:var(--vh, 100dvh);
     display:flex; flex-direction:column;}
/* When the keyboard comes up, iOS sometimes PANS the visual viewport to chase the
   caret before our reserved keyboard-band has settled — and with the body pinned
   (position:fixed) that pan gets stuck, leaving the box shoved off the top until a
   keyboard hide/show jolts it back. That is the same visual-viewport pan behind the
   old scroll bug, just its leftover. So when the viewport is panned (offsetTop > 0)
   we glue the app back onto the visible region by shifting it up by exactly that
   amount. Gated on [data-panned] so with no pan there is no transform at all — it
   cannot touch the grown-ups or finished screens, which never pan. */
:root[data-panned] #app{transform:translateY(var(--vvtop, 0px));}
/* The content scrolls inside itself so the action below it can never be
   scrolled away from. At the larger text sizes — which is who this app is for —
   the column is taller than the phone, and the one button she needs sat up to
   288px below the fold. She should never have to discover scrolling to answer
   a word. */
main{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;}
/* On the word screen main never needs to scroll: LAY-1 made the word one
   deterministic size, the tight/cramped shed drops everything non-essential, and
   the one button she needs lives in #act BELOW main, not in the scroll. Measured,
   the content fits above the keyboard at 1.5x on the smallest phone with nothing
   to spare (0px overflow on look/write/check). So lock it — iOS was letting her
   drag and rubber-band this region with the keyboard up even with nothing to
   scroll, which is the drag she reported and position:fixed on the body could not
   stop (LAY-2, the real SCR-1 fix). The grown-ups and finished screens, which are
   genuinely long, keep their scroll. */
:root:not([data-stage=parent]):not([data-stage=done]) main{overflow:hidden;}
/* Her screens sit in the middle of the room they have rather than clinging to
   the top of it — at normal text size three quarters of the panel was empty
   below the word. Auto margins rather than justify-content:center because when
   the content is taller than the panel they collapse to nothing, so it
   top-aligns and scrolls properly instead of hiding its first line. */
:root:not([data-stage=parent]) main{display:flex; flex-direction:column;}
:root:not([data-stage=parent]) main > :first-child{margin-top:auto;}
:root:not([data-stage=parent]) main > :last-child{margin-bottom:auto;}
/* Ornament stays the size it was drawn at whatever text size she has chosen.
   --ornament undoes the root scaling, so these are on the same scale as
   everything else but do not grow with her reading preference. */
:root{--ornament:calc(1 / var(--scale));}
/* One row: hearing the word and answering it are both always in reach, and the
   scrolling content above keeps as much height as possible. It wraps to two
   rows only when the labels genuinely cannot share a line. */
#act{flex:none; padding-top:var(--s2); display:flex; flex-wrap:wrap;
     gap:calc(var(--s2) * var(--ornament)); align-items:stretch;
     container-type:inline-size;}
#act .quiet{margin:0;}
#act:empty{display:none;}
/* The footer is NOT reserved on word screens. It only carries a button on a miss (the "next"
   chevron); reserving its height everywhere cost ~77px off `main`, and with the keyboard up
   that tipped the writing screen into overflow — at which point the shed logic dropped the
   progress dots entirely (they were reported vanishing). So the footer collapses when empty,
   as before. The cost is that the miss screen's word sits ~40px higher than a win's — but a
   win and a miss are different words she never sees back to back, and the writing screen (where
   she spends her time) and the win are both pinned. Dots that show beat a perfectly still miss. */

/* ---------- header: the mark + today's progress ---------- */
/* flex:none, so the header is pinned to the top of the app exactly the way #act
   is pinned to the bottom of it, and main takes whatever is between the two. The
   only thing that changes size when the software keyboard opens or closes is then
   the whitespace inside main — the header cannot ride the change. Without it the
   header keeps flex-shrink's default of 1, so on a screen with too little room the
   flex algorithm is entitled to take height out of the one row she navigates by:
   at the largest text "← Back" and the crumb are two rows, and a row of that is
   the way out of the grown-ups screen. It stays in flow, because the header
   floating over her word is the bug fitScreen() exists to prevent. */
.bar{flex:none; display:flex; align-items:center; gap:var(--s3); min-height:var(--tap);
     margin-bottom:var(--s5); flex-wrap:wrap; row-gap:var(--s2);}
/* At the largest text size on a narrow phone the label and the back button
   cannot share a line. Stacking is fine; breaking "GROWN-UPS" in half is not. */
.wordmark{position:relative; font-size:var(--t-xs); font-weight:800; letter-spacing:.18em;
          text-transform:uppercase; color:var(--acc); user-select:none; white-space:nowrap;}
.wordmark.crumb{color:var(--ink-soft);}
/* Her own header is a mark rather than the word: the same hand-drawn outline the
   progress dots and the map cells are drawn with, at three points instead of
   seven. It has to occupy the box the letters occupied or the header shifts under
   her, so it is square and exactly one line box tall — 1.3em is the h1's own
   line-height, which is what the text measured. That leaves it narrower than the
   letterspaced word it replaces, and the spacer beside it takes up the slack, so
   the progress bar does not move either. */
.mark svg{display:block; width:1.3em; height:1.3em;}
.mark path{fill:var(--acc);}
/* The mark is also the way in to the grown-ups screen, and one line of small caps
   is a 15px target. The hit area is grown to the same 44px-plus floor everything
   else here keeps, on a pseudo-element so it costs no layout: the mark's own box
   is still the box the text had. */
.mark::after{content:""; position:absolute; left:50%; top:50%; width:var(--tap); height:var(--tap);
             transform:translate(-50%,-50%);}
.bar .sp{flex:1;}
.back{display:inline-flex; align-items:center; gap:var(--s2); min-height:var(--tap);
      padding-right:var(--s3); border-radius:var(--r-md); font-size:var(--t-md);
      font-weight:600; color:var(--ink-soft); white-space:nowrap;}

/* ---------- the word ---------- */
.dots{display:flex; justify-content:center; align-items:center; gap:var(--s2);
      /* The current dot is scaled up, and main clips: without this the top of it
         is shaved off. */
      padding-block:calc(var(--s2) * var(--ornament));
      margin-bottom:calc(var(--s3) * var(--ornament));}
/* Each dot is the outline that word has on her map, not a circle — the row is a
   handful of the things she is collecting. The box is the same size for every
   dot and the differences in size and spacing are drawn inside it, so the row
   cannot reflow and the current one is still only ever scaled. */
.dots i{flex:none; width:calc(var(--t-sm) * var(--ornament)); height:calc(var(--t-sm) * var(--ornament));
        transition:transform var(--m-quick) var(--ease);}
.dots i svg{display:block; width:100%; height:100%; overflow:visible;}
.dots i path{fill:var(--line-2);}                    /* unmet — or the word she is ON but has not
                                                        yet spelled: a flat faint blob, waiting */
.dots i .pb-dome{display:none;}                      /* no dome on an unmet or first-round dot */
.dots i.on .pb-base{fill:var(--acc);}                /* greens on SUCCESS (once collected): flat green */
.dots i.rooted.on .pb-base{fill:var(--acc-deep);}    /* done a second time this sitting: deep rim... */
.dots i.rooted.on .pb-dome{display:block; fill:var(--acc-lite);}   /* ...+ lit dome */
.dots i.now{transform:scale(1.5);}                   /* the word she is on is the enlarged one, filled or not */

/* The word she reads and the word she is shown afterwards must be the
   same size, weight and spacing — otherwise the shape she memorised
   moves on her between one screen and the next.

   A word never breaks across lines: half a word on each line teaches the
   wrong shape. Instead it shrinks to fit the line, driven by its own length
   (--wl, set when it renders), so "February" at the largest text size still
   arrives whole. .8 is the measured average glyph advance of this bold face
   at this letter-spacing, plus headroom: the widest real word tested came to
   .763 ("enough"). Past about fourteen letters the floor takes over and it
   wraps, which is still better than clipping letters off a word she is
   about to copy. */
/* The checked word shares the writing box's footprint exactly — same line-box (1.7, inherited
   like the input's) and the same vertical padding — so the word-slot is ONE height on every
   stage (trace box, writing box, checked word) and the word's top never shifts. No margin: the
   word-slot centres it, and the slot is a fixed height (see .wordslot), so nothing it holds can
   move the dots above it. The box hairline is drawn only on the input stages; here the same
   footprint carries no edge, which is why she reads it free. */
/* Just .word now: a miss no longer shows a separately-marked word (.marked) — it re-traces
   the correct word in its box (WIN-1), the slipped letter drawn in orange on the trace itself
   (.tracew .slip), so the marked-word styling is gone with it. */
.word{
  position:relative;
  text-align:center; font-weight:700; line-height:1.7;
  letter-spacing:.06em; word-spacing:.1em; margin:0; padding:var(--s3) 0; overflow-wrap:anywhere;
  font-size:clamp(var(--t-xs), calc((min(100vw, 34rem) - 2 * var(--s4)) / (max(var(--wl,6), 12) * .8)), var(--t-3xl));}
/* The success moment (WIN-5, decision D-c): a correct word IS the reward — it turns
   the accent green, the same green as the pebbles, the trace letter and her map, so it
   visibly joins the things she is collecting, and breathes once. No "Yes — that's it."
   caption above it any more; the word says it. The colour settle lives INSIDE the
   keyframe (ink -> green by 40%) rather than a transition, because the word block is
   built fresh each render and a transition has no prior state to move from; folding it
   in makes the whole cue fire on insertion with no JS. +4% peak is under the app's own
   +7% swatch emphasis and eases back to rest — a breath, not a bounce. The app's first
   @keyframes. Under prefers-reduced-motion the global rule zeroes the duration, leaving
   exactly the end state: green, at rest. --acc at this weight is AA on cream (5.5:1) and
   dark (7.4:1), certified with the trace letter. */
@keyframes acorn-settle{
  0%{transform:scale(1); color:var(--ink);}
  40%{transform:scale(1.04); color:var(--acc);}
  100%{transform:scale(1); color:var(--acc);}
}
.word.won{color:var(--acc); animation:acorn-settle var(--m-quick) var(--ease);}

/* The trace, on a never-met word. The letters carry the state and a transparent input
   over the top takes the keyboard: tapping anywhere on the word focuses it, and only
   the correctly-copied prefix is ever drawn (the input is filled from code, its own text
   kept invisible so there is no double image). Colour is not the only signal: everything
   left of the lit letter is solid and everything right of it is faint, so the boundary
   between them marks her place, and the whole word is spelled out to a screen reader in
   the announcement. The lit letter is the accent green — measured AA on cream (5.5:1) and
   in dark (7.4:1), like the other two inks — and none is faded by opacity, so every tint
   clears contrast. */
/* The trace box carries the same pebble-echo edge as the writing box (its hair SVG is a
   sibling here), so the padding and radius match .spellin's — the box she copies into and
   the box she writes into are one and the same, drawn identically. */
/* Vertical padding only: the letters keep the full content width the locked font size was
   measured against, so a long word fills the box without wrapping. (The writing box can
   afford side padding because its <input> never wraps — it overflows instead; the trace is
   a wrapping element, so horizontal padding there would break a long word onto two lines.) */
.trace{position:relative; min-height:var(--tap); margin:0;
       padding:var(--s3) 0; border-radius:var(--r-md);
       display:flex; align-items:center; justify-content:center;}
/* When the screen is tight (landscape, keyboard up, big text) the box hugs the letters so
   the "type it to trace it" note and the syllable chips still fit above the keyboard — the
   breathing room inside the box is cheap to give up; the word and the box are not. */
:root[data-tight] .trace{padding-block:0;}
/* No line-height of its own: it inherits the app's base line-height, which is exactly
   what the writing box's <input> does too (.spellin sets no line-height). So the trace
   letters and the written letters share one line-box, and the trace box and the writing
   box come out the SAME height at every text scale — the box no longer "grows" ~10px on
   the trace->write flip. (It used to force 1.35 with a .08em descender pad, ~10px short of
   the input's inherited 1.7 line-box; the taller inherited line-box clears the descenders,
   so the pad is gone.) */
.tracew{width:100%; text-align:center; font-weight:700;
        letter-spacing:.06em; word-spacing:.1em; overflow-wrap:anywhere;
        position:relative; z-index:1;                 /* the lit letters ride above the hair */
        font-size:clamp(var(--t-xs), calc((min(100vw, 34rem) - 2 * var(--s4)) / (max(var(--wl,6), 12) * .8)), var(--t-3xl));}
.tracew .on{color:var(--ink);}                        /* copied — solid */
.tracew .off{color:var(--ink-soft);}                  /* not reached — the app's soft ink, still AA */
.tracew .now{color:var(--acc);}                       /* next — the letter she is on, lit green */
.tracew .slip{color:var(--retry);}                    /* re-trace (WIN-1): a letter she slipped on, orange until re-copied */
.tracein{position:absolute; inset:0; width:100%; min-height:var(--tap); border:0; padding:0;
         z-index:2;                                   /* the keyboard-catching layer, above both */
         background:transparent; color:transparent; -webkit-text-fill-color:transparent;
         caret-color:transparent; text-align:center; font:inherit;}
.tracein:focus{outline:none;}

/* overflow-wrap:anywhere because the praise carries her name, and a name with no
   break in it had nowhere to wrap: measured at 320px and her largest text, forty
   unbroken characters ran straight out of the 269px box. "Bartholomew-Wilhelmina" is
   fine — the hyphen is a break — so it takes something pasted or hammered into the
   name field to do it, which is exactly the case nothing else was catching. The word
   she is spelling has had this since it was written. */
.note{text-align:center; color:var(--ink-soft); margin:var(--s4) 0 0; font-size:var(--t-md);
      max-width:32ch; margin-left:auto; margin-right:auto; overflow-wrap:anywhere;}
/* Quieter than the instruction above it but not soft-grey: this is the only
   thing telling her which of two real words is wanted, so it stays on --ink at
   full contrast and the meaning itself is the bold part. */
/* 32ch, the same as .note above it: at 28ch the longest cue broke after "drive"
   and left "with" alone on a second line at her ordinary text size. */
.cue{text-align:center; font-size:var(--t-sm); color:var(--ink); margin:var(--s2) auto 0;
     max-width:32ch;}
.cue b{font-weight:700;}
.verdict{text-align:center; font-size:var(--t-md); font-weight:700; margin:0 0 var(--s2);}
.verdict.ok{color:var(--good);}

/* The hear-again cue (WIN-4): the speaker BUTTON is gone — on her word screen a tap
   anywhere (the word, the box, the space around it — never the keyboard) replays the word.
   Because there is no button to show that, if she sits ~8s without typing the bare speaker
   glyph (no box, no chrome) fades in below the box, then fades back the instant she types or
   taps. Same glyph the button used, at the same size; opacity is toggled by a data-attr so
   the shed-order audit sees one class, not a second 'shown' one that never renders. */
.hearcue{display:flex; justify-content:center; margin-top:var(--s3); color:var(--acc);
         opacity:0; transition:opacity var(--m-slow) var(--ease); pointer-events:none;}
.hearcue svg{width:calc(var(--t-xl) * var(--ornament)); height:calc(var(--t-xl) * var(--ornament)); flex:none;}
.hearcue[data-show]{opacity:1;}

/* The box she writes in is sized by the SAME rule as the trace and the checked word
   (LAY-1): a word is one locked size across every stage, big enough that a 12-letter
   word just fits and no bigger, so what she traced, wrote and had checked never changes
   size under her. Letter-spacing matches the trace's .06em too, or the same word would
   sit wider here than where she read it. --wl is inherited from .wordscreen. */
.spellinwrap{position:relative;}
.spellin{width:100%; text-align:center; font-weight:700;
         font-size:clamp(var(--t-xs), calc((min(100vw, 34rem) - 2 * var(--s4)) / (max(var(--wl,6), 12) * .8)), var(--t-3xl));
         letter-spacing:.06em; padding:var(--s3); border-radius:var(--r-md);
         background:transparent; border:0; position:relative; z-index:1;}
.spellin:focus{outline:none;}
/* Option 4 "pebble-echo" edge (WIN-2): the hair SVG draws the whole box behind the
   transparent input — a wobbly fill in her surface colour and a thin accent-green
   hand-drawn stroke that undulates like the pebbles. non-scaling-stroke keeps the line
   hairline-thin however the reference box is stretched to the real one. */
.hair{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; color:var(--acc);}
.hair path{fill:var(--surface-2); stroke:currentColor; stroke-width:1.3; vector-effect:non-scaling-stroke;
           stroke-linecap:round; stroke-linejoin:round;}

/* The word keeps ONE vertical position across every stage — look, write, check,
   success, correction — so the shape she memorised never jumps between screens.
   A three-row grid whose middle row is the word: the equal rows above and below
   hold everything else (progress, verdict, instruction / pieces, note) and fill
   without moving it. When the column is too tall to fit, the outer rows collapse
   to nothing and main scrolls, which is exactly when fitScreen sheds — so the
   squeeze still runs. The word block itself is unchanged; only where it sits is. */
.wordscreen{display:grid; grid-template-rows:1fr auto 1fr; min-height:100%; width:100%;}
.wordscreen > .above,
.wordscreen > .below{display:flex; flex-direction:column; align-items:center;
                     gap:var(--s2); width:100%;}
/* The above zone is the dots plus a RESERVED caption slot (.supra) — a constant height on every
   stage, so the dots hold one position, hugging the word, and never ride up and down as the
   meaning cue and the verdict come and go (they used to move by ~80px). One fixed skeleton: dots,
   the caption slot, the centred word, everything else below — only the content varies. */
.wordscreen > .above{align-self:end;}
/* The caption slot: the meaning cue (write) or the verdict (check) sit here, one line above the
   word. It holds that one line's height even when empty (sized to the taller caption, the verdict
   at --t-md), so nothing above or below it moves as a line appears or clears. On a tight screen it
   collapses — room matters more there than holding the dots perfectly still. */
.supra{min-height:calc(var(--t-md) * 1.7); display:flex; align-items:center; justify-content:center;
       width:100%;}
.supra > *{margin:0;}
:root[data-tight] .supra{min-height:0;}
.wordscreen > .wordslot{align-self:center; width:100%;}
.wordscreen > .below{align-self:start;}     /* sits just below the word */
/* The zone wrappers are invisible when empty so they add no stray gap. */
.wordscreen > :empty{display:none;}

/* (.primary and .iconbtn are gone: the only element that wore them was the miss verdict's
   wordless continue chevron, and a miss re-traces now (WIN-1) — she copies the word to move on,
   so there is no button. The grown-ups actions use .quiet; the winning word carries itself.) */
/* The winning word is the tap target that skips the auto-advance wait (id="advance"
   lives on it now, not on a verdict line — WIN-5). It is already a big touch area, so it
   needs no extra sizing; just show it is tappable. */
.word#advance{cursor:pointer;}
.quiet{display:block; width:100%; margin-top:var(--s3); min-height:var(--tap);
       border-radius:var(--r-md); color:var(--ink-soft); font-size:var(--t-md);
       font-weight:600; border:1px solid var(--line); background:var(--surface-2);}
.quiet:active{border-color:var(--line-2);}

/* ---------- finished ---------- */
/* Her finished screen: the line, then the picture in a window of its own, then the
   count. The window takes what is left and no more, so a small phone at the largest
   text shrinks the picture rather than pushing the count off the bottom. */
:root[data-stage=done] main{justify-content:space-between;}
:root[data-stage=done] main > :first-child{margin-top:0;}
:root[data-stage=done] main > :last-child{margin-bottom:0;}
.donenet{flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
         margin:var(--s4) 0;}
/* The picture takes the room that is there. width:100% alone left it as tall as it was
   wide and no taller, which on a phone wasted the whole middle of the screen. */
.donenet .net{margin:0; width:100%; height:100%; max-height:100%;}
.doneend{flex:none;}
/* Tonight's words arrive: a speck that swells and fills. */
.net-cell.arriving{transform-box:fill-box; transform-origin:center;
  transition:transform var(--m-slow) var(--ease), fill-opacity var(--m-slow) var(--ease),
             stroke-opacity var(--m-slow) var(--ease);}
.net.seeded .net-cell.arriving{transform:scale(.12); fill-opacity:0; stroke-opacity:0;}
.tick{text-align:center; font-size:calc(var(--t-4xl) * var(--ornament)); color:var(--acc); line-height:1;
      margin:var(--s2) 0 var(--s5);}
.headline{text-align:center; font-size:var(--t-xl); font-weight:700; margin:var(--s4) 0 var(--s1);}
.headline.cheer{color:var(--good);}

/* ---------- grown-ups ---------- */
.sect{margin-bottom:var(--s6);}
.sect h2{font-size:var(--t-xs); font-weight:800; letter-spacing:.14em; text-transform:uppercase;
         color:var(--ink-soft); margin-bottom:var(--s3);}
.field{margin-bottom:var(--s4);}
.field label, .field .lbl{display:block; font-size:var(--t-sm); font-weight:700; margin-bottom:var(--s1);}
.hint{font-size:var(--t-sm); color:var(--ink-soft); margin-top:var(--s1); max-width:42ch;}
.field input[type=text], .field textarea{
  width:100%; padding:var(--s3); border-radius:var(--r-md); background:var(--surface-2);
  border:1px solid var(--line-2); line-height:1.6;}
.field textarea{min-height:5.5rem; resize:vertical;}
/* Left to the browser, the placeholder is a fixed grey that ignores the colour
   scheme — 2.99:1 in dark mode. These carry real information about the format
   a list is expected in, so they sit on the same token as other soft text. */
.field input[type=text]::placeholder, .field textarea::placeholder{
  color:var(--ink-soft); opacity:1;}
.seg{display:flex; flex-wrap:wrap; gap:var(--s2);}
.seg button{min-height:var(--tap); padding:0 var(--s4); border-radius:var(--r-sm);
            border:1px solid var(--line-2); background:var(--surface-2); font-weight:600;
            color:var(--ink-soft); text-align:left;}
.seg button[aria-pressed=true]{background:var(--acc); color:var(--acc-ink); border-color:transparent;}
.swatch{position:relative; width:var(--tap); min-height:var(--tap); border-radius:var(--r-sm);
        border:2px solid var(--line-2); transition:transform var(--m-press) var(--ease);}
.swatch[aria-pressed=true]{border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-soft); transform:scale(1.07);}
.swatch[aria-pressed=true]::after{content:"✓"; position:absolute; inset:0; display:flex;
        align-items:center; justify-content:center; color:#35705A; font-size:var(--t-lg); font-weight:800;}
/* Three across is right until it isn't. These were flex:1 1 0 with no wrap, so at 320px
   and the largest text the three cards were squeezed to 81px and their contents simply
   painted over the edges: "215" crossed into the gap and "recorded" was cut to
   "recorde" by the next card. A basis in rem lets them drop to two-up and then one-up
   as her text grows, which is the whole reason the number is on the screen — a grown-up
   came to read it. 5rem is measured, not chosen: three across on a 320px phone have
   90px each and "215 recorded" wants 88 of them at her middle text size, so the basis
   has to be under that to keep three across there and over a third of the row once the
   text grows — 5.5rem is already too wide and wraps a screen that used to fit. */
.stats{display:flex; flex-wrap:wrap; gap:var(--s2);}
.stat{flex:1 1 5rem; min-width:0; padding:var(--s3); border-radius:var(--r-md);
      overflow-wrap:anywhere;
      background:var(--surface-2); border:1px solid var(--line);}
.stat b{display:block; font-size:var(--t-xl); font-weight:800; line-height:1.2;}
.stat span{display:block; font-size:var(--t-xs); line-height:1.4; color:var(--ink-soft);}
.danger{color:var(--retry); border-color:var(--retry)!important;}
.chips{display:flex; flex-wrap:wrap; gap:var(--s2);}
.chip{display:inline-flex; align-items:center; min-height:var(--tap);
      padding:var(--s1) var(--s3); border-radius:var(--r-sm); background:var(--surface-2);
      border:1px solid var(--line); font-size:var(--t-sm); font-weight:600;}
/* The playlist. One row per word: the word, then move-sooner, move-later and remove. Every
   control is a real 44px target, and the word takes the space that is left. */
.playlist{list-style:none; margin:var(--s3) 0 0; padding:0; display:flex;
          flex-direction:column; gap:var(--s2);}
.playlist li{display:flex; align-items:center; gap:var(--s2);
             padding:var(--s2) var(--s2) var(--s2) var(--s3); border-radius:var(--r-md);
             background:var(--surface-2); border:1px solid var(--line);}
.pw-word{flex:1 1 auto; min-width:0; overflow-wrap:anywhere; font-weight:600;
         font-size:var(--t-md); color:var(--ink);}
.pw-btn{flex:0 0 auto; min-width:var(--tap); min-height:var(--tap); border-radius:var(--r-sm);
        border:1px solid var(--line); background:var(--surface); color:var(--ink);
        font-size:var(--t-lg); font-weight:700; line-height:1;}
.pw-btn:disabled{opacity:.35;}
.pw-btn.rm{color:var(--retry);}
.pw-btn:active{border-color:var(--acc);}
/* The two pace steppers: a −, the number, a +. The buttons are .pw-btn, so they are
   already real 44px targets; the value between them is ink at full weight, never a faded
   grey, so it clears contrast on every tint. */
.stepper{display:flex; align-items:center; gap:var(--s3);}
.stepval{min-width:2ch; text-align:center; font-size:var(--t-lg); font-weight:800; color:var(--ink);}
/* Quieter by colour and weight, never by opacity. Opacity dims the text towards whatever
   happens to be behind it, so the same rule measured 2.26:1 on the blue tint and passed on
   cream — and the three places using it for this were the only contrast failures in 1220
   foreground/background pairs across the five tints in light and dark. --ink-soft is what
   "quiet" means here and it clears 4.5:1 on all ten of them by itself. */
.stamp{display:block; text-align:center; font-size:var(--t-xs); letter-spacing:.1em;
       color:var(--ink-soft); margin-top:var(--s6);}
/* A count or a language code beside a label: secondary because it is lighter in weight,
   which costs no contrast at all. These sit inside buttons whose own background changes
   with the tint and with whether the list is the open one, so there is no one colour that
   would be right on all of them — and dimming towards the background is exactly what must
   not happen on the green one. */
.aside{font-weight:400;}

/* Visible to a screen reader, not to the eye. */
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0;}
/* Out of sight but still focusable — display:none or visibility:hidden would
   drop the focus and let the keyboard go. */
#kbhold{position:fixed; bottom:0; left:0; width:1px; height:1px; opacity:0;
        border:0; padding:0; font-size:16px; pointer-events:none; z-index:-1;}

/* ---------- what she knows ---------- */
/* Everything drawn is inside the frame — the cells are what it is fitted to and the
   filaments are held inside it — so this clips nothing in practice. It stays as a
   guarantee that the picture can never spill over her words.
   One box, the same at every stage: full width of her column, and square, because
   the frame it crops is always let out to the same proportions. So the words under
   the picture do not move down the page as her map fills out. height:auto is what
   carries the frame's shape onto the page. */
.net{display:block; width:100%; height:auto; margin:var(--s2) auto var(--s3);
     overflow:hidden;}
/* The frame is a camera and it zooms in when there is little to show, so the
   strokes are pinned to the screen instead of scaling with it — otherwise a
   hairline becomes a rope on the day she has a dozen words. */
.net path{vector-effect:non-scaling-stroke;}
.net-link{fill:none; stroke:var(--line-2); stroke-width:.6; opacity:.45;}
.net-link.lit{stroke:var(--acc); opacity:.4; stroke-width:.9;}
/* Ghosted: what she has met, and a few days of what is coming, waiting to be
   filled. */
/* The second line round a word she has not met yet — see the sketch loop. Lighter
   than the word's own outline, so the pair reads as one sketched shape rather than
   as two words on top of each other. */
.net-sketch{fill:none; stroke:var(--line-2); stroke-width:.6; opacity:.55;}
/* The paper, painted in behind each cell so a thread passing under an empty
   outline does not read as a line struck through it. */
.net-plate{fill:var(--surface); stroke:none;}
.net-cell{fill:var(--acc); fill-opacity:var(--f, 0); stroke:var(--line-2); stroke-width:.8;}
.net-cell.met{stroke:var(--acc); stroke-opacity:.5;}
/* Known well keeps its own line even though the fill ramp now runs over all seven
   boxes and does more of the work. The tones are a gradient and you read a gradient
   by comparison: they say this word is further on than that one, and nothing about
   where the line is. This is the one threshold in the picture that has a number
   beside it — "known well" is a figure on the Progress card and in the caption — so
   it is the one place a grown-up may want to count, and a wash of green two steps
   darker than its neighbour is not something anybody counts. */
.net-cell.well{stroke:var(--acc); stroke-opacity:1; stroke-width:1;}

/* ---------- toast ---------- */
#toast{position:fixed; left:50%; bottom:calc(var(--s5) + env(safe-area-inset-bottom));
       transform:translateX(-50%); padding:var(--s3) var(--s4); border-radius:var(--r-md);
       background:var(--ink); color:var(--surface); font-size:var(--t-sm); font-weight:600;
       z-index:30; opacity:0; pointer-events:none; transition:opacity var(--m-quick) var(--ease);
       max-width:88vw; text-align:center;}
#toast.on{opacity:.96;}

/* The software keyboard takes half the screen, and at the larger text sizes that
   left the box she is typing into entirely off screen — she would have been
   spelling blind. This cannot be a height media query: rem in a media query
   resolves against the initial font size, not her chosen one, and on iOS the
   keyboard does not change the layout viewport at all. data-tight is set from
   visualViewport, measured against the real root font size. Scoped to the
   writing stage — on the grown-ups screen this would hide the way back out. */
/* The header and the trace note step aside on a tight screen. The progress DOTS do NOT any
   more — they are one small row, they fit even here (the header going reclaims more than they
   cost), and they were vanishing on exactly the screen this app is built for: large text with
   the keyboard up. If a screen is so tight that even they will not fit, fitScreen() still drops
   them, but only as the last resort (they are last in SHED_ORDER now). */
:root[data-tight]:not([data-stage=parent]) .bar,
:root[data-tight]:not([data-stage=parent]) .note{ display:none; }
:root[data-tight][data-stage=done] .tick{ display:none; }
/* With the keyboard up there is no room for a picture, and she is not looking at it
   then anyway — she is on her way to the next word. */
:root[data-tight][data-stage=done] .donenet{ display:none; }
:root[data-tight][data-stage=write] .spellin{ padding:var(--s2); }
:root[data-cramped][data-stage=write] .spellin{ font-size:var(--t-lg); letter-spacing:.08em; }
/* Landscape with a keyboard up leaves almost nothing. The action keeps a real
   44px target but stops scaling with her text, and the page padding tightens,
   so what she is looking at still has somewhere to be. */
:root[data-cramped]:not([data-stage=parent]) #act .quiet{
  min-height:calc(var(--tap) * var(--ornament)); font-size:var(--t-md); padding:0 var(--s3); }
:root[data-cramped]:not([data-stage=parent]) #app{
  padding-top:0; padding-bottom:var(--s1); }
:root[data-cramped][data-stage=done] .headline{ font-size:var(--t-lg); margin:0; }
/* The verdict is a caption; with this little room the word it captions wins. */
:root[data-tight][data-stage=check] .verdict{ font-size:var(--t-sm); margin:0; }
/* The word is fitted to the width it has, which says nothing about height. With
   this little of that, its ceiling comes down — a smaller word she can see beats
   a bigger one cut off at the edge of the panel. */
:root[data-cramped]:not([data-stage=parent]):not([data-stage=done]) .word{
  font-size:clamp(var(--t-xs), calc((min(100vw, 34rem) - 2 * var(--s4)) / (max(var(--wl,6), 12) * .8)),
                  var(--t-lg));}

/* Delays as well as durations. Killing only the duration left the finished
   screen's flourish fully choreographed: measured under reduce, the cells still
   arrived one at a time on their 0.18s, 0.38s, 0.58s… delays, so fourteen words
   was 2.8 seconds of things popping into view for someone who asked for no
   motion. Reduced motion means show me the end state, not run the same
   choreography with zero-length tweens. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important; animation-delay:0s!important;
                       transition-duration:.001ms!important; transition-delay:0s!important;}
}
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="bar"></div>
  <main id="screen"></main>
  <div id="act"></div>
</div>
<p id="say" class="sr" role="status" aria-live="polite"></p>
<!-- Holds the software keyboard open between stages. Without it the keyboard
     closes the moment the spelling box goes away, and the two buttons drop to the
     bottom of the screen and jump back up again on the next word — twice per
     word. Outside #app because it is not content: never in the tab order, never
     announced, and never seen by anything that walks her screens. -->
<input id="kbhold" type="text" tabindex="-1" aria-hidden="true" autocomplete="off"
       autocorrect="off" autocapitalize="off" spellcheck="false">
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* Bumped on every push, so a glance at the bottom of the grown-ups screen says
   whether the phone has the current build. Major goes up for a change she would
   notice; minor for a fix. */
var VERSION = '13.33';
var KEY = 'acorn.v1';

/* =========================================================
   1. Dates — always local. A 9pm session in Australia must not
   land on tomorrow's UTC date.
   ========================================================= */
var _today = null;                                  // tests only
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return _today || iso(new Date()); }
function parseISO(s){ var p = String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
// Math.round absorbs 23- and 25-hour daylight-saving days.
function dayDiff(a, b){ return Math.round((parseISO(a) - parseISO(b)) / 86400000); }

/* =========================================================
   2. State
   ========================================================= */
var S;
function fresh(){
  return {
    profile:  {name:'', createdAt:todayISO()},
    words:    {lists:[], mastery:bare(null), activeId:'easy', sessions:[]},
    settings: {textScale:1, tint:'cream', readAloud:true, sound:true, voice:null,
               speechRate:.95, kbInset:0, written:true, sawKeys:false,
               newMax:3, newMin:0}
  };
}
/* Every setting is chosen by tapping a button that offers a fixed handful of
   values, so anything else in storage is not a preference — it is corruption: a
   hand-edited backup, a truncated write, a stale key from an older shape. Most of
   it would degrade harmlessly. Two of them brick the app. A stored textScale of 99
   makes the root font 1683px and the screen scrolls sideways; a stored -4 makes it
   0px and nothing is visible at all. Neither is recoverable, because the way back
   is a long press on a mark that is now somewhere off the side of the screen — and
   nobody is going to guess at clearing the site's data. So each one is coerced to
   something the app actually offers. */
var TINTS = ['cream', 'peach', 'mint', 'blue', 'grey'];
// A band rather than the exact handful the buttons offer: a value from between the
// steps is harmless, and if the offered sizes ever change, a size she really did
// choose on an older build should not be thrown away.
function inBand(v, lo, hi, fallback){
  v = Number(v);
  return (isFinite(v) && v >= lo && v <= hi) ? v : fallback;
}
// A whole number the app actually offers, clamped into a band. Unlike inBand a value
// outside the band is pulled to the nearest edge rather than thrown away, because the
// pace steppers are bounded and a stored 9 means "as many as I can", not "corruption".
// Junk — a string, NaN, a negative, a fraction — falls back to the default.
function intBand(v, lo, hi, fallback){
  // Only a real, finite number is a value here; a string, null, an object, NaN are
  // corruption and take the default. A number outside the band is pulled to the nearest
  // edge rather than dropped, because the pace steppers are bounded and a stored 9 means
  // "as many as it goes to", not "throw this away". A fraction rounds to a whole step.
  if(typeof v !== 'number' || !isFinite(v)) return fallback;
  return Math.max(lo, Math.min(hi, Math.round(v)));
}
/* Every object in JavaScript already answers to "constructor", "toString",
   "valueOf", "hasOwnProperty", "isPrototypeOf", "toLocaleString" and
   "propertyIsEnumerable" — so a map keyed by her words answered truthy for those
   seven before she had ever met them. Measured: put "constructor" on her list and
   the engine filed it as already known, dropped it from every sitting, and never
   asked her once. The clip store had the same hole and would have handed a native
   function to an <audio> src.

   Assigning "__proto__" on an ordinary object is worse again: it moves the
   prototype instead of storing a value. A map with no prototype has neither
   problem and needs no guard at any of the twenty-odd places these are read, so
   every word-keyed map in the app is built here. */
function bare(o){
  var n = Object.create(null);
  if(o) for(var k in o) if(Object.prototype.hasOwnProperty.call(o, k)) n[k] = o[k];
  return n;
}
function saneSettings(t){
  if(!t || typeof t !== 'object' || Array.isArray(t)) t = fresh().settings;
  t.textScale  = inBand(t.textScale, .8, 1.6, 1);
  t.speechRate = inBand(t.speechRate, .5, 1.5, .95);
  t.tint       = TINTS.indexOf(String(t.tint)) >= 0 ? String(t.tint) : 'cream';
  t.readAloud  = t.readAloud !== false;
  t.sound      = t.sound !== false;
  t.written    = t.written !== false;
  // Remembered from a real observation, like kbInset: has this device ever reported a
  // keystroke? Only ever set by seeing one, so a false in storage is simply "not yet".
  t.sawKeys    = t.sawKeys === true;
  /* The two pace levers a grown-up can move. Every other setting here is chosen by
     tapping a button, so anything off the offered values is corruption; these are
     stepped by hand, so junk in storage — a string, NaN, a negative, a huge number —
     is coerced to a whole number inside the band the steppers allow, and never
     throws. newMax is new words on a flying day, newMin on a hard one, and newMin can
     never sit above newMax: a stored or typed newMin past the ceiling is dragged down
     to it, so the pair always reads mn ≤ mx however it arrived. */
  t.newMax = intBand(t.newMax, 0, 5, 3);
  t.newMin = intBand(t.newMin, 0, 3, 0);
  if(t.newMin > t.newMax) t.newMin = t.newMax;
  if(typeof t.voice !== 'string') t.voice = null;
  // Remembered from a real measurement, so a plausible band and nothing else.
  var kb = Number(t.kbInset);
  t.kbInset = (isFinite(kb) && kb > 40 && kb < 600) ? kb : 0;
  return t;
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      S = fresh();
      if(o && typeof o === 'object'){
        if(o.profile)  Object.assign(S.profile, o.profile);
        if(o.words)    Object.assign(S.words, o.words);
        if(o.settings) Object.assign(S.settings, o.settings);
      }
      if(!Array.isArray(S.words.lists)) S.words.lists = [];
      if(!Array.isArray(S.words.sessions)) S.words.sessions = [];
      if(!S.words.mastery || typeof S.words.mastery !== 'object') S.words.mastery = {};
      S.words.mastery = bare(S.words.mastery);
      // A restored backup can carry a list whose words are an object, so those
      // are rebased too. A list a grown-up pastes in is stored as an array.
      S.words.lists.forEach(function(l){
        if(l && l.words && typeof l.words === 'object' && !Array.isArray(l.words)) l.words = bare(l.words);
      });
      /* A first name, and nothing else. There is no cap on the field, so a hand-edited
         backup or a child with the phone can put any length in here, and it is rendered
         into the praise she reads. The wrap above stops it breaking the layout; this
         stops it being absurd in the first place. Trimmed, because " Ivy " should not
         come back as a name with spaces round it. */
      if(typeof S.profile.name !== 'string') S.profile.name = '';
      S.profile.name = S.profile.name.trim().slice(0, 32);
      S.settings = saneSettings(S.settings);
      markLists();
      return;
    }
  }catch(e){}
  S = fresh();
  markLists();
}
var _saveFailed = false;
// The exact text this window last wrote, so a save can tell another window's work from its
// own and skip the merge when there is nothing to merge.
var _wrote = '';
/* What the lists looked like when this window last read or wrote them, so a save can tell
   "I changed the lists" from "I am carrying an old copy of them". */
var _listsSeen = '[]';
function markLists(){

   two real pages: she answered a word and a grown-up changed the tint next door, and her
   answer was gone; a grown-up pasted this week's list and she answered next door, and the
   list was gone. Silently, both times.

   the parts that need it, and each by a rule that cannot lose work:

   - lists, per id: ids this window has never heard of are always kept. If this window has
     not touched the lists since it read them, storage's copy wins outright — that is a

   correctly spelled English word and she is marked wrong for spelling it. 14 of
   the 100 built-in words have a homophone; these are the ones where the other
   spelling is a word she plausibly knows and would plausibly reach for. Three
   of them ("metre", "licence", "practise") are the noun/verb pairs that adults
   get wrong, and no amount of listening will separate them.

   A spoken sentence is how a teacher does this, but the clips are one file per
   word and haveClips() refuses to mix recorded with synthesised, so the cue is
   on screen instead. Rules it has to keep: never contain the word or its
   letters, never name the other spelling (a wrong spelling on screen is the one
   thing this app never shows her), and stay short enough to be read at a glance
   — she is dyslexic and every extra word is work. Left out on purpose: "time"
   (thyme), "knee" (nee) and "rain" (rein) — nobody writes those, and a cue
   there is noise. */
var MEANING = bare({
  some:     'not all of it',
  made:     'make, but yesterday',
  week:     'seven days',
  through:  'in one end, out the other',
  might:    'maybe',
  know:     'have the answer',
  write:    'with a pen',
  morning:  'before lunch',
  // Not "a hundred centimetres": that hands her m-e-t-r-e inside the last word
  // of its own cue. One big step is the classroom picture of a metre anyway.
  metre:    'about one big step',
  licence:  'the card you drive with',
  practise: 'to get better at it',

  /* And the other half of each pair, because homophones are a spelling topic in
     their own right: the list a grown-up pastes in this week could easily hold
     both. Cue only one of a pair and the uncued one becomes the unanswerable
     question instead. None of these are on a built-in list — they are here for
     the lists she is actually set at school. Not paired: license, practice and
     meter, whose difference from licence, practise and metre is noun-against-verb
     and cannot be put to a nine-year-old without a grammar lesson. */
  weak:     'not strong',
  sum:      'add them up',
  maid:     'she cleans the rooms',
  threw:    'throw, but yesterday',
  right:    'not wrong',
  no:       'the opposite of yes',
  mite:     'a tiny bug',
  mourning: 'sad, missing someone',

  /* The ones a school list actually holds. The set above came out of auditing the
     built-in corpus, and it covers that corpus — but the comment above says these
     exist for the lists she is set at school, and the commonest homophone in a
     British Year 4 spelling list was not in it at all. Heard aloud, "their" is
     three different words and she had no way to know which. Same for your, its,
     hear, one, new, see, where and blue.
     Left out on purpose: to, too and two, and for and four. Two and four can be
     cued and to and for cannot — they are function words with no meaning to give a
     nine-year-old — and cueing half of a set is worse than cueing none of it,
     because the uncued one becomes the unanswerable question. The same reasoning
     that left license, practice and meter alone. */
  their:    'belonging to them',
  there:    'in that place',
  "they're":'they are',
  your:     'belonging to you',
  "you're": 'you are',
  its:      'belonging to it',
  "it's":   'it is',
  hear:     'with your ears',
  here:     'in this place',
  one:      'the number after zero',
  won:      'win, but yesterday',
  "new":    'not old',
  knew:     'know, but yesterday',
  see:      'with your eyes',
  sea:      'salty water with waves',
  where:    'which place',
  wear:     'put clothes on',
  blue:     'the colour of sky',
  blew:     'blow, but yesterday'
});
function meaningOf(w){ return MEANING[String(w || '').toLowerCase()] || ''; }
// "a", "a and i", "a, i and d" — read aloud, a bare comma list runs together.
function listOf(xs){
  if(xs.length < 2) return xs.join('');
  return xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
}
/* The sets the cues exist for. Nothing in the app reads this — it is here so a test can
   hold every cue to not naming any word it is meant to be told apart from, and so the two
   halves cannot drift apart unnoticed.
   Sets rather than pairs, because "their" is one of three. Held as pairs, a third member
   could only be recorded as somebody's twin and the leak check then tested one of the two
   words a cue must not name and silently skipped the other. */
var TWINS = [['some','sum'], ['made','maid'], ['week','weak'], ['through','threw'],
             ['might','mite'], ['know','no'], ['write','right'], ['morning','mourning'],
             ['metre','meter'], ['licence','license'], ['practise','practice'],
             ['their','there',"they're"], ['your',"you're"], ['its',"it's"],
             ['hear','here'], ['one','won'], ['new','knew'], ['see','sea'],
             ['where','wear'], ['blue','blew']];

function allLists(){
  return LISTS.map(function(l){ return {id:l.id, name:l.name, words:l.words, builtIn:true}; })
    .concat((S.words.lists || []).map(function(l){ return {id:l.id, name:l.name, words:l.words, builtIn:false}; }));
}
function activeList(){
  var all = allLists();
  return all.filter(function(l){ return l.id === S.words.activeId; })[0] || all[0];
}
function wordsOf(list){
  if(!list) return [];
  return Array.isArray(list.words) ? list.words.slice() : Object.keys(list.words);
}
/* The one editable pool a grown-up curates — the playlist. A single custom list with a
   fixed id, found here and created on first add. Its word order is the queue of words she
   has not met yet, so moving a word to the top makes it the next she meets. */
var OWN_ID = 'own';
function ownList(){
  return (S.words.lists || []).filter(function(l){ return l.id === OWN_ID; })[0] || null;
}
/* iOS Smart Punctuation is on by default and a web page cannot turn it off —
   autocorrect="off" does not touch it — so the box she types in gets a curly ’
   whether anyone wants one or not. A list pasted out of a newsletter or a Word
   document brings the same characters in from the other end. Both are tidied to
   the plain ones the word lists use, so she is never marked wrong for what her
   keyboard did, and never taught "dont" because a paste dropped the apostrophe
   instead of fixing it. */
function tidyPunct(text){
  return String(text == null ? '' : text)
    /* An accented letter, taken back to the letter under it. A school list can hold
       "cafe", "facade" or "creche" with their accents on, and the same word arrives from
       the clipboard in either of two Unicode forms. Decomposed — base letter plus a
       combining mark — the mark was already being dropped as a non-letter and the word
       came out right. Precomposed, the whole character is one code point and was dropped
       entire: "cafe" became "caf", "naive" became "nave", "facade" became "faade". Same
       word, different result, and the broken one is the form most software produces.
       NFD splits every precomposed character into base plus marks, so removing the marks
       leaves the letter behind either way. Both her typed answer and a pasted list come
       through here, so an accent she types matches a list stored without one. */
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[\u2018\u2019\u201A\u201B\u2032\u00B4`]/g, "'")
    // Hyphen substitutes only. An em dash is punctuation between words, never a
    // hyphen inside one, so it is left to be treated as a separator.
    .replace(/[\u2010\u2011\u2012\u2013\u2212]/g, '-');
}
// Reading her answer, be generous about which dash came out: typing "--" on a
// phone puts an em dash in the box. Reading a pasted list, an em dash is a
// separator between words, so it is not folded there.
function tidyTyped(text){ return tidyPunct(text).replace(/[\u2014\u2015]/g, '-'); }
/* Her answer, with the phone's punctuation taken off the ends. Typed for real on an
   iPhone, "said." was marked wrong and her box for the word dropped from 2 to 1 — a
   double-tapped space inserts ". " on iOS and the comma key sits against the space bar,
   so she was penalised for a keystroke she did not mean on a word she had spelled
   correctly. Only the ends, so "sa id" stays wrong, and apostrophes and hyphens survive
   because a target word can contain them: parseWordList keeps both. */
function typedLetters(text){
  return tidyTyped(text).trim().toLowerCase()
    .replace(/^[^a-z'-]+/, '').replace(/[^a-z'-]+$/, '');
}
// Whatever the school sends: commas, new lines, numbering, stray bullets.
function parseWordList(text){
  return tidyPunct(text)
    /* The zero-width characters split words too. They are invisible, \s does not match
       them, and copying out of a PDF or a web page puts them between words as a matter
       of course — so "said\u200bthey\u200bwent" fell through the split as one token, had
       them stripped out as non-letters further down, and saved a single twelve-letter
       non-word with a confident "1 word saved." She would then be asked to spell
       "saidtheywent" every evening and could never get it right. Zero-width space,
       non-joiner, joiner, word joiner and the byte-order mark. A soft hyphen is not
       here on purpose: it is a hyphenation hint inside a word, and dropping it as a
       non-letter — which already happens — turns "beau\u00adti\u00adful" back into
       "beautiful", which is the right answer. */
    .split(/[\s,;\u2014\u2015\u200b\u200c\u200d\u2060\ufeff]+/)
    .map(function(w){
      return w.replace(/^[\d]+[.)]?/, '')
              .replace(/[^A-Za-z'\-]/g, '')
              // Bullets and stray quotes cling to the ends of pasted words.
              .replace(/^[-']+|[-']+$/g, '')
              .toLowerCase();
    })
    // Two letters up to the longest word a child would be set — anything
    // longer came from pasting something that wasn't a word list.
    .filter(function(w){ return w.length >= 2 && w.length <= 24; })
    .filter(function(w, i, a){ return a.indexOf(w) === i; });
}

/* =========================================================
   5. Syllables. Built-in lists carry hand-checked splits; this
   only has to serve words a grown-up pastes in, where readable
   chunks matter more than dictionary perfection.
   ========================================================= */
var ONSET_DIGRAPHS = ['ch','sh','th','ph','wh'];      // lead the next syllable: mo·ther
var CODA_DIGRAPHS  = ['ck','ng','gh'];                // close the previous one: neigh·bour
var DIGRAPHS = ONSET_DIGRAPHS.concat(CODA_DIGRAPHS);
// Consonant + liquid starts a syllable (ta·ble). s-clusters do not: medially the
// s closes the syllable before it (bas·ket, lis·ten, ques·tion).
var ONSET_BLENDS = ['bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','tr','tw','thr','shr'];
// Everything English will actually start a syllable with. Not the same list:
// ONSET_BLENDS is about where to prefer a cut, this is about whether a chunk can
// be said at all. "tn" and "dl" are on neither, which is the whole point —
// for·tnight and frien·dly are chunks nobody can read aloud.
var ONSET_CLUSTERS = ONSET_BLENDS.concat(ONSET_DIGRAPHS,
  ['gu','qu','sc','sk','sl','sm','sn','sp','st','sw','dw','kn','wr','gn',
   'str','spr','scr','spl','squ','chr','phr']);
function sayableOnset(c){ return c.length < 2 || ONSET_CLUSTERS.indexOf(c) >= 0; }
var VOWEL_DIGRAPHS = ['ai','ay','ea','ee','ei','ey','ie','oa','oe','oi','oo','ou','ow','oy',
                      'ue','ui','au','aw','eu','ew','ya','ye','yo'];
// Suffixes that are never part of a root, so the stem can always be kept whole:
// morn·ing, talk·ing, thought·ful. The rest need the digraph guard below, because
// spelling alone cannot tell wa·ter from wat·er, or sa·cred from sacr·ed.
var SUFFIXES_FREE = ['ing','ful','ness','less','ment','able','ible'];
var SUFFIXES = SUFFIXES_FREE.concat(['er','est','ly','ed']);
// Compounds. No rule reads a word boundary out of spelling — "therefore" comes
// out "the·re·fore" and "anything" comes out "a·nyth·ing" — so the common ones
// a Year 4/5 list actually contains are hand-split here.
var COMPOUNDS = ('any·thing any·one any·where any·body every·thing every·one every·where '
  + 'every·body every·day some·thing some·one some·where some·times no·thing no·body no·where there·fore '
  + 'with·out with·in him·self her·self my·self your·self it·self them·selves our·selves '
  + 'can·not in·to up·on up·stairs down·stairs out·side in·side be·side along·side '
  + 'birth·day play·ground foot·ball net·ball week·end break·fast after·noon '
  + 'grand·mother grand·father grand·parents news·paper hand·writing some·body '
  + 'class·room bed·room bath·room black·board white·board day·light sun·light '
  + 'to·day to·night to·mor·row').split(' ')
  // Keyed by her words, so no prototype: COMPOUNDS["constructor"] otherwise
  // answered with Object itself and syllables() crashed the whole render on
  // .slice() — the app died on the word rather than mis-splitting it.
  .reduce(function(m, x){ m[x.replace(/·/g, '')] = x.split('·'); return m; }, bare(null));

/* Researched splits for the common words the letter-rule syllabifier gets wrong — checked one
   at a time against a dictionary rather than calculated (David, 2026-07-31: "don't try [to]
   calculate syllables, just research each word"). The rule over-splits a vowel it should keep
   with its consonant ("e·ve·ry·bo·dy", "dif·fe·rent", "pe·o·ple", "de·li·ci·ous") and under-
   splits an -ible/-le it should break ("terr·ible", "poss·ible", "sci·ence" as one). The words
   she meets on the built-in lists are already hand-split there; this covers the ones a grown-up
   might paste in, so a custom list is as right as the built-in ones. Same seams, same spoken
   pieces. Consulted before COMPOUNDS and the rule; every entry is verified to spell its word by
   tests/syllables-quality.spec.js. Not exhaustive — the rule is still the last resort — but it
   fixes the common Year 3-6 words outright. */
var SYLLABLES = (
    'an·oth·er fam·i·ly peo·ple an·i·mal an·i·mals el·e·phant di·no·saur com·put·er tel·e·phone '
  + 'choc·o·late eve·ning par·a·graph tem·per·a·ture dan·ger·ous de·li·cious care·ful·ly '
  + 'in·ter·est·ing ter·ri·ble hor·ri·ble pos·si·ble im·pos·si·ble in·vis·i·ble com·fort·a·ble '
  + 'veg·e·ta·ble li·brar·y or·di·nar·y nec·es·sar·y en·gine sci·ence ex·per·i·ment '
  + 'e·lec·tric·i·ty i·mag·i·na·tion in·for·ma·tion ed·u·ca·tion cel·e·bra·tion pop·u·la·tion '
  + 'e·lev·en mil·lion cal·en·dar cat·er·pil·lar sep·a·rate gov·ern·ment busi·ness or·ange '
  + 'col·our qui·et·ly prob·a·bly ac·tu·al·ly u·su·al·ly dif·fer·ent fa·vour·ite ba·nan·a '
  + 'im·por·tant re·mem·ber un·der·stand be·gin·ning po·ta·to to·ma·to gi·raffe croc·o·dile '
  + 'oc·to·pus but·ter·fly '

  // syllable on a short vowel it should close (cam·er·a not ca·me·ra, de·vel·op not de·ve·lop,
  // prob·lem not pro·blem) and mishandles -tion/-sion/-cious/-geous and the g/ght clusters
  // (na·tion·al not na·tio·nal, pre·cious not pre·ci·ous, fright·en not frigh·ten).

  + 'trans·port sand·wich ti·tle straight·en fright·en light·ning sen·si·ble tab·let prob·lem '
  + 'pub·lic pub·lish tri·an·gle rec·tan·gle in·cred·i·ble suit·a·ble de·scribe me·chan·ic '
  + 'med·i·cine nat·u·ral pop·u·lar sev·er·al gen·er·al gen·er·ous de·vel·op cam·er·a com·e·dy '
  + 'gal·ler·y mem·o·ry mel·o·dy en·er·gy sal·ad met·al meth·od sol·id pan·ic plan·et van·ish '
  + 'pun·ish man·age pal·ace bal·ance prom·ise prop·er prod·uct proj·ect pres·ent pris·on '
  + 'rec·i·pe rec·ord sec·ond strat·e·gy qual·i·ty grav·i·ty trav·el con·sid·er con·tin·ue '
  + 'lit·er·a·ture tel·e·scope mag·a·zine skel·e·ton reg·u·lar rel·a·tive pos·i·tive pyr·a·mid '
  + 'vin·e·gar vis·i·tor vit·a·min vol·ume val·ue fa·mil·iar sim·i·lar how·ev·er wiz·ard '

function suffixSplit(s){
  for(var i = 0; i < SUFFIXES.length; i++){
    var suf = SUFFIXES[i];
    if(s.length <= suf.length + 3 || s.slice(-suf.length) !== suf) continue;
    var stem = s.slice(0, -suf.length);
    if(SUFFIXES_FREE.indexOf(suf) < 0 && DIGRAPHS.indexOf(stem.slice(-2)) < 0) continue;
    return [stem, suf];
  }
  return null;

function syllables(word){
  var s = String(word || '').toLowerCase().replace(/[^a-z'-]/g, '');
  // Hyphens are word boundaries: syllabify each side and keep the hyphen with
  // the part before it, so the pieces still spell the word she is looking at.
  if(s.indexOf('-') > 0 && s.slice(-1) !== '-'){
    var bits = s.split('-'), out = [];
    bits.forEach(function(bit, n){
      var parts = bit ? syllables(bit) : [];
      if(n < bits.length - 1) parts = parts.length ? parts.slice(0, -1).concat([parts[parts.length-1] + '-'])
                                                  : ['-'];
      out = out.concat(parts);
    });
    return out.filter(Boolean);
  }
  s = s.replace(/-/g, '');
  if(s.length <= 3) return s ? [s] : [];

  if(SYLLABLES[s]) return SYLLABLES[s].slice();      // researched split wins over the rule
  if(COMPOUNDS[s]) return COMPOUNDS[s].slice();

  var suf = suffixSplit(s);
  if(suf) return syllables(suf[0]).concat([suf[1]]);

  function isV(c, i){ return 'aeiou'.indexOf(c) >= 0 || (c === 'y' && i > 0); }

    // 'qu' and 'gu' before another vowel are consonants: quiet, guard, language,
    // tongue. When the u is the nucleus ('re·gu·lar') j === i and this is skipped.
    if(s[i] === 'u' && i > 0 && 'qg'.indexOf(s[i-1]) >= 0 && j > i) a = i + 1;
    // A vowel run is usually one sound (rain) but sometimes two (li·on). Split
    // the pairs that aren't digraphs, keeping -tion/-sion/-cial intact.
    var start = a;
    for(k = a; k < j; k++){

      var oneSound = VOWEL_DIGRAPHS.indexOf(pair) >= 0

    groups.push([start, j]);

  // A final consonant + "le"/"re" is its own syllable (ta·ble, cen·tre);
  // otherwise a silent final 'e' is not a nucleus (com·plete).
  var leEnding = /[^aeiou](le|re)$/.test(s);
